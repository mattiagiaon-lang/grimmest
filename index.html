<script>window.__storia={"paola":[{"id":"stazione","flags":["stazione_aperta"],"first":["Mamma: Il treno ferma di nuovo a Sasso! Stamattina ho sentito il fischio e ho pianto nel caffellatte.","Ho subito riordinato l’armadio dei viaggi. Per ogni evenienza."],"extra":[["Mamma: Ho fatto l’orario dei treni plastificato. Uno per te, uno per Lucio, uno di scorta. Lucio ha già perso il suo."]]},{"id":"juicy","flags":["juicy_tornato"],"first":["Mamma: È tornato Marco! Cioè, Juicy. Per me resta Marco: gli ho cambiato i pannolini quando era piccolo.","Mi raccomando, in studio: pause regolari e acqua. La voce è uno strumento delicato."],"extra":[["Mamma: Marco mi ha chiesto di non chiamarlo Marco davanti alla gente. Io gli ho chiesto di non lasciare le scarpe in mezzo. Siamo pari."]]},{"id":"wattia","flags":["fan:wattia"],"first":["Mamma: Quindi quel ragazzo dorme in soggiorno nel sacco a pelo. Wattia, giusto?","Devo dire che è educato. Piega la coperta in quattro e lascia le scarpe allineate. Lo approvo.","…Quasi. Fa dei rumori strani di notte. Dice che sono le tubature."],"extra":[["Mamma: Wattia stamattina mi ha portato il caffè a letto. Era freddo e senza zucchero. Ma il pensiero era caldissimo."],["Mamma: Tesoro, Wattia ti guarda come Lucio guarda me quando trovo le sue chiavi. Te lo dico e basta."]]},{"id":"dichiarato","flags":["wattia_dichiarato"],"first":["Mamma: Allora, il ragazzo del sacco a pelo… al concerto, davanti a tutto il paese. Che romantico.","Gli ho preparato una coperta più bella. Piegata con amore. E in quattro."]},{"id":"sposi","flags":["mamma_lucio_sposi"],"first":["Mamma: Sto organizzando il matrimonio. Ho tre quaderni: invitati, menù, piano di emergenza se Lucio perde l’anello.","Il terzo è il più spesso."],"extra":[["Mamma: Tu canti, Beba porta le fedi. Ho già comprato il cuscinetto. Lucio dice che Beba le mangerà. Lucio non conosce Beba."]]},{"id":"cittadina","flags":["cittadina_onoraria"],"first":["Mamma: Cittadina onoraria di Sasso Marconi. Mia figlia. Ho incorniciato la pergamena e l’ho appesa in salotto, perfettamente in bolla.","Quel signore, Guglielmo… dove sarà finito? Io dico che certe persone non se ne vanno mai davvero."]},{"id":"documentario","flags":["documentario_fatto"],"first":["Mamma: Ho visto il documentario. Tuo nonno Paolo che ride dietro la videocamera…","Scusa, mi è entrato qualcosa nell’occhio. Polvere. In casa mia non c’è polvere. Allora è altro."]}],"beba":[{"id":"stazione","flags":["stazione_aperta"],"first":["Beba drizza le orecchie a ogni fischio del treno e guarda verso la stazione, coda alta. Il paese ha un rumore nuovo, e le piace."]},{"id":"wattia","flags":["fan:wattia"],"first":["Beba ha preso l’abitudine di dormire attaccata al sacco a pelo di Wattia. Di giorno fa finta di niente."]},{"id":"concerto","flags":["finale_concerto"],"first":["Beba ha ancora un ritornello in testa: ogni tanto, mentre cammina, fa un piccolo ululato intonato. Più o meno."]},{"id":"documentario","flags":["documentario_fatto"],"first":["Beba annusa la vecchia videocassetta che Grimo tiene nello zaino e scodinzola piano, come se ci sentisse dentro un odore di casa."]}],"lucio":[{"id":"stazione","flags":["stazione_aperta"],"first":["Lucio: Il treno! Finalmente posso andare a Bologna a comprare i pezzi per la bici. Li perderò in treno, ma ci vado."]},{"id":"wattia","flags":["fan:wattia"],"first":["Lucio: Wattia e io abbiamo fatto un patto: lui non mi ruba i calzini, io non gli rubo i biscotti. Lui ha già violato il patto. Anche io."]},{"id":"sposi","flags":["mamma_lucio_sposi"],"first":["Lucio: Ha detto sì. A me. Davanti a tutti. Ancora non ci credo.","Ho messo l’anello in un posto sicurissimo. Adesso devo solo ricordarmi quale."]}],"edo":[{"id":"stazione","flags":["stazione_aperta"],"first":["Edo: Sorellina, il treno è perfetto per il mio film: una carrellata da Bologna a Sasso. Mi accompagni in stazione? Da solo mi perdo nei binari."]},{"id":"juicy","flags":["juicy_tornato"],"first":["Edo: Juicy mi ha chiesto di fare il video della tua canzone. Io ho detto sì prima ancora che finisse la domanda."]},{"id":"wattia","flags":["fan:wattia"],"first":["Edo: Il ragazzo nel sacco a pelo… Wattia. Lo voglio nel mio film. Ha una faccia da protagonista romantico.","Sorellina, sei arrossita? Lo metto nel film anche questo."]},{"id":"concerto","flags":["finale_concerto"],"first":["Edo: Ho girato tutto il concerto da tre angolazioni. Una era da sdraiato sotto il palco. La migliore.","Ti voglio bene, sorellina. E adesso mi aiuti a montarlo?"]}],"papa_v":[{"id":"visita","flags":["stazione_aperta"],"first":["Papà: Sasso Marconi è come me la raccontavi, Grimo. Più bella, anzi. Ornella… cioè Orietta… insomma lei dice che vorrebbe trasferirsi."]},{"id":"wattia","flags":["fan:wattia"],"first":["Papà: Mi hanno detto che un certo Wattia dorme da voi. Simpatico? Onesto? Lavora? Mangia la crosta del pane?","Scherzo. Sono tuo padre, devo fare queste domande. Lorella dice che sono geloso. Non sono geloso. Sono attento."]},{"id":"concerto","flags":["finale_concerto"],"first":["Papà: Ti ho vista sul palco e ho pianto come un vitello. Fiorella mi ha prestato tutti i fazzoletti. Poi anche la sciarpa."]}],"rosa":[{"id":"stazione","flags":["stazione_aperta"],"first":["Rosa: Da quando ferma il treno al Tamarindo ho il triplo dei clienti. Ho comprato tazze nuove. E un cartello: «Il caffè come viene».","I turisti pensano che sia un nome artistico."]},{"id":"wattia","flags":["fan:wattia"],"first":["Rosa: Quel ragazzo, Wattia, viene ogni mattina a prendere due cornetti. Uno per lui e uno «per un’amica». Sì, sì. Un’amica."]},{"id":"guglielmo","flags":["guglielmo_visto"],"first":["Rosa: Ogni mattina preparo una tazzina in più, vicino alla finestra. Non so per chi. O forse sì.","…Chiacchiere da Tamarindo. Lascia stare."]}],"ada":[{"id":"stazione","flags":["stazione_aperta"],"first":["Signora Ada: Il treno è tornato, cara. Guglielmo diceva che un paese senza treno è come una lettera senza francobollo: arriva, ma tardi."]},{"id":"concerto","flags":["finale_concerto"],"first":["Signora Ada: Al concerto ho pianto un pochino. Solo un pochino. Era l’umidità. Lo diceva anche Guglielmo, dell’umidità."]},{"id":"guglielmo","flags":["guglielmo_visto"],"first":["Signora Ada: Te l’avevo detto, cara: arriva quando serve. Poi le onde se lo riportano via.","Stanotte la mia radiolina si è accesa da sola. Suonava la tua canzone. Ho lasciato fare."]}],"ivo":[{"id":"stazione","flags":["stazione_aperta"],"first":["Ivo: Capostazione Ivo, prego. Ho anche il berretto. Me lo sono fatto da solo, con un cappello e un po’ di coraggio."]},{"id":"concerto","flags":["finale_concerto"],"first":["Ivo: Il treno delle venti pieno di gente per il tuo concerto. Ho dovuto aggiungere una carrozza. Cioè, ho chiesto. Me l’hanno data. Che emozione."]},{"id":"guglielmo","flags":["guglielmo_visto"],"first":["Ivo: Quella notte non è partito nessun treno. Nessuno. L’ho controllato tre volte sul registro.","Però la radio della biglietteria ha fischiato: uno lungo e tre corti."]}],"juicy":[{"id":"concerto","flags":["finale_concerto"],"first":["Juicy: Collega, dopo il concerto mi hanno chiamato da mezza Italia. Io rispondo «Juicy Gustavo», loro dicono «Marco?». Tua mamma ha parlato con tutti."]},{"id":"documentario","flags":["documentario_fatto"],"first":["Juicy: Il documentario è montato. Tuo nonno Paolo che ti riprende al belvedere… collega, quella è la tua prima canzone. Lui l’aveva già capito."]}],"dario":[{"id":"stazione","flags":["stazione_aperta"],"first":["Silvia: Col treno arrivano le comitive e io ho finito i borlenghi due volte in una mattina. Due volte! Sto pensando di assumere Beba come assaggiatrice."]},{"id":"wattia","flags":["fan:wattia"],"first":["Silvia: Il tuo amico Wattia ha provato il borlengo con la nutella. Poi con la mortadella. Poi tutti e due insieme. Ho dovuto sedermi."]}],"teresa":[{"id":"stazione","flags":["stazione_aperta"],"first":["Teresa: Col treno arrivano clienti da Bologna che chiedono il pane «artigianale». Gli rispondo che è il pane. Punto."]},{"id":"concerto","flags":["finale_concerto"],"first":["Teresa: Al concerto ho finito le ciambelle al secondo ritornello. Per la prossima volta ne faccio il doppio. E tu canti il doppio."]}],"marta":[{"id":"stazione","flags":["stazione_aperta"],"first":["Marta: Col treno la posta arriva il giorno stesso. Le mie ginocchia sono felici. Le mie gambe un po’ meno: ora ci sono più lettere."]},{"id":"disco","flags":["finale_visto"],"first":["Marta: Ti arrivano lettere da Parigi, Berlino, Madrid! Ammiratori. Una è di un signore di Bologna che ti chiede l’autografo per la nipote. È mio cugino."]}],"nico":[{"id":"juicy","flags":["juicy_tornato"],"first":["Nico: Con Juicy in paese si sente musica dappertutto. Ieri ho accordato la chitarra sulla sua sveglia."]},{"id":"concerto","flags":["finale_concerto"],"first":["Nico: Suonare con te sul palco, Grimo… Non dimenticherò mai la faccia di Lucio quando gli ho ripreso la chitarra."]}],"wattia":[{"id":"studio","flags":["wattia_studio"],"first":["Wattia: Ogni tanto canticchio il coro che abbiamo fatto in studio. Stonato. Lo so. Ma è il nostro coro."]},{"id":"skate","flags":["wattia_skate"],"first":["Wattia: Baby Boss mi ha dato un soprannome: «Ginocchio». Credo sia un complimento. Spero."]},{"id":"dichiarato","flags":["wattia_dichiarato"],"first":["Wattia: Grimo… quello che ho gridato al concerto. Lo penso ancora. Anzi, di più.","Il lago, lo studio, i pattini. E tutto il resto, se vuoi."]}],"giulia_p":[{"id":"braccialetto","flags":["giulia_braccialetto"],"first":["Giulia di Sette: Hai ancora il braccialetto? Io sì. Si è già sfilacciato. Vuol dire che funziona."]},{"id":"concerto","flags":["finale_concerto"],"first":["Giulia di Sette: Ho fatto vedere il video del concerto a tutti quelli che conosco. Anche al pizzaiolo. Gli è scesa una lacrima nella margherita."]}],"babyboss":[{"id":"skate","flags":["wattia_skate"],"first":["Baby Boss: Il tuo amico Wattia è caduto undici volte. Undici! Però si è sempre rialzato. Ha stile."]},{"id":"concerto","flags":["finale_concerto"],"first":["Baby Boss: Al concerto ho fatto la ola da solo. Poi l’hanno fatta tutti. Sono un capo."]}],"gino":[{"id":"stazione","flags":["stazione_aperta"],"first":["Gino: Col treno è arrivato anche mio nipote. Mi aiuta coi recinti. Brontoliamo in due, si fa prima."]},{"id":"concerto","flags":["finale_concerto"],"first":["Gino: Il mio carro è diventato un palco. Le galline non ci avrebbero mai creduto."]}]};</script>

<script>
(function(){
  var P="grimo-beba:",TK=P+"__t",ls=null;try{ls=window.localStorage}catch(e){}
  if(!ls)return;
  var S=Storage.prototype,rawGet=S.getItem,rawSet=S.setItem,rawRem=S.removeItem,quiet=false;
  function get(k){return rawGet.call(ls,k)}
  function times(){try{return JSON.parse(get(TK)||"{}")}catch(e){return{}}}
  function saveTimes(m){try{rawSet.call(ls,TK,JSON.stringify(m))}catch(e){}}
  var dirty={},timer=null,ready=false,col=null,cloud={},pushing=false;
  function touch(k){if(quiet||k.indexOf(P)!==0||k===TK)return;var m=times();m[k]=Date.now();saveTimes(m);dirty[k]=1;sched()}
  S.setItem=function(k,v){rawSet.call(this,k,v);if(this===ls)touch(String(k))};
  S.removeItem=function(k){rawRem.call(this,k);if(this===ls)touch(String(k))};
  // 12 novembre: partite salvate prima di questo momento cancellate (qui e nell account), una volta sola; le partite nuove restano
  var RT=1794481037651;(function(){var m=times(),ks=[];for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&k.indexOf(P)===0&&k!==TK&&k!==P+"audio"&&(m[k]||0)<RT)ks.push(k)}if(!ks.length)return;ks.forEach(function(k){rawRem.call(ls,k);delete m[k]});saveTimes(m)})();
  function sched(d){if(!ready)return;clearTimeout(timer);timer=setTimeout(push,d==null?2500:d)}
  async function push(){
    if(!ready||pushing)return;pushing=true;
    try{var keys=Object.keys(dirty);dirty={};var m=times();
      for(var i=0;i<keys.length;i++){var k=keys[i],v=get(k);
        try{if(v==null){await col.doc(k).delete();delete cloud[k]}
            else if(v.length<240000){var t=m[k]||Date.now();await col.doc(k).set({v:v,t:t});cloud[k]=t}}
        catch(e){if(!e||e.code!=="invalid_argument"&&e.code!=="quota_exceeded")dirty[k]=1}}
    }finally{pushing=false}
    if(Object.keys(dirty).length)sched(8000);
  }
  document.addEventListener("visibilitychange",function(){if(document.hidden)setTimeout(function(){sched(0)},60)});
  addEventListener("pagehide",function(){sched(0)});
  window.__gbCloud={stato:function(){return ready?"attivo":"non disponibile"}};
  (async function(){
    try{
      if(!window.claude||!window.claude.use)return;
      var db=await window.claude.use("db"),user=await window.claude.use("user");if(!db||!user)return;
      var uid=await user.id();if(!uid)return;
      col=db.doc("data/users/"+uid+"/grimmest").collection("salvataggi");
      var snap=await Promise.race([col.get(),new Promise(function(r){setTimeout(function(){r(null)},10000)})]);
      if(!snap)return;
      var m=times(),restored=false,playing=!!(window.game&&window.game.phase==="play");
      snap.docs.forEach(function(d){var x=d.data()||{},k=d.id;if(typeof x.v!=="string")return;if((x.t||0)<RT&&k!==P+"audio"){cloud[k]=x.t||0;if(get(k)==null)dirty[k]=1;return}cloud[k]=x.t||0;
        var lt=m[k]||0;
        // cancellata qui dopo l'ultima copia (partita nuova nello slot, slot cancellato): non torna indietro, si toglie anche dall'account
        if(get(k)==null&&lt>cloud[k]){dirty[k]=1;return}
        if(!playing&&(get(k)==null||cloud[k]>lt)){quiet=true;try{rawSet.call(ls,k,x.v)}catch(e){}quiet=false;m[k]=cloud[k];restored=true}});
      saveTimes(m);
      for(var i=0;i<ls.length;i++){var k=ls.key(i);if(k&&k.indexOf(P)===0&&k!==TK&&(!(k in cloud)||(m[k]||0)>cloud[k]))dirty[k]=1}
      ready=true;
      if(restored){try{sessionStorage.setItem("gb:cloud","1")}catch(e){}location.reload();return}
      sched(1000);
    }catch(e){}
  })();
  try{if(sessionStorage.getItem("gb:cloud")){sessionStorage.removeItem("gb:cloud");setTimeout(function(){window.game&&window.game.toast("Partite riprese dal tuo account Claude")},1800)}}catch(e){}
})();
</script>

 sveglie hanno funzionato. Tutte e tre.","Però c’è qualcosa di strano: la cuccia di Beba è vuota. Beba è sempre la prima a svegliarsi, e la prima a saltarle sul letto.","Stamattina niente. Né un muso freddo, né una coda che batte. Grimo si alza un po’ preoccupata."],"intro.beba_trovata":["Grimo solleva piano la coperta del divano…","Due occhi, un naso umido e una coda che comincia a battere sul cuscino: Beba! Era lì tutto il tempo, arrotolata come un cornetto.","Beba sbadiglia, si stiracchia e le fa le feste come se fosse Grimo quella sparita.","Grimo la stringe forte. Per oggi, nessuno sparisce più."],"intro.divano_hint":"Sotto la coperta del divano qualcosa si muove… Premi A","intro.non_senza_beba":"Senza Beba non si esce. Dov’è finita?","salvadanaio.voce":"Il salvadanaio (€{n})","salvadanaio.titolo":"IL SALVADANAIO · €{n}","salvadanaio.ritira":"Ritira tutto (€{n})","salvadanaio.metti":"Metti da parte 10 €","salvadanaio.smetti":"Smetti di risparmiare","salvadanaio.ricomincia":"Risparmia sulle missioni","salvadanaio.messo":"La mamma mette da parte €{n} (salvadanaio: €{tot})","salvadanaio.ritirati":["Ecco qua, tutti i tuoi risparmi. Spendili bene, amore.","…Cioè, spendili come vuoi. Ma bene."],"salvadanaio.messi":["Dieci euro al sicuro. Ora nel salvadanaio ce ne sono {n}.","Lucio voleva prenderne in prestito uno per il giornale. Gli ho detto di no."],"salvadanaio.smesso":["Va bene, signorina indipendente. Se cambi idea, sai dove trovarmi."],"salvadanaio.ricominciato":["Brava! Da adesso, ogni cinque euro delle tue missioni, uno lo tengo io. Al caldo."],"intro.toast_sveglia":"La sveglia è sul comodino","intro.uscire_notte":["È notte fonda. Fuori ci sono solo i grilli.","Prima le sveglie, poi a letto."],"intro.letto_prima":["Prima di dormire bisogna impostare le sveglie.","Sono sul comodino, accanto al letto."],"alarm.titolo":"IMPOSTA LE SVEGLIE","alarm.sottotitolo":"Grimo non si sveglia mai alla prima.","alarm.nota":"Tutte al mattino, tra le 5:00 e le 11:00.","alarm.etichetta":"Sveglia {n}","alarm.aiuto":"▲▼ scegli · ◀▶ ±5 minuti · A conferma","alarm.conferma":"Confermi le tre sveglie?","gag.1":"«Ancora cinque minuti…»","gag.2":"Grimo si gira dall’altra parte.","gag.3":"Grimo si alza. A fatica.","gag.sveglia":"Sveglia {n} · {ora}","gag.giorno":"Giorno {giorno} a Sasso Marconi","sleep.non_ancora":["Grimo non ha sonno. È ancora presto!"],"sleep.domanda":"Andare a dormire?","sleep.riposino":"Un riposino?","sleep.due":"Due ore","sleep.quattro":"Quattro ore","sleep.riposino_fine":"Grimo si stiracchia: sono le {ora}. Beba sbadiglia, poi scodinzola.","sleep.cambia":"Cambiare le sveglie prima?","sleep.si":"Sì, a nanna","sleep.prima_sveglie":"Prima cambio le sveglie","weather.to.sole":"Esce il sole.","weather.to.nuvoloso":"Il cielo si copre di nuvole.","weather.to.pioggia":"Comincia a piovere.","weather.to.temporale":"Arriva un temporale!","weather.to.nebbia":"Sale la nebbia dalla valle.","door.chiuso":["Chiuso. Orario: {apre}–{chiude}."],"door.chiuso_toast":"Chiuso · apre alle {apre}","door.ambulatorio":["Ambulatorio veterinario. Beba si irrigidisce e si nasconde dietro di te.","Oggi non serve, per fortuna."],"vet.arrivo":"{nome} annusa la porta dell’ambulatorio e si siede: ha capito dove siete.","obj.poster_vet":["Un poster con lo scheletro di un cane. Beba lo guarda con sospetto."],"obj.scaffale_vet":["Scatole di garze, vaccini e biscottini premio. Questi ultimi sono finiti prima degli altri."],"obj.lavello_vet":["Un lavello lucido. C’è un cartello: «Lavarsi le mani. Anche le zampe.»"],"obj.lettino_vet":["Il lettino delle visite. Beba non ci vuole salire. Mai. Per nessun motivo."],"obj.scrivania_vet":["La scrivania di Chiara: libretti dei cani, un fonendoscopio e una tazza con scritto «Il cane ha sempre ragione»."],"obj.cuccia_vet":["Una cuccia per chi aspetta il proprio turno. È tiepida."],"door.svapo":["Svapo Shop. Dalla vetrina esce una nuvola che profuma di fragola.","Non è un posto per Beba."],"door.edicola":["L’edicola abbandonata. Le serrande sono abbassate da anni.","Su un vecchio cartello si legge ancora: «Edicola da Guglielmo»."],"door.stazione":["Stazione chiusa per lavori. Il cartello dice «Riapre presto».","Il cartello è lì da undici anni. Davanti c’è un operaio che lavora tutto da solo."],"door.monte":["La casa sul monte. La porta è chiusa a chiave.","Dalla finestra si vede solo polvere. E una sedia a dondolo."],"door.brughiera":["La Brughiera. Dalla stalla arriva un nitrito tranquillo.","Eleonora non c’è: forse è nel recinto con i cavalli."],"door.privata":["Una casa privata. Dalla finestra arriva il rumore di una moka."],"door.casale":["Il casale di Gino. Sulla porta, una cassetta di pomodori e un biglietto: «Prendine pure»."],"sign.bosco":["«Sentiero del bosco · Il cancello in fondo è chiuso».","Sotto, a matita: «da sempre»."],"sign.piazza":["«Piazza di Sasso Marconi».","Qualcuno ha disegnato un cagnolino col pennarello."],"sign.sgambatoio":["«Sgambatoio comunale. Cani liberi, padroni educati»."],"sign.skate":["«Skate park · Casco consigliato · Rampe storte garantite»."],"sign.baseball":["«Campo da baseball · Attenzione alle palline vaganti»."],"sign.brughiera":["«La Brughiera · Maneggio · Si prega di non dare caramelle ai cavalli»."],"sign.laghetti":["«Laghetti di Porziola · Pesca sportiva»."],"obj.albero":["Un bell’albero. Le foglie fanno un rumore gentile."],"obj.albero_notte":["Tra i rami canta un grillo con molta fiducia in se stesso."],"obj.cipresso":["Un cipresso alto e dritto. Sembra che faccia la guardia alla collina."],"obj.ulivo":["Un ulivo vecchio e storto. Ha visto più estati di tutto il paese."],"obj.cespuglio":["Un cespuglio. Beba ci infila il muso e lo tira fuori soddisfatta."],"obj.ortensie":["Ortensie azzurre. Qualcuno le cura con grande pazienza."],"obj.muretto":["Un muretto a secco. Ogni pietra sta al suo posto da cent’anni."],"obj.staccionata":["Una staccionata di legno, un po’ storta ma orgogliosa."],"obj.lampione":["Un lampione di ghisa. Di giorno si riposa."],"obj.lampione_notte":["Il lampione è acceso. Intorno girano tre falene e un’idea."],"obj.panchina":["Una panchina. Beba ci si sdraia sotto, all’ombra."],"obj.panchina_pioggia":["La panchina è fradicia. Meglio non sedersi."],"obj.vaso":["Un vaso di gerani. Profumano di estate."],"obj.cartello":["Un cartello sbiadito. Non si legge quasi più niente."],"obj.sasso":["Un sasso. Sotto c’è una lumaca molto impegnata."],"obj.cono":["Un cono stradale. È lì da così tanto che ormai fa parte del paesaggio."],"obj.vite":["Filari di vite. L’uva è quasi pronta."],"obj.canne":["Canne palustri. Qualcosa si muove lì in mezzo… una rana!"],"obj.cancello":["Un cancello di legno chiuso con un lucchetto arrugginito.","Il sentiero continua verso il monte, ma per ora non si passa."],"obj.cavallo":["Un cavallo della Brughiera. Ti guarda tranquillo e mastica qualcosa."],"obj.acqua":["Acqua limpida e fresca. Si vedono dei pesciolini."],"obj.acqua_pioggia":["La pioggia fa mille cerchi sull’acqua."],"obj.binari":["I binari sono arrugginiti. Qui il treno non passa da anni."],"obj.fontana":["La fontana della piazza. Grimo beve un sorso d’acqua fresca.","Beba ne approfitta e beve anche lei, con molto rumore."],"obj.rampa":["Una rampa da skate. Ha un’inclinazione decisamente coraggiosa."],"obj.ringhiera":["Una ringhiera per i trick. È tutta graffiata."],"obj.rete":["La rete dietro la casa base. È piena di palline incastrate."],"obj.letto":["Il letto di Grimo. Morbido. Pericolosamente morbido."],"obj.sveglia":["La sveglia sul comodino. Ha l’aria di chi ne ha viste tante."],"obj.armadio":["L’armadio di Grimo. Più avanti qui si potrà cambiare vestito.","Per ora c’è solo un calzino spaiato che guarda nel vuoto."],"obj.libreria":["Libri in ordine di colore e di altezza. I fumetti di Grimo hanno uno scaffale tutto loro, con l’etichetta «FUMETTI (GRIMO)».","Il manuale di canto è ancora lì. Spolverato."],"obj.scrivania":["La scrivania. Sopra c’è un quaderno pieno di testi di canzoni."],"obj.cuccia":["La cuccia di Beba. Contiene: una pallina, un calzino e tanto amore."],"obj.pianta":["Una pianta. Sopravvive con coraggio."],"obj.finestra":["Dalla finestra si vede la collina e un pezzo di cielo."],"obj.finestra_notte":["Fuori è buio. Si vedono le luci del paese e qualche stella."],"obj.finestra_pioggia":["Le gocce scendono lungo il vetro facendo a gara."],"obj.quadro":["Un quadro con un paesaggio di collina. Somiglia molto a qui."],"obj.foto_beba":["Una foto di Beba da cucciola. Aveva già quello sguardo."],"obj.poster":["Un poster un po’ sbiadito."],"obj.poster_tamarindo":["Un poster: «Al Tamarindo i cani sono clienti come gli altri». C’è la foto di Beba."],"obj.poster_conad":["«Offerta della settimana: tre pacchi di biscotti al prezzo di tre»."],"obj.orologio":["L’orologio segna le {ora}."],"obj.frigo":["Il frigo. Ogni ripiano ha un’etichetta: «LATTICINI», «VERDURE», «AVANZI (MAX 2 GIORNI)».","Le calamite sono allineate. Una è storta: è quella di Lucio."],"obj.frigo_bar":["Il frigo del bar. Bibite in fila come soldatini."],"obj.fornelli":["I fornelli. Grimo cucina benissimo la pasta in bianco."],"obj.bancone":["Il piano della cucina brilla. Non c’è una briciola: la mamma le conta."],"obj.lavello":["Il lavello è vuoto e lucido. Le tazze sono già lavate, asciugate e in fila per colore."],"obj.tavolo":["Un tavolo apparecchiato con cura."],"obj.biglietto":["Sul tavolo c’è un biglietto di mamma, scritto in stampatello e con il righello:","«Uscita alle 7:42. Colazione: frigo, secondo ripiano, etichetta verde. Ti voglio bene! P.»"],"obj.divano":["Il divano. I cuscini sono sprimacciati e messi in diagonale, tutti uguali.","Beba lo considera suo. La mamma ha steso un plaid apposta, piegato al millimetro."],"obj.tv":["La televisione. Danno un documentario sulle marmotte."],"obj.tv_notte":["La televisione. A quest’ora vendono solo pentole."],"obj.bancoBar":["Il bancone del bar. Lucido come uno specchio."],"obj.caffe":["La macchina del caffè sbuffa come una piccola locomotiva."],"obj.tavolino":["Un tavolino. Qualcuno ha dimenticato un giornale aperto sull’oroscopo."],"obj.ciotola":["Una ciotola d’acqua."],"obj.ciotola_tamarindo":["Una ciotola con scritto BEBA. È proprio la sua!"],"obj.scaffale":["Scaffali pieni di cose. Una radiolina suona una canzone vecchia."],"obj.scaffale_pasta":["Pasta di ogni forma. Grimo ha una passione per le farfalle."],"obj.scaffale_cani":["Crocchette, snack e ossi di gomma. Beba fissa lo scaffale senza battere ciglio."],"obj.scaffale_biscotti":["Biscotti. Tanti biscotti. Troppi biscotti? Non esiste."],"obj.frutta":["Frutta e verdura fresca dalla campagna di Sasso."],"obj.surgelati":["Il banco dei surgelati. Fa venire i brividi anche a guardarlo."],"obj.cassa":["La cassa."],"obj.carrello":["Un carrello con una ruota che va per conto suo."],"npc.rosa":[["Rosa: Guglielmo? Al bar c’era chi giurava che fosse… no, lascia stare. Chiacchiere da Tamarindo.","Però è vero che quando entrava lui le radioline gracchiavano tutte insieme."],["Rosa: Beba! Tesoro mio! Lo sai che qui sei di casa.","Grimo, se un giorno sei al verde, per Beba un croccantino c’è sempre."],["Rosa: Il caffè lo vuoi lungo, corto o «come viene»?","Qui al Tamarindo facciamo soprattutto «come viene»."],["Rosa: Hai visto il poster? Beba è la nostra mascotte ufficiale.","Ha più fan lei del sindaco."],["Rosa: Stamattina è passato il sindaco. Ha preso un caffè e ha lasciato tre promesse.","Il caffè l’ha pagato. Le promesse vedremo."],["Rosa: Ho cambiato le tovaglie: ora sono a quadretti. Beba approva, ci si è già sdraiata sopra."],["Rosa: Se senti cantare dalla cucina, sono io. Se senti abbaiare, è Beba che mi fa il coro."]],"npc.lorena":[["Lorena: La signora Ada dice che Guglielmo è nato il 25 aprile. Poi però cambia discorso. Tu sai cosa c’entra?"],["Lorena: Benvenuta al Conad! Oggi i carrelli vanno quasi tutti dritti.","Quasi."],["Lorena: Tua mamma è passata stamattina. Ha comprato il latte tre volte.","Poi è tornata a chiedere se l’aveva già comprato."],["Lorena: Le crocchette per Beba sono in fondo a destra.","Lei lo sa già: guarda come tira."],["Lorena: Oggi offerta sulle zucchine. Ogni giorno è offerta sulle zucchine: Aldo me ne porta troppe."],["Lorena: Il carrello numero sette va solo a sinistra. Lo chiamiamo «il politico»."],["Lorena: Hai notato? Il Conad ha la musica nuova. È la stessa canzone, ma più lenta."]],"npc.paola":[["Mamma: Grimo, tesoro! Le scarpe vanno sulla scarpiera, punte verso il muro. Grazie. Ti voglio un mondo di bene!"],["Mamma: Ho riordinato le spezie in ordine alfabetico. Poi per colore. Poi di nuovo in ordine alfabetico.","È stata una mattinata intensa."],["Mamma: Ricordati la sciarpa! È nel secondo cassetto, piegata in quattro. Fa caldo? Ricordatela lo stesso."],["Mamma: Lucio dice che sono «un po’ precisa». Io dico che le cose hanno un posto.","Lui ha messo il telecomando nel cesto del pane. Ne stiamo ancora parlando."],["Mamma: Lucio stasera cucina. Ho già coperto i fornelli con la pellicola. E ho il numero della pizzeria pronto, per sicurezza."],["Mamma: Faccio la lista della spesa divisa per reparti, così al Conad non torno mai indietro.","Lorena dice che sono la sua cliente preferita. E la più veloce."],["Mamma: Quando entri in casa, togliti le scarpe e pulisci le zampe di Beba.","Poi ridammi un abbraccio: il primo non conta, avevi le scarpe."]],"npc.marta":[["Marta: Guglielmo spediva lettere senza francobollo e senza indirizzo. E arrivavano lo stesso, anche oltremare. Non chiedermi come."],["Marta: Ciao Grimo! Conosco tutti a Sasso… e tutti i cani che mi inseguono.","Beba no, eh. Beba è un’amica."],["Marta: Oggi ho tre cartoline per lo stesso indirizzo.","Tutte con lo stesso cuore disegnato. Non dico altro."],["Marta: Le lettere d’amore pesano di più. Non so perché, ma lo sento nella borsa."],["Marta: Il cane di Ada mi aspetta tutti i giorni al cancello. Non per me: per il biscotto."],["Marta: Una volta ho consegnato una lettera di quarant’anni fa. La signora ha pianto. Io pure."]],"npc.marta_pioggia":[["Marta: Piove? La posta arriva lo stesso!","Le lettere un po’ meno asciutte, però."]],"npc.nico":[["Nico: Dicono che Guglielmo abbia acceso una radio senza fili e senza pile, solo guardandola. Leggende di paese. Però che bella leggenda."],["Nico: Suono qui la sera. Il suono rimbalza sulla fontana, ascolta.","…Bello, vero? Anche Beba muove le orecchie a tempo."],["Nico: Di notte Sasso è un’altra cosa. Più lenta. Mi piace."],["Nico: Ho imparato un accordo nuovo. Si chiama «la minore ma con speranza»."],["Nico: Il segreto è suonare piano. Così, se sbagli, se ne accorgono solo i gatti."],["Nico: Quando Beba ulula sul ritornello, giuro che è intonata."]],"tiny.conta":"Sassolini trovati: {n} su {tot}.","tiny.raduno":["I Sassolini si mettono a tintinnare tutti insieme...","Sembra che vogliano trovarsi alla pietra di Guglielmo, nella radura."],"tiny.tutti":"Li hai trovati tutti! Che occhio (e che naso).","tiny.riga":"{nome}: {n} su {tot}","tiny.indizio":"I Sassolini ti aspettano alla pietra della radura.","collezione.app":"Collezione","collezione.titolo":"COLLEZIONE","collezione.speciali":"Oggetti speciali","collezione.nessuno":"Ancora nessuno.","speciale.sassolino_oro":"Sassolino d’oro","dogsitter.app":"Dog sitter","dogsitter.titolo":"DOG SITTER","dogsitter.reputazione":"Reputazione: {stelle}","dogsitter.clienti":"Clienti","dogsitter.cliente":"{owner}: {dogs} (passeggiate: {n})","dogsitter.bloccato":"??? (serve reputazione {n})","dogsitter.rep_su":"Reputazione da dog sitter: {n}! Il passaparola gira.","obj.p_cuccia":"Una cuccia di legno col tetto rosso.","obj.p_ciotola":"La ciotola della pensione.","obj.p_abbeveratoio":"L’abbeveratoio della pensione.","obj.p_giochi":"Palla, tunnel e un ostacolo da saltare.","obj.p_bacheca":"La bacheca della pensione.","pensione.titolo":"PENSIONE","pensione.app":"Pensione","pensione.recinti":"Costruisci i recinti (€{n})","pensione.recinti_ok":"Il nipote di Gino arriva domattina presto. Entro le 8 i recinti sono pronti.","pensione.lavori":"I recinti saranno pronti domattina.","pensione.recinti_pronti":"I recinti della pensione sono pronti!","pensione.cuccia":"Compra una cuccia (€{n}) · {c}/{max}","pensione.cuccia_ok":"Cuccia nuova: un posto in più per gli ospiti.","pensione.gioco":"Area giochi (€{n})","pensione.gioco_ok":"Area giochi pronta: i cani giocano anche da soli.","pensione.registro":"Registro ospiti","pensione.fase":"Stato","pensione.prossimo":"Prossimo passo","pensione.reputazione":"Reputazione: {stelle} · cucce {c}/{max}","pensione.ospiti":"Ospiti","pensione.nessuno":"Nessun ospite. Ne arrivano ogni mattina alle 8.","pensione.ospite":"{nome}: {cure} · notti {n} · €{e}","pensione.legenda":"La pulizia si controlla la sera: niente cacche nel recinto.","pensione.da_fare":"manca {cosa}","pensione.tutto_fatto":"tutto fatto","pensione.arrivo":"Nuovo ospite in pensione: {nome}, per {n} giorni.","pensione.arrivo_uno":"Nuovo ospite in pensione: {nome}, per un giorno.","pensione.partenza":"Ciao, {nome}! Si torna a casa. Incasso della pensione: €{n}.","pensione.cacche":"In pensione c’è da pulire il recinto.","pensione.sera":"Sera in pensione: i cani sono stati curati al {p}%.","pensione.rep_su":"Reputazione della pensione: {n}! Arriveranno più ospiti.","pensione.ciotole":"Ciotole piene: {n} porzioni di crocchette.","pensione.ciotole_piene":"Le ciotole sono già piene per oggi.","pensione.no_crocchette":"Servono crocchette per riempire le ciotole (al Conad).","pensione.acqua":"Acqua fresca per tutti.","pensione.acqua_ok":"L’acqua è già fresca.","pensione.vuota":"Non c’è nessun ospite da accudire.","pensione.gioca":"Grimo gioca con {nome}: corse, palla, grattini.","pensione.giocato":"{nome} ha già giocato oggi: ora sonnecchia felice.","pensione.pulito":"Recinto un po’ più pulito.","pensione.chiudi":"Chiudi","turisti.arrivati":"Hans e Greta si fermano davanti al Rio Verde, emozionati: salutali prima di andare.","turisti.bonus":"Che velocità! Hans aggiunge un extra di €{n}.","idee.titolo":"IDEE PER OGGI","idee.beba":"Prima di tutto Beba: {testo}","idee.missione":"Una missione nuova: «{titolo}». {dove}","idee.emporio_inizio":"Tu e la signora Ada ormai vi conoscete, e hai i soldi: chiedile dell’edicola abbandonata, in piazza.","idee.pensione_inizio":"Gino, al Casale in campagna, affitta un cortile: ci starebbe bene una pensione per cani.","idee.carriera":"Per la tua attività: {cosa}","idee.studio":"Juicy Gustavo aspetta un investimento per lo studio, nella casa rosa sotto la piazza.","idee.sassolini":"Mancano {n} Sassolini: chiedi a Beba «Cosa senti?» nei posti dove non hai ancora cercato.","idee.sgambatoio":"Una corsa allo sgambatoio: Beba si diverte e incontra altri cani.","idee.pesca":"Qualche lancio ai Laghetti di Porziola o sul Rio Verde.","idee.letto":"È tardi: a letto, domani è un altro giorno.","idee.giro":"Un giro in piazza: qualcuno ha sempre voglia di chiacchierare.","beba.sveglia":["Beba apre un occhio, poi l’altro. Si stiracchia tutta e sbadiglia: è pronta.","Beba si sveglia di colpo, come se non avesse mai dormito. «Io? Dormivo? Mai.»","Beba sbadiglia così forte che le si arriccia la lingua. Poi scodinzola."],"beba.reazione.temporale":["Beba si stringe alle tue gambe a ogni tuono. Il temporale proprio non le piace.","Beba ha le orecchie basse e non ti molla un attimo. Passerà, Beba."],"beba.reazione.uscita_fuori":["Beba gira su se stessa e annusa l’erba con molta serietà: deve fare i bisogni.","Beba ti tira verso il prato più vicino. È una questione urgente."],"beba.reazione.uscita_dentro":["Beba guarda la porta, poi te, poi di nuovo la porta. Ha bisogno di uscire!","Beba fa avanti e indietro davanti alla porta: fuori, subito!"],"beba.reazione.pappa":["Beba ti guarda, poi guarda la ciotola che non c’è. Ha fame e sete.","Lo stomaco di Beba brontola più forte di lei. Una pappa ci starebbe."],"beba.reazione.missione":["Beba ti salta addosso: ha capito che è andata bene, e un po’ è merito suo.","Beba scodinzola così forte che si muove tutta. Brave, tutte e due!"],"beba.reazione.sassolino":["Beba annusa la tasca dove tieni il Sassolino. Ne sente già un altro?","Beba ha l’aria di chi ha appena fatto una grande scoperta. Perché l’ha fatta."],"beba.reazione.amico":["Beba ha ancora la coda che gira per l’incontro di prima. Che bella amicizia.","Beba si guarda indietro, verso il suo amico. Si vedranno presto."],"beba.reazione.pesce":["Beba annusa il secchio con il pesce, molto interessata. Non è per te, Beba.","Beba fissa l’acqua: anche lei vuole pescare. Con le zampe."],"beba.reazione.pioggia":["Beba si scrolla l’acqua di dosso. Proprio addosso a te.","Beba ha il pelo tutto arruffato dalla pioggia e l’aria offesa."],"beba.reazione.coccole":["Beba appoggia il muso sulla tua mano e aspetta. Una coccola, per favore.","Beba si siede sui tuoi piedi. È il suo modo di dire «mi sei mancata»."],"beba.reazione.gioco":["Beba ti porta un bastoncino e lo lascia cadere ai tuoi piedi. Poi aspetta.","Beba fa l’inchino del gioco: sedere in alto, zampe giù. Si gioca?"],"beba.reazione.sonno":["Beba sbadiglia: è ora di nanna anche per lei.","Beba cammina più piano del solito. Ha gli occhi a mezz’asta."],"beba.reazione.mattina":["Beba fa la stiracchiata del buongiorno, prima davanti e poi dietro.","Beba ha l’energia del mattino: pronta a tutto, soprattutto alla colazione."],"beba.reazione.nebbia":["Beba annusa la nebbia come se fosse una cosa da mangiare.","Nella nebbia Beba ti sta più vicina del solito."],"beba.reazione.felice":["Beba ti guarda con gli occhi a cuore. Tutto a posto, nel suo mondo.","Beba scodinzola a tempo, come se ci fosse una musica che sente solo lei.","Beba si rotola sulla schiena: pancia da grattare, subito."],"beba.reazione.giu":["Beba ha l’aria un po’ giù. Forse le manca qualcosa: guarda come sta nel menu Stato.","Beba sospira. I cani sospirano, e lei lo fa benissimo."],"obj.orto":["Un’aiuola dell’orto comunale: pomodori, zucchine e un cartellino scritto a mano."],"obj.bacheca_comunale":["La bacheca comunale. Avvisi, feste, gatti smarriti e un biglietto: «Chi ha preso la mia bici, almeno me la lavi»."],"obj.forno_forno":["Il forno a legna. Fa un caldo bellissimo."],"obj.forno_pane":["Pagnotte, filoni e crescentine ancora tiepide."],"obj.forno_dolci":["Ciambelle, torta di riso e biscotti a forma d’osso per i cani."],"obj.forno_banco":["Il bancone del forno, un po’ infarinato."],"obj.fontanella":["Una fontanella di pietra. L’acqua è freschissima."],"obj.agility":["Un ostacolo da saltare, a strisce bianche e rosse."],"sign.marconi":["«Sasso Marconi prende il nome da Guglielmo Marconi: a Pontecchio, a Villa Griffone, da ragazzo fece i primi esperimenti con la radio.»","«Fino al 1938 il paese si chiamava Praduro e Sasso.»"],"sign.orti":["«Orti comunali. Chi pianta raccoglie, chi raccoglie ringrazia.»","Sotto, scritto a mano: «Le zucchine in più lasciatele ad Aldo»."],"sign.giardino":["«Giardino di Beba» — così l’hanno chiamato i bambini del quartiere.","«Cani benvenuti. Buche no.»"],"sign.contrafforte":["«Laggiù, le rupi del Contrafforte Pliocenico: arenarie nate sul fondo di un mare antico, milioni di anni fa.»","«Tra le rocce si trovano ancora conchiglie fossili.»"],"sign.rioverde":["«Rio Verde. Qui le libellule fanno le gare.»","«Vietato il bagno ai cani.» Beba fa finta di non saper leggere."],"panchina.domanda":"Sedersi un po’ con Beba?","panchina.mezzora":"Mezz’ora","panchina.ora":"Un’ora","panchina.dueore":"Due ore","panchina.vista.paese":["Dalla panchina si vede passare mezzo paese. L’altra metà passa dopo.","Qualcuno saluta da una finestra. Grimo saluta, Beba scodinzola."],"panchina.vista.collina":["Da quassù la valle sembra un plastico: i tetti, la ferrovia, il fiume.","Il vento muove le foglie delle vigne tutte insieme, come un applauso."],"panchina.vista.campagna":["Le cicale fanno il loro concerto. Beba prova a unirsi, poi ci ripensa.","L’erba alta si piega al vento. Sembra il mare, ma verde."],"panchina.vista.radura":["Nella radura il tempo va più piano. O forse è solo Grimo che respira meglio."],"panchina.fase.mattina":"Il sole del mattino scalda le mani.","panchina.fase.pomeriggio":"Il pomeriggio scorre lento, come piace a Beba.","panchina.fase.sera":"La luce si fa arancione. Le prime finestre si accendono.","panchina.fase.notte":"Si vedono le stelle. Beba ne fissa una, molto concentrata.","panchina.fase.alba":"Il paese si sveglia piano, un rumore alla volta.","panchina.pioggia":"La pioggia picchietta sulla panchina. Grimo e Beba si stringono: va bene così.","panchina.fine":"Grimo e Beba si alzano, riposate.","bacheca.titolo":"BACHECA COMUNALE","bacheca.oggi":"Avvisi del giorno {giorno}","bacheca.consiglio":"Un biglietto scritto a mano: «{idea}»","bacheca.avvisi":["Sagra del borlengo: la Baracchina promette porzioni «abbondanti come la nonna».","Cercasi volontari per pulire lo sgambatoio. Premio: la gratitudine dei cani.","Smarrito gatto rosso di nome Pallone. Risponde solo al rumore delle scatolette.","Corso di ballo liscio al circolo, il giovedì sera. Si accettano principianti e piedi pestati.","Il forno di Teresa resta aperto anche la domenica mattina. La focaccia ringrazia.","Gli orti comunali regalano zucchine. Troppe zucchine. Vi preghiamo.","La stazione resterà chiusa per lavori «ancora per poco», come da undici anni.","Le Canare cercano nuove amiche a quattro zampe per la passeggiata del mattino.","Concerto di Juicy Gustavo «molto presto». La data è da decidere, il talento no.","Torneo di baseball la domenica: servono riserve e qualcuno che porti l’acqua.","La pensione per cani del casale cerca clienti affezionati. E cani affezionati.","Si ricorda che i cani vanno tenuti al guinzaglio in piazza. Beba lo sa. Beba approva.","Laghetti di Porziola: il pesce più grande pescato quest’anno pesava «così».","Mercatino dell’usato da Nadia: ogni cosa ha una seconda vita, come dice Moe."],"fontanella.grimo":"Grimo beve dalla fontanella. Acqua fresca di collina.","fontanella.beba":"Beba beve anche lei, e si bagna il naso.","agility.fatto":["Beba salta gli ostacoli uno dopo l’altro, con le orecchie al vento. Campionessa!","Beba corre, salta, si gira a guardarti: «Hai visto? Hai visto?»"],"agility.stanca":"Beba ha appena fatto il percorso: ora preferisce annusare i fiori.","agility.serve_beba":"Per il percorso serve Beba, qui vicino.","sign.bosco_sentiero":["«Sentiero del bosco. Su, fino alla radura.»","«Attenzione: radici, ruscello e scoiattoli impertinenti.»"],"sign.bosco_radura":["«Radura · 50 passi».","Qualcuno ha aggiunto: «da cane: 30»."],"sign.poggio":["«Il poggio. Da qui si vedono i laghetti, i campi e, nelle giornate limpide, il campanile.»"],"panchina.vista.bosco":["Nel bosco si sente il ruscello e, ogni tanto, un picchio che lavora. Beba ascolta tutto."],"consegna.persona":["Grimo consegna e saluta. «Grazie!»"],"consegna.manca":["Manca ancora qualcosa da consegnare."],"ui.zaino.pagnotta":"Pagnotta","ui.zaino.ciambella":"Ciambella","ui.zaino.crescentine":"Crescentine da spedire","studio.prossimo":"Cosa facciamo adesso?","studio.titolo_juicy":"Juicy Gustavo","studio.tappa_ok":"Studio: «{nome}» fatto!","studio.prova_ok":"Prova di voce riuscita ({n}/{tot}).","studio.concerto_oggi":"Stasera c’è il concerto in piazza, dalle 20:30 alle 23!","studio.passo.concerto_domani":"«È tutto pronto, collega: il concerto è domani sera in piazza, tra le 20:30 e le 23. Serve una canzone con popolarità almeno {tot} (la tua più famosa: {n}).»","studio.concerto_presto":"La piazza è piena, ma serve una canzone più famosa (popolarità {n}): cantala in giro!","studio.radio":"Onda Lunga Dischi porta il tuo disco in tutta Europa!","studio.passo.microfono":"«Primo: un microfono vero. Costa €{costo}. Con quello che hai adesso sembri una radiolina.»","studio.passo.prove":"«Ora allena la voce: canta in piazza, al belvedere in collina e sulla riva del fiume, in campagna. Fatto: {n} su {tot}.»","studio.passo.mixer":"«Serve un mixer professionale, €{costo}. Con quello si registra sul serio, e si scrivono canzoni tue.»","studio.passo.registrazione":"«Registra una canzone tua da almeno {tot} stelle. La migliore che hai: {n}. Ritenta, i grandi ritentano.»","studio.passo.copertina":"«Ci vuole una copertina. Chiedi a Moe, nel suo studio in campagna: è un’artista vera.»","studio.passo.stampa":"«Ora si stampano i CD: la macchina costa €{costo}.»","studio.passo.vendita":"«Vendiamo i primi venti dischi nel tuo emporio, l’edicola in piazza: ogni sera faccio i conti. Tu cantali in giro, così diventano famosi. Venduti: {n} su {tot}.»","studio.passo.concerto":"«Stasera si suona: concerto in piazza tra le 20:30 e le 23 (se salta, va bene anche una delle sere dopo). Serve una canzone con popolarità almeno {tot} (la tua più famosa: {n}).»","studio.passo.radio":"«Il tuo disco gira l’Europa, collega. Da qui in poi è solo musica. E dischi venduti.»","studio.msg.copertina":"Juicy: Disco registrato! Ora serve una copertina: chiedi a Moe, nel suo studio in campagna.","sign.castagneto":["«Sentiero del castagneto · Monte Adone».","Sotto, un cartello più piccolo: «Via degli Dei · Firenze 4 giorni». Beba ci pensa su."],"sign.monte_adone":["«Belvedere del Monte Adone · Contrafforte Pliocenico».","«Qui una volta c'era il mare: le rocce sono piene di conchiglie fossili.»"],"sign.metato":["«Metato · qui si seccavano le castagne sul fuoco lento, per farne farina».","«Per un mese intero il fumo usciva dal tetto. Il profumo arrivava fino in paese.»"],"obj.castagno":["Un vecchio castagno, carico di ricci. Qualcuno è già aperto: dentro, le castagne lucide."],"obj.castagno_vuoto":["Il castagno è già stato raccolto oggi. Domani ne cadranno altre."],"obj.fieno":["Una balla di fieno. Profuma d'estate.","Con Beba vicina, chissà cosa succederebbe."],"obj.arnie":["Le arnie di Bruno il vignaiolo. Le api ronzano tra i fiori, indaffarate.","Beba le guarda da lontano: le ha già conosciute una volta. Sul naso."],"obj.spaventapasseri":["Uno spaventapasseri con la camicia a quadri.","Un merlo gli è appena atterrato sul cappello. Non spaventa nessuno da anni."],"obj.pilone":["Un piccolo pilone votivo di sassi, all'incrocio dei sentieri. Qualcuno ha lasciato un mazzo di fiori di campo, ancora freschi."],"obj.metato":["Il vecchio metato: una casetta di sassi col tetto di lastre, mezzo crollato.","Dentro c'è ancora il graticcio di legno dove si mettevano le castagne. E un nido di cinciallegre."],"castagne.colte":"Grimo raccoglie {n} castagne, attenta ai ricci. Una punge lo stesso.","castagne.beba":"Beba annusa un riccio, starnutisce e decide che le castagne sono un affare da umani.","ui.zaino.castagne":"Castagne","fieno.beba":[["Beba si tuffa nel fieno e ne riemerge con un ciuffo in testa, come un cappello. Felicissima."],["Beba scava un tunnel nella balla di fieno. Esce dall'altra parte starnutendo e scodinzolando."],["Beba rotola nel fieno a pancia all'aria. Profumerà di prato per tutto il giorno."]],"fieno.stanca":"Beba ha ancora il fieno nelle orecchie: per ora basta così.","panchina.vista.castagneto":["Dal belvedere si vede tutta la valle del Reno: Sasso, il fiume, e laggiù Bologna nella foschia.","Il Monte Adone è lì, con le sue rocce color sabbia. Un falco gira in tondo, senza fretta."],"randagio.paura":["{nome} fa un passo avanti e due indietro. È ancora troppo spaventato per seguirti.","(Torna a trovarlo con Beba nei prossimi giorni: deve fidarsi.)"],"randagio.senza_pensione":["{nome} ti guarda con gli occhioni. Un cucciolo senza casa.","(Se un giorno apri la pensione per cani del casale, potresti ospitarlo lì finché qualcuno non lo adotta.)"],"randagio.piena":["{nome} ti seguirebbe volentieri, ma alla pensione non c'è una cuccia libera.","(Aspetta che parta qualche ospite, o compra un'altra cuccia.)"],"randagio.occupata":["{nome} ti seguirebbe, ma hai già un cane da accompagnare. Uno alla volta!"],"randagio.domanda":"PORTI {nome} ALLA PENSIONE?","randagio.si":"Sì, vieni con noi!","randagio.gioca":"{nome} annusa la cuccia nuova e scodinzola: qui si sta bene!","randagio.no":"Non adesso","randagio.adottato":"{nome} ha trovato casa: lo adotta {chi}! Offerta per la pensione: €{n}.","cavallo.porta":"Il baio non passa dalla porta. Prima riportalo da Eleonora, al maneggio.","cavallo.giro":"Fai un giro a cavallo","cavallo.riporta":"Riporta il baio","cavallo.via":["Il baio nitrisce contento. Buon giro, e occhio ai rami bassi!"],"cavallo.riportato":["Bentornata. Lo spazzolo io, tu intanto respira: hai i capelli pieni di vento."],"npc.bruno":[["Bruno: Questa vigna era di mio nonno. L'uva è la stessa, il vino invece è migliorato. Il nonno non sarebbe d'accordo."],["Bruno: Tra i filari dorme un cucciolo randagio. Gli lascio sempre un pezzo di pane. Lui fa finta di non vedermi."],["Bruno: Le mie api fanno il miele di acacia. Se Beba ci mette il naso, lo fanno pagare caro."],["Bruno: Su al castagneto c'è il vecchio metato. Da bambino ci passavo le giornate d'ottobre, col fumo negli occhi e le castagne in tasca."],["Bruno: Vedi gli spaventapasseri? Li ho vestiti con le camicie di mio cognato. I merli ridono."]],"npc.piero":[["Piero: Facciamo la Via degli Dei, da Bologna a Firenze a piedi. Oggi tappa corta: ci fermiamo ogni volta che c'è un borlengo."],["Piero: Dal Monte Adone si vede tutto. Anche le vesciche sui miei piedi, che sono grandi come la valle."],["Piero: Nives cammina il doppio di me e non suda mai. Io ho sudato anche le scarpe."]],"npc.nives":[["Nives: Lo sapevi che le rocce del Contrafforte erano il fondo del mare? Ci sono conchiglie vecchie milioni di anni!"],["Nives: Il tuo cane è bellissimo. Possiamo portarlo fino a Firenze? Scherzo. Più o meno."],["Nives: Nel castagneto ho visto un cucciolo riccio come un barboncino. Scappava appena mi avvicinavo."]],"studio.passo.ettore":"«La cassetta di Guglielmo ha solo la melodia. Le parole le lasciava su foglietti nei suoi posti preferiti: ritrovale con Beba.»","studio.msg.ettore":"Juicy: Ho ascoltato la cassetta di Guglielmo cento volte. Mancano le parole: le scriveva su foglietti e li lasciava in giro. Cerchiamole?","concerto.randagi":"Tra il pubblico ci sono anche i cuccioli che hai salvato, coi loro padroni nuovi: {nomi}. Abbaiano a tempo. Più o meno.","studio.imparata_ettore":"Hai imparato «{titolo}».","fine.titolo":"THE GRIMMEST ADVENTURE","fine.sottotitolo":"Fine… o quasi. Grimo, cittadina onoraria di Sasso Marconi.","fine.giorni":"Giorni a Sasso: {n}","fine.persone":"Persone aiutate: {n}","fine.missioni":"Missioni completate: {n}","fine.cani":"Cussoli conosciuti da Beba: {n}","fine.randagi":"Cuccioli randagi che hanno trovato casa: {n}","fine.canzoni":"Canzoni scritte: {n}","fine.sassolini":"Sassolini trovati: {n} su {tot}","fine.grazie":"Grazie per aver giocato con Grimo e Beba.","fine.continua":"Ora il paese è tuo: carriere, treni con gli amici, missioni di tutti i giorni, cuccioli da salvare, giri a cavallo e canzoni nuove.","fine.toast":"Si continua a vivere a Sasso!","capitolo.titolo":"Capitolo","capitolo.prologo":"Prologo · La prima mattina","capitolo.stazione":"1 · La stazione di Sasso","capitolo.musica":"2 · Il treno e la musica","capitolo.concerto":"3 · Il concerto in piazza","capitolo.vita":"Epilogo · La vita a Sasso","npc.ettore":[["Guglielmo: Undici anni via, e il paese è più bello di come l’ho lasciato. Merito tuo, mi dicono."],["Guglielmo: La signora Ada mi ha sgridato per mezz’ora. Poi mi ha fatto un caffè. Poi mi ha sgridato ancora."],["Guglielmo: Quella canzone la canticchiavo al cancello del bosco, per farmi coraggio. Tu l’hai cantata a tutto il paese."],["Guglielmo: Hai visto la mia edicola? Ci vado ogni mattina a guardarla. Non mi stanco mai."],["Guglielmo: Beba assomiglia al mio vecchio cane, Bricco. Stesso naso, stessa testardaggine."]],"obj.melo":["Un albero carico di frutta rossa."],"obj.melo_vuoto":["Hai già colto la frutta di quest’albero, oggi. Domani ce ne sarà altra."],"sign.frutteto":["«Frutteto del Rio Verde. Cogliete pure, ma una alla volta: gli alberi hanno sentimenti.»"],"frutta.colta":"Grimo coglie {n} frutti. Profumano di sole.","frutta.beba":"Beba annusa la frutta e decide che preferisce i biscotti.","ui.zaino.frutta":"Frutta","shop.vendi_frutta":"Vendi la frutta ({n}) · €{e}","shop.niente_frutta":"Niente frutta da vendere","shop.frutta_venduta":"Frutta venduta: +€{e}","ui.menu.missioni":"Missioni","ui.menu.missioni_n":"Missioni ({n})","missioni.titolo":"MISSIONI IN CORSO","missioni.nessuna":"Nessuna missione in corso. Qualche idea:","dogsit.gioca":"{nome} corre e gioca: ancora un pochino e poi si riporta a casa.","dogsit.pensione":"La tua pensione incassa €{n} per aver ospitato {nome}.","studio.passo.organizza":"«Un concerto in piazza non si organizza da solo: piazza da Rosa, palco da Gino, luci da Nadia, la telecamera di Edo, e gli inviti.»","studio.msg.organizza":"Juicy: Venti dischi, collega! Ora il grande passo: un concerto in piazza. Passa allo studio, c’è da organizzare: quando è tutto pronto, si suona la sera dopo.","concerto.pubblico":[["Non vedo l’ora che inizi! Ho portato pure la sedia."],["Mia nipote dice che questa canzone la sa a memoria. Io no, ma batto le mani."],["Bello il palco! Sembra il carro di Gino. …È il carro di Gino."],["Che luci! Sembra Natale, ma con le zanzare."],["Dicono che canta anche il cane. Io sono venuto per il cane."],["Ho sentito la canzone alla radio. No, aspetta, quello era un altro. Comunque!"]],"concerto.nome":"Pubblico","door.stazione_aperta":["Stazione di Sasso Marconi. Gerani alle finestre e panchina verde nuova.","Il tabellone dice: «Bologna Centrale, in orario». Un miracolo."],"door.studio_tour":["Studio di Juicy Gustavo. Sulla porta c’è un biglietto:","«IN TOUR CON INDIEPISOL. TORNO COL PRIMO TRENO. (Quando riapriranno la stazione.)»"],"juicy.tour_msg":"Juicy Gustavo: Ciao! Sono in tour con IndiePisol. Torno a Sasso col primo treno… appena riapriranno la stazione. Lo studio ti aspetta!","juicy.tornato_msg":"Juicy Gustavo: SONO TORNATO! Il treno funziona, il tour è finito. Passa allo studio, collega: facciamo musica.","aiuti.mancano_persone":"Mancano ancora:","aiuti.mancano_cani":"E {n} cussoli: fai fare amicizia a Beba con i cani del paese.","aiuti.ivo_mancano":"Sulla mia lista mancano ancora: {nomi}.","npc.ivo":[["Ivo: La vecchia radio della biglietteria, certe sere, si accende da sola. Un fischio lungo e tre corti. Guglielmo diceva che era un saluto. Io stacco la spina."],["Ivo: Oggi ho riparato un chiodo. Domani, se va bene, il chiodo accanto."],["Ivo: Il piccione della stazione mi conosce. Mi saluta. Io lo saluto. È il mio unico collega."],["Ivo: Da solo ci metterei altri undici anni. Con tutto il paese, un pomeriggio."],["Ivo: Il cartello «Riapre presto» l’ho scritto io. Ero giovane e ottimista."]],"aiuti.persona_prima":"{nome}: «Grazie davvero! Se un giorno ti serve una mano, io ci sono.»","aiuti.persona":"{nome}: «Grazie davvero! E se ti serve una mano per la stazione, io ci sono.» (Dillo a Ivo)","aiuti.cane":"{nome} scodinzola: anche lui darà una zampa alla stazione. (Dillo a Ivo)","aiuti.ivo_nuovi":["Davvero? Ci sono anche {nomi}? Che bello!","Li segno sulla mia lista: {persone} persone su {np} e {cani} cussoli su {nc}."],"aiuti.ivo_niente":["Ancora nessuno di nuovo? Non importa, ci vuole pazienza. Io ne ho tanta: undici anni.","Per ora siamo {persone} persone su {np} e {cani} cussoli su {nc}."],"aiuti.ivo_tutti":["…Aspetta. Con tutte queste persone e questi cussoli insieme, la stazione si può sistemare davvero!","Ci vorrà un giorno intero di lavori. Domani mattina, tutti qui. Passa la voce!"],"aiuti.ivo_domani":["Domani è il gran giorno! Riposati, che ci sarà da spazzare."],"aiuti.paese_sbloccato":"La voce gira: in paese tutti hanno qualcosa da chiederti!","aiuti.ivo_oreo":["Quattro cussoli! Ne manca solo uno…","Sai chi sarebbe perfetto? Oreo, il cucciolo di Pina. Ma stamattina Pina lo cercava dappertutto: è scappato dietro a una farfalla.","Vai a sentire da Pina, al parco. Se lo ritrovi, scommetto che ci darà una zampa anche lui."],"aiuti.da_dire":"Hai {n} offerte d’aiuto da riferire a Ivo, alla stazione.","treno.titolo":"TRENO DA BOLOGNA","treno.juicy":"Fai tornare Juicy Gustavo","treno.pubblico":"Gli spettatori del concerto","treno.pubblico_ok":"Gli spettatori arrivano col treno la sera del concerto","treno.niente":"Per ora nessuno","treno.chi":["Il treno è a tua disposizione, capo. Chi facciamo arrivare?"],"treno.papa":"Papà e la fidanzata","treno.papa_qui":"Papà e la fidanzata sono già in paese","treno.papa_presto":"Papà e la fidanzata (sono appena ripartiti)","treno.amici":"Gli amici di Grimo","treno.amico_qui":"{nome} (è già in paese, ti aspetta)","amici.scelta":"{nome}: «ALLORA, ANDIAMO?»","amici.pronta":"{nome}: «ANDIAMO ADESSO?»","amici.subito":"Sì, andiamo subito!","amici.dopo":"Più tardi: fate un giro in paese","amici.ancora":"Non ancora, aspettami","amici.ancora_ok":"Tranquilla, non scappo. Faccio un giro, la sera sono all’Hotel Reno.","amici.aspetta":"{nome} ti aspetta a Sasso: di giorno in paese, la sera all’Hotel Reno. Parlaci quando vuoi partire.","treno.amici_titolo":"CHI FAI ARRIVARE?","treno.amici_oggi":"Gli amici (prima stai con chi è appena arrivato)","treno.amici_tutti":"Gli amici (sono venuti tutti)","treno.amici_tardi":"Gli amici (a quest’ora no: domani mattina)","visita.ripartito":"Il treno di {nome} è ripartito: «{titolo}» si può rifare alla prossima visita.","npc.sandro":[["Sandro: Benvenuta all’Hotel Reno! Sei la figlia di Paola? Lucio mi parla di te in continuazione.","Gli amici di Grimo qui pagano metà. Parola di Lucio, e la parola di Lucio vale doppio."],["Sandro: Lucio e io facevamo il liceo insieme. Lui era quello che si addormentava in gita.","Tua mamma l’ha svegliato, per fortuna."],["Sandro: I tuoi amici sono simpaticissimi. Quello coi tartufi però ha profumato tutto il corridoio."]],"npc.dorme":[["{nome} dorme come un sasso. Ogni tanto borbotta qualcosa sui fagioli."],["{nome} dorme. Russa piano. Poi forte. Poi prrt. Poi di nuovo piano."]],"obj.saccoapelo":["Il sacco a pelo di Wattia, steso in soggiorno. Mamma ha detto sì. Beba ha detto ni."],"obj.hotel_foto":["Una foto in bianco e nero: Sandro e Lucio da ragazzi, con due biciclette e dei baffi improbabili."],"obj.hotel_registro":["Il registro dell’hotel. Accanto a tanti nomi c’è scritto a matita: «amico di Grimo, metà prezzo»."],"wattia.puzza":[["Prrrt! Wattia: «…Una rana. Grossa.»"],["Prrrrrrt. Beba si allontana di due passi e ti guarda come per dire: andiamo via?"],["Pfffrt! Wattia: «Scusa, sono i fagioli del treno. Il treno serviva fagioli.»"],["Prrt-prrt. Wattia: «È il fiume che gorgoglia. Senti come gorgoglia?»"],["PRRRRT. Un’anatra si alza in volo, offesa. Wattia fischietta guardando il cielo."]],"ui.zaino.pizza":"Pizza da asporto","treno.amico_fatto":"{nome} (ormai vive a Sasso)","treno.amico_aspetta.fremurgi":"Fre e Murgi (più avanti)","treno.amico.daria":"Daria","treno.amico.giulia":"Giulia","treno.amico.giulia_p":"Giulia di Sette","treno.amico.wattia":"Wattia","treno.amico.fremurgi":"Fre e Murgi","fan.msg":"Da oggi seguo la tua musica! Quando esce il prossimo pezzo, avvisami.","npc.daria":[["Daria: Ho già adocchiato tre cose nel negozio di Nadia. Mi trattengo. Forse."],["Daria: Le cose usate hanno una storia. Come le canzoni."]],"npc.giulia":[["Giulia: Ancora un giro e poi giuro che mi riposo."],["Giulia: Baby Boss mi ha insegnato un trucco nuovo. Quel bimbo è un mito."]],"npc.giulia_p":[["Giulia di Sette: Sto ancora pensando a quella margherita."],["Giulia di Sette: Il prossimo concerto lo voglio in prima fila. Con una pizza. E se mi commuovo, è colpa dell’acustica."],["Giulia di Sette: Ti ricordi quando ci siamo conosciute? Avevi un cappello orribile. Ti voglio bene lo stesso."],["Giulia di Sette: Se qualcuno ti fa arrabbiare, dimmelo. Gli faccio un discorso. Lungo."],["Giulia di Sette: Beba mi ha portato un bastone. È il regalo più bello che ho ricevuto quest’anno. Dopo te, va bene."]],"npc.wattia":[["Wattia: Oggi è stata una bella giornata. Il treno del ritorno parte tardi. Per fortuna. Per sfortuna dei passeggeri, forse."],["Wattia: Sai che a Bologna mi chiamano «il vento del Reno»? Non chiedermi perché."],["Wattia: Grimo, sei… cioè, il tuo cane è carino. Anche tu. Cioè. Ciao."]],"npc.fre":[["Fre: Il profumo del tartufo mi è rimasto sulle mani. Non mi lavo più."],["Fre: Al campo scout mi chiamavano «Castoro Paziente». Non so perché. Ho solo rosicchiato un remo."],["Fre: Beba dovrebbe fare la scout. Il senso dell’orientamento ce l’ha già, il fazzolettone glielo presto io."]],"npc.murgi":[["Murgi: «Mmh mh-mmh mmh.» (Ti mostra il telefono: «Ho fatto ascoltare la tua canzone a mezza Bologna».)"],["Murgi: «Mmmh!» (Indica le scarpe da corsa, poi la collina: stamattina l’ha fatta tre volte.)"],["Murgi: «Mh-mmh.» (Scrive su un foglietto: «Il dottore dice niente borlenghi per un mese. È la cosa più triste che mi sia mai successa.»)"]],"visita.regalo":"Papà ti mette in mano €20: «Per le ciambelle di Teresa. E un biscotto per Beba.»","obj.scultura":["Una scultura di Moe: ferro, legno e qualcosa che una volta era una caffettiera.","Da vicino sembra un cane. Da lontano, un cane che balla."],"obj.banco_moe":["Il banco di lavoro di Moe: scalpelli, una saldatrice, segatura e una tazza di tè ormai freddo."],"obj.attrezzi_moe":["Scaffali di attrezzi: martelli, raspe, morsetti e una scatola con scritto «cose belle rotte»."],"obj.disegni_moe":["Schizzi appesi al muro: cani, cavalli, una teiera con le ali."],"aiuti.conto":"Persone {persone}/{np} · cussoli {cani}/{nc}"},ca=Hr;function Ua(n,e){return e?n.replace(/\{(\w+)\}/g,(a,t)=>t in e?String(e[t]):a):n}function d(n,e){const a=ca[n];return a===void 0?`[${n}]`:Ua(Array.isArray(a)?String(a[0]):a,e)}function Ea(n){return n in ca}function L(n,e={},a){const t=e.rain&&Ea(n+"_pioggia")&&n+"_pioggia"||e.night&&Ea(n+"_notte")&&n+"_notte"||n,o=ca[t];return o===void 0?[`[${n}]`]:(Array.isArray(o)?o:[o]).map(s=>Ua(String(s),a))}function lt(n,e,a){const t=ca[n];return!t||!t.length?[`[${n}]`]:t[(e%t.length+t.length)%t.length].map(o=>Ua( orna alle sei, il resto apre un po’ alla volta. Gli orari sono scritti sulle porte. Sul telefono hai il diario con le cose da fare, e la mamma in rubrica. Chiamami, ogni tanto.","E ricordati: a Sasso, se aiuti la gente, la gente aiuta te. Alla stazione c’è un operaio, Ivo, che di aiuto ne avrebbe proprio bisogno.","Un’ultima cosa. Quando guadagni qualcosa con i tuoi lavoretti, se vuoi te ne metto un po’ da parte io: un euro ogni cinque. Così quando ti serve, ce l’hai.",{choice:"LA MAMMA TI RISPARMIA I SOLDI?",options:[{label:"Sì, grazie mamma",do:{flags:["risparmio","mamma_benvenuto"]},then:["Brava. Quando vuoi i tuoi soldi, vieni da me: sono tuoi, io li tengo solo al caldo."]},{label:"No, faccio da sola",do:{flags:["mamma_benvenuto"]},then:["Va bene, signorina indipendente. Se cambi idea, chiedimelo: il salvadanaio è sempre qui."]}]},"E adesso, la domanda del giorno…"]},"q.castagnaccio.offer":{who:"Teresa",steps:["Grimo, è arrivato il freddino: è tempo di castagnaccio. Farina di castagne, pinoli, rosmarino. E pazienza.","Solo che le castagne di quest'anno le voglio fresche, del castagneto su verso il Monte Adone. Me ne porti sei?",{choice:"PORTI LE CASTAGNE?",options:[{label:"Ci penso io",do:{startQuest:"castagnaccio"},then:["Brava. Guarda bene sotto i ricci, che le più belle si nascondono."]},{label:"Adesso no",then:["Va bene, aspetto. Il castagnaccio è paziente, come le nonne."]}]}]},"q.castagnaccio.progress":{who:"Teresa",steps:["Sei castagne del castagneto, cara. Il forno è già caldo."]},"q.castagnaccio.deliver":{who:"Teresa",steps:["Guarda che belle! Lucide come scarpe della domenica.","Domani c'è il castagnaccio in vetrina. Tieni, e la prima fetta è tua."]},"q.giro_cavallo.offer":{who:"Eleonora",steps:["Grimo, da quando hai strigliato il baio non fa che cercarti con il muso. Si è affezionato.","Ti va di fare un giro in sella? Su per la collina e poi al castagneto, fino al belvedere del Monte Adone. Da lassù si vede tutta la valle del Reno.",{choice:"UN GIRO A CAVALLO?",options:[{label:"Sì, in sella!",do:{startQuest:"giro_cavallo",ride:!0},then:["Tieni le redini morbide e lascia fare a lui: la strada la conosce meglio di noi. Beba vi correrà dietro, vedrai."]},{label:"Adesso no",then:["Va bene. Lui intanto mangia fieno: è la sua seconda passione."]}]}]},"q.giro_cavallo.progress":{who:"Eleonora",steps:["Il belvedere del Monte Adone è in cima al castagneto: dalla collina, il sentiero in alto a destra. Il baio sa la strada."]},"q.giro_cavallo.deliver":{who:"Eleonora",steps:["Bentornata! Avete la faccia di chi ha visto il Monte Adone col vento in faccia.","Il baio è contento, si vede dalle orecchie. Da oggi, quando vuoi fare un giro, chiedimelo: è un amico, non si paga."]},"q.canzone_ettore.progress":{who:"Juicy Gustavo",steps:["Quattro strofe, collega: edicola, pilone della collina, metato, pietra della radura. Beba le sente: sanno di matita e di nostalgia."]},"q.canzone_ettore.deliver":{who:"Juicy Gustavo",steps:["Fammi vedere… «Sasso mi aspetta sotto il campanile, col treno che non passa e il bar che apre alle otto…»","Collega. Questa non è una canzone: è una lettera. Guglielmo la scriveva per tornare.","La signora Ada la conosce a memoria, scommetto. Impariamola: al concerto, se va tutto bene, la cantiamo per ultima.",{say:"(Grimo ha imparato «La canzone di Guglielmo».)",who:""}]},"concerto.papa":{who:"",steps:["Dal treno delle 20 scendono due facce conosciute: papà, col cappello nuovo, e la sua fidanzata, con un cartello: «GRIMO SEI LA NUMERO UNO».",{say:"Papà: «Non potevo vederlo in video. Ornella ha detto: si prende il treno. E il treno, a Sasso, adesso c’è!»",who:""}]},"concerto.lucio":{who:"",steps:["Tra una canzone e l’altra, Lucio sale sul palco. Trema. Nico gli passa la chitarra, ci ripensa e se la riprende.",{say:"Lucio: «Paola… lo so che vuoi ogni cosa al suo posto. E io, ogni cosa, la sposto: gli occhiali, le chiavi, il telecomando.»",who:""},{say:"Lucio: «Ma vorrei che il mio posto fosse accanto a te. Per sempre. E in ordine.»",who:""},"Lucio tira fuori un anello. La mamma lo guarda, poi guarda Grimo, poi Beba.",{say:"Mamma: «Sì! Sì, testone! …L’anello però lo metto io nel portagioie. Scomparto tre.»",who:""},"La piazza esplode. Edo riprende tutto da tre angolazioni diverse. Beba abbaia due volte: approvato.",{do:{flags:["mamma_lucio_sposi"],friend:{mamma:1,lucio:1}}}]},"q.wattia_studio.offer":{who:"Wattia",steps:["Grimo… posso chiederti una cosa? Tipo, una cosa grande.","Io non ho mai visto uno studio di registrazione. E non ti ho mai sentita cantare da vicino. Da lontano sì. Molte volte. Non in modo strano.",{choice:"PORTI WATTIA IN STUDIO?",options:[{label:"Andiamo!",do:{startQuest:"wattia_studio"},then:["Davvero? Ok. Ok ok ok. Mi asciugo le mani e arrivo."]},{label:"Un’altra volta",then:["Certo, certo. Lo studio non scappa. Io nemmeno."]}]}]},"q.wattia_studio.progress":{who:"Wattia",steps:["Lo studio è la casa rosa vicino alla piazza, giusto? Ti vengo dietro. Respiro. Respiro."]},"q.wattia_studio.juicy":{who:"",steps:[{say:"Juicy: «Collega! E chi è questo signore che suda?» «È Wattia», dici tu. Wattia saluta con tutte e due le mani.",who:""},"Juicy accende il mixer. Grimo entra in cabina, mette le cuffie e canta. Wattia, dall’altra parte del vetro, non si muove. Non respira. Forse non sbatte nemmeno le palpebre.","Al ritornello Juicy gli passa un microfono. Wattia fa il coro. Stona tantissimo. È bellissimo lo stesso.",{say:"Juicy: «Questa la teniamo. La chiamiamo “versione con l’amico”.»",who:""},{say:"(Wattia è uscito a prendere aria. Ti aspetta fuori dalla porta.)",who:""}]},"q.wattia_studio.deliver":{who:"Wattia",steps:["Grimo. Io… non sapevo che la voce potesse fare quella cosa. Quella cosa che hai fatto tu.","Ho fatto il coro! Stonato, ma l’ho fatto. Con te. Lo racconterò ai miei nipoti. Anche se ancora non ho nipoti.",{say:"Prrt.",who:""},"…Era il mixer. Credo. Comunque grazie. È stata la serata più bella della mia vita, e sono le undici del mattino."]},"q.wattia_skate.offer":{who:"Wattia",steps:["Grimo, parli sempre di questo Baby Boss. Voglio conoscerlo. Sento che devo avere la sua approvazione.","E poi… voglio provare a pattinare. Con te. Se cado, tu guardi Beba, ok?",{choice:"ANDATE ALLO SKATE PARK?",options:[{label:"Andiamo!",do:{startQuest:"wattia_skate"},then:["Perfetto. Ho messo i calzini fortunati. Sono due diversi, quindi doppia fortuna."]},{label:"Un’altra volta",then:["Va bene. Mi alleno a stare in piedi nel frattempo. Su un piede solo."]}]}]},"q.wattia_skate.progress":{who:"Wattia",steps:["Lo skate park è in paese, vero? Andiamo piano. Le mie ginocchia sono emozionate quanto me."]},"q.wattia_skate.boss":{who:"Baby Boss",steps:["Tu sei Wattia? Grimo dice che sei simpatico. Io decido dopo.","Ok. Hai le mani sudate, ma hai gli occhi buoni. Sei approvato.","Ti presto i pattini vecchi. Regola numero uno: si cade. Regola numero due: ci si rialza. Regola numero tre: Grimo ti deve tenere d’occhio."]},"q.wattia_skate.deliver":{who:"Wattia",steps:["Sono caduto solo sei volte! Sette, se conti quando mi sono seduto apposta.","Baby Boss mi ha detto che ho stile. E tu… tu ridevi. Ma ridevi bene. Ridevi con me.","Grimo, quando canti al concerto io sarò lì. Proprio sotto il palco. Promesso."]},"concerto.wattia_ballo":{who:"",steps:["A metà canzone Grimo guarda giù. Proprio sotto il palco c’è Wattia, con il cartellone «GRIMO» e la O a forma di cuore.","Beba salta giù dal palco e gli corre incontro. Wattia la prende per le zampe davanti e insieme ballano: lui stonato, lei scodinzolando a tempo. Più o meno.","Baby Boss gli fa la ola da solo. La piazza ride, e poi balla anche lei.",{say:"Wattia, a fine canzone, gridando sopra la musica: «Grimo! Il lago, lo studio, i pattini… ci torniamo? Anche domani? Anche sempre?»",who:""},"Grimo arrossisce fino alle orecchie, e dal palco gli fa sì con la testa. Beba abbaia una volta sola, come per firmare.",{do:{flags:["wattia_dichiarato"],friend:{wattia:1}}}]},"q.giulia_tramonto.offer":{who:"Giulia di Sette",steps:["Grimo, andiamo a vedere il tramonto dal belvedere? Solo noi due. E Beba, che conta come persona.","Ho una cosa per te. Niente di che. Cioè, un po’ di che.",{choice:"ANDATE AL BELVEDERE?",options:[{label:"Andiamo",do:{startQuest:"giulia_tramonto"},then:["Andiamo! Porto da bere."]},{label:"Un’altra volta",then:["Va bene. Il sole tramonta anche domani."]}]}]},"q.giulia_tramonto.progress":{who:"Giulia di Sette",steps:["Il belvedere è in cima alla collina, sopra le vigne. Andiamo con calma."]},"q.giulia_tramonto.deliver":{who:"Giulia di Sette",steps:[{say:"Il sole scende dietro la collina e colora di arancione tutta Sasso. Giulia tira fuori dalla tasca due braccialetti di filo, uno rosso e uno blu.",who:""},"Li ho fatti io, in treno. Sono venuti storti, ma sono nostri.","Uno a te e uno a me. Così quando sei in giro per l’Europa col tuo disco ti ricordi chi ti portava la pizza.",{say:"Grimo se lo lega al polso. Un abbraccio lungo, di quelli veri. Forse scappa una lacrima, ma nessuna delle due lo ammetterà mai.",who:""},"…Ok, basta, sennò diventiamo un film di Edo. Ti voglio bene, Grimo.",{say:"(Giulia ti ha regalato il braccialetto di filo rosso.)",who:""}]},"concerto.giulia":{who:"",steps:["In prima fila c’è Giulia di Sette, con una pizza in mano. Fa il tifo più forte di tutta la piazza.","Grimo la vede e alza il polso col braccialetto rosso. Giulia alza il suo, e per poco non le cade la pizza.",{say:"A fine canzone Giulia sale sul palco e abbraccia Grimo davanti a tutta Sasso: «Te l’avevo detto che eri enorme.»",who:""},{say:"Ha gli occhi lucidi, ma giura che è il fumo delle crescentine.",who:""},{do:{friend:{giulia_p:1}}}]},"concerto.wattia":{who:"",steps:["In prima fila, Wattia ha un cartellone fatto a mano. C’è scritto «GRIMO» con la O a forma di cuore. La R è al contrario.",{say:"Wattia: «Senti, io… cioè, tu canti e io… insomma, al lago ci torniamo? Anche domani? Anche sempre?»",who:""},"Grimo arrossisce fino alle orecchie. Wattia, per l’emozione, si lascia scappare un piccolo prrt. Nessuno se ne accorge. Quasi nessuno.",{do:{flags:["wattia_dichiarato"],friend:{wattia:1}}}]},"concerto.bis":{who:"",steps:["Il pubblico chiede il bis. Grimo guarda Juicy: è il momento della canzone di Guglielmo.","Alla prima strofa la piazza si zittisce. Alla seconda, la signora Ada si porta una mano alla bocca.","Alla terza, in fondo alla piazza, una voce d’uomo canta insieme a Grimo. Un po’ roca, un po’ stonata, ma sa tutte le parole.","È un signore con la barba bianca e una valigia di cartone. Nessuno l’ha visto scendere dal treno.",{say:"Signora Ada: «…Guglielmo?»",who:""},{say:"Guglielmo: «Avevo scritto “tornerò presto”. Ci ho messo undici anni, ma i treni non passavano. Poi qualcuno ha riaperto la stazione.»",who:""},"Sale sul palco piano piano. Juicy gli passa il microfono, che per un attimo fischia, come se lo riconoscesse.",{say:"Guglielmo: «Questa ragazza ha riaperto la stazione, ha ridato vita all’edicola, ha aiutato mezzo paese e ha fatto cantare la piazza. E ha imparato la mia canzone.»",who:""},{say:"Guglielmo: «Quindi, a nome di Sasso Marconi, che è un paese che sa aspettare: da stasera Grimo è cittadina onoraria. Per tutto quello che hai fatto per noi. Grazie.»",who:""},"La piazza esplode. Beba abbaia, la signora Ada piange, Lucio perde il fazzoletto. Guglielmo mette in mano a Grimo una vecchia valvola di radio, ancora tiepida.","Le lucine di Nadia tremolano un istante. Quando Grimo rialza gli occhi, al posto di Guglielmo non c’è più nessuno. Solo la valigia di cartone, vuota.",{say:"Signora Ada, sottovoce: «È sempre stato così. Arriva quando serve. Poi le onde se lo riportano via.»",who:""},{do:{flags:["guglielmo_visto","cittadina_onoraria"],friend:{ada:1}}}]},"concerto.fine":{who:"",steps:[{say:"Juicy: «Collega… è stato il concerto più bello che questa piazza ricordi. E in prima fila c’era una signora di Onda Lunga Dischi, la casa discografica più grande d’Italia.»",who:""},{say:"Juicy: «Vogliono il tuo disco. Lo stampano e lo portano in tutta Europa: Milano, Parigi, Berlino, Madrid. Collega, sei internazionale!»",who:""},{say:"(Hai guadagnato €120. Da adesso i CD si vendono il doppio. Lo studio è tuo: canta quando vuoi.)",who:""}]},"epilogo.festa":{who:"",steps:["Il giorno dopo, Sasso Marconi si sveglia tardi. Tutta, anche Beba.","Di Guglielmo nessuna traccia. Ivo giura che quella notte non è partito nessun treno. Rosa giura di averlo visto salutare dal poggio. La signora Ada non giura niente: sorride e basta.","In stazione Ivo ha appeso uno striscione: «GRAZIE, GUGLIELMO». L’ha scritto lui, e si vede: la R è al contrario.","Al Tamarindo la signora Ada prende il caffè come undici anni fa. Rosa, senza dire niente, ne porta due. La seconda tazzina resta lì, a fumare.","La mamma e Lucio scelgono la data delle nozze: «In primavera, in piazza, con Grimo che canta». Lucio ha già perso il bigliettino con la data.","Arriva il furgone di Onda Lunga Dischi: il disco di Grimo parte per Milano, poi per Parigi, Berlino e Madrid. Dalle finestre lo canticchiano tutti, anche Mirko allo svapo. Anche Baby Boss, a modo suo.","Sulla porta del Comune c’è una pergamena nuova: «Grimo, cittadina onoraria di Sasso Marconi». Beba ci ha già lasciato un’impronta, come firma.","Grimo e Beba guardano il paese dal belvedere. Undici anni fa qui non si fermava nemmeno il treno. Adesso è casa di tutti.","Da qualche parte, una vecchia radiolina gracchia la canzone di Grimo. Nessuno l’ha accesa.",{say:"Beba posa il muso sul ginocchio di Grimo. Va tutto bene.",who:""}]},"q.amico_daria.offer":{who:"Daria",steps:["Grimo! Nadia ha svuotato una cantina intera. Vieni a rovistare con me? Sento odore di vinile raro.",{choice:"CI VAI?",options:[{label:"Andiamo a rovistare!",do:{startQuest:"amico_daria"}},{label:"Un'altra volta",then:["Va bene, ci becchiamo in giro. Sasso è piccola."]}]}]},"q.amico_giulia.offer":{who:"Giulia",steps:["Ho imparato un trick nuovo. Vieni allo skatepark a vedermi? Se cado, tu non hai visto niente.",{choice:"CI VAI?",options:[{label:"Andiamo allo skatepark!",do:{startQuest:"amico_giulia"}},{label:"Un'altra volta",then:["Va bene, ci becchiamo in giro. Sasso è piccola."]}]}]},"q.amico_giulia_p.offer":{who:"Giulia di Sette",steps:["Ho fame. Di nuovo. Mi porti da Alan? Stavolta assaggio quella col salame piccante. Forse.",{choice:"CI VAI?",options:[{label:"Andiamo da Alan!",do:{startQuest:"amico_giulia_p"}},{label:"Un'altra volta",then:["Va bene, ci becchiamo in giro. Sasso è piccola."]}]}]},"q.amico_wattia.offer":{who:"Wattia",steps:["Ehm… Grimo… il lago è sempre lì, eh. Se volessi, così, per caso, rifare il picnic… io ci sarei.",{choice:"CI VAI?",options:[{label:"Andiamo al lago",do:{startQuest:"amico_wattia"}},{label:"Un'altra volta",then:["Va bene, ci becchiamo in giro. Sasso è piccola."]}]}]},"q.amico_fremurgi.offer":{who:"Fre",steps:["Murgi dice che oggi c’è odore di tartufo. Cioè, l’ha mugugnato: con la mandibola così mugugna e basta. Ma stavolta io ci credo. Beba viene?",{choice:"CI VAI?",options:[{label:"Andiamo nel bosco!",do:{startQuest:"amico_fremurgi"}},{label:"Un'altra volta",then:["Va bene, ci becchiamo in giro. Sasso è piccola."]}]}]},"q.occhiali.offer":{who:"Mamma Paola",steps:["Grimo, amore! I miei occhiali non sono nella custodia. La custodia è nella borsa, la borsa sull’attaccapanni. Tutto al suo posto, tranne loro.","Stamattina Lucio li ha presi «un attimo» per il cruciverba. Poi è uscito. Poi chissà.",{choice:"AIUTI MAMMA?",options:[{label:"Ci penso io (con Beba)",do:{startQuest:"occhiali"},then:["Sei un tesoro! Beba ha un fiuto migliore del mio. E una memoria migliore di quella di Lucio.",{say:"(Per cercare: girati verso Beba, premi A e chiedile «Cosa senti?». Quando è vicino, premi A sul punto giusto.)",who:""}]},{label:"Adesso non posso",then:["Va bene, va bene. Leggerò il giornale con la lente d’ingrandimento del nonno. Che è al suo posto, lei."]}]}]},"q.occhiali.progress":{who:"Mamma Paola",steps:["Trovati? Beba ha annusato qualcosa? Io intanto vedo tutto un po’… morbido."]},"q.occhiali.deliver":{who:"Mamma Paola",steps:["I miei occhiali! Dov’erano? No, non dirmelo. Anzi sì. Anzi no: con Lucio ci parlo io.","Tieni, cinque euro. E un bacio. Il bacio è gratis."]},"q.cornetti.offer":{who:"Rosa",steps:["Grimo, mi fai un favore? Ho messo da parte due cornetti per Marta, la postina.","Passa in piazza ogni mattina, ma oggi non ho nessuno al banco.",{choice:"PORTI I CORNETTI?",options:[{label:"Ci vado subito",do:{startQuest:"cornetti"},then:["Grazie! Sbrigati, che si raffreddano. E non farli annusare troppo a Beba."]},{label:"Un’altra volta",then:["Tranquilla, glieli tengo in caldo."]}]}]},"q.cornetti.progress":{who:"Rosa",steps:["Marta è in piazza fino alle dieci e mezza, poi sale nel quartiere alto."]},"q.cornetti.deliver":{who:"Rosa",steps:["Li ha presi? Era contenta? Lo sapevo. I cornetti risolvono tutto.","Tieni, questo è per te. E il prossimo cornetto lo offro io."]},"q.lettera.offer":{who:"Marta la postina",steps:["Che diluvio! Ho ancora mezzo giro da fare e la borsa sta diventando una piscina.","Mi porteresti questa lettera a Teresa, al forno sotto la piazza?",{choice:"LA PORTI TU?",options:[{label:"Certo, dammi pure",do:{startQuest:"lettera"},then:["Sei un angelo con l’ombrello! Basta lasciarla davanti alla porta."]},{label:"Scusa, non posso",then:["Ci penso io. Al massimo la lettera arriva un po’… acquerellata."]}]}]},"q.lettera.progress":{who:"Marta la postina",steps:["Il forno è sotto la piazza: quello con la tenda arancione e il profumo di focaccia."]},"q.lettera.deliver":{who:"Marta la postina",steps:["Arrivata asciutta? Sei un angelo. Il giro di oggi è salvo.","Ecco, per il disturbo. La posta ti ringrazia."]},"q.plettro.offer":{who:"Nico",steps:["Ho perso il plettro. Quello portafortuna, verde, mezzo mangiucchiato.","Era qui in piazza, ma con questo buio non vedo niente.",{choice:"LO CERCHI CON BEBA?",options:[{label:"Beba, al lavoro!",do:{startQuest:"plettro"},then:["Gran
