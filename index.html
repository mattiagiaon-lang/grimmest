de. Se lo trovate vi dedico una canzone. Anzi due."]},{label:"Stasera no",then:["Ok. Suonerò con le unghie, allora."]}]}]},"q.plettro.progress":{who:"Nico",steps:["Il plettro è verde e un po’ mangiucchiato. Non chiedermi da chi."]},"q.plettro.deliver":{who:"Nico",steps:["Il mio plettro! Beba, sei una leggenda.","Questa la suono per voi due. Si intitola «Naso fino». L’ho scritta adesso."]},"q.gomitolo.offer":{who:"Signora Ada",steps:["Grimo cara, posso chiederti una cortesia? Tu e Beba siete così gentili a passare.","Facevo la maglia al parco e mi sono scappati tre gomitoli. Rotolano, rotolano… e io non corro più come una volta.",{choice:"CERCHI I GOMITOLI?",options:[{label:"Li troviamo noi",do:{startQuest:"gomitolo"},then:["Che care. Sono rossi, blu e gialli. Beba li sentirà: sanno di lavanda."]},{label:"Adesso no",then:["Nessuna fretta, cara. I gomitoli sono pazienti."]}]}]},"q.gomitolo.progress":{who:"Signora Ada",steps:["Sono nel parco, ne sono sicura. Sanno di lavanda, dillo a Beba."]},"q.gomitolo.deliver":{who:"Signora Ada",steps:["Tutti e tre! Rosso, blu e giallo. Con questi faccio una sciarpetta per Beba, vedrai.","Intanto prendi questi, per un gelato."]},"q.caricabatterie.deliver":{who:"Edo",steps:["Alan! Il film è salvo! Il cinema italiano è salvo!","Tieni, il budget di produzione. Tutto il budget."]},"q.foto.offer":{who:"Rosa",steps:["Guarda Beba come scodinzola oggi! È il momento perfetto.","Posso farle una foto per il poster nuovo del Tamarindo?",{choice:"UNA FOTO A BEBA?",options:[{label:"Certo! Beba, sorridi!",do:{startQuest:"foto"}},{label:"Oggi è spettinata",then:["Ma se è bellissima! Va bene, la prossima volta."]}]}]},"q.foto.done":{who:"Rosa",steps:["Click! Perfetta. Guarda che occhi.","Domani la appendo. Tieni, due biscottini per la nostra modella."]},"call.papa":{who:"Papà",steps:["Pronto, Grimo? Sono papà! Ti chiamo dalle vacanze. Con Orietta!",{rotate:"papa",variants:[["Siamo al mare, in Romagna. Ornelia prende il sole, io prendo la scottatura.","Ieri sera abbiamo ballato il liscio. Mi fanno ancora male i piedi, ma ne valeva la pena."],["Oggi gita in barca! Cioè, pedalò. Lorella pedalava, io davo indicazioni.","Abbiamo visto un delfino. Rossella dice che era una boa. Io dico delfino."],["Siamo saliti in montagna in funivia. Fiorella non aveva paura, io sì. Molta.","In cima c’era la polenta. Ne è valsa la pena, la paura."],["Mirella mi ha portato a un corso di cucina. Io ho bruciato le tagliatelle. Si può?","Lei dice che sono un disastro, ma con il sorriso. Lo prendo come un complimento."],["Stasera c’è la sagra in paese, qui. Antonella vuole vincere il salame alla pesca.","Io punto sul cesto di frutta. Siamo una coppia ambiziosa."],["Ti mando una foto: io e Ornellina al tramonto. Sì, quello col cappello sono io.","Il cappello l’ha scelto lei. Dice che mi ringiovanisce. Lo spero."]]},{choice:"PAPÀ",options:[{label:"Ascolta con pazienza",do:{friend:{papa:1}},then:["Lo sapevo che capivi! Sei la figlia migliore. Anche l’unica, ma questo non c’entra.","Ah, saluta Beba! Anzi, passamela. …Bau? Ciao Beba!",{if:{friend:{papa:2},quest:{regalo:"free"}},then:["Senti… posso chiederti un favore? Donatella non ha mai assaggiato le crescentine di Sasso.","Se ne prendi un pacco da Teresa al forno e lo dai a Marta, la postina, lei ce lo spedisce qui. Poi chiamami, così sto tranquillo!",{choice:"PAPÀ",options:[{label:"Va bene, papà",do:{startQuest:"regalo"},then:["Sei un tesoro! Marinella sarà felicissima. E anche io, che le mangio."]},{label:"Non posso, papà",then:["Va bene, va bene. Le prometto le crescentine quando torniamo."]}]}]}]},{label:"Papà, devo andare",then:["Va bene, va bene! Ti richiamo. Sicuramente. Ciao, Grimo!"]}]}]},"call.mamma":{who:"Mamma",steps:[{rotate:"mamma",variants:[[{if:{quest:{occhiali:"free"}},then:["Grimo! Sono mamma. Indovina chi ha spostato i miei occhiali.","Esatto: Lucio. Li ha presi per il cruciverba e li ha seminati per il paese.",{choice:"MAMMA",options:[{label:"Ci penso io",do:{startQuest:"occhiali"},then:["Sei un tesoro! Erano in paese, da qualche parte. Poi riportameli a casa."]},{label:"Mamma, sono impegnata",then:["Va bene! Li ritroverò io. Intanto Lucio pulisce le fughe del bagno. Per punizione."]}]}],else:["Grimo! Sono mamma. Volevo solo sentirti. Hai mangiato? Mangia. Anche Beba. Ciao amore!"]}],[{if:{quest:{chiavi:"free"}},then:["Grimo, amore, sono mamma. Lucio ha preso le mie chiavi al posto delle sue e le ha lasciate da Rosa, al Tamarindo. Sono fuori casa, sul pianerottolo.","Quelle col portachiavi a pera. Me le vai a prendere?",{choice:"MAMMA",options:[{label:"Ci penso io",do:{startQuest:"chiavi"},then:["Grazie! Ti aspetto qui. Sul pianerottolo. Con la vicina che mi guarda."]},{label:"Mamma, sono impegnata",then:["Va bene, chiamo il fabbro. Che è anche il marito della vicina."]}]}],else:["Grimo! Sono mamma. Volevo solo sentirti. Hai mangiato? Mangia. Anche Beba. Ciao amore!"]}],[{if:{quest:{spesa_mamma:"free"}},then:["Grimo, sono mamma! Stasera ho ospiti: mi prendi una pagnotta e una ciambella da Teresa?",{choice:"MAMMA",options:[{label:"Ci penso io",do:{startQuest:"spesa_mamma"},then:["Grazie! Di giorno sono al parco, in piazza o in pizzeria; la sera a casa."]},{label:"Mamma, sono impegnata",then:["Va bene, inventerò un dolce. Con quello che c’è. Cioè niente."]}]}],else:["Grimo! Sono mamma. Volevo solo sentirti. Hai mangiato? Mangia. Anche Beba. Ciao amore!"]}],["Grimo! Sono mamma. Volevo solo sentirti. E chiederti se hai mangiato.","Hai mangiato? Mangia. Anche Beba. Ciao amore!"],["Grimo, amore! Ti ho lasciato una sorpresa sul tavolo di cucina.","No, non è cibo. Cioè, puoi comprarci del cibo. Ciao!",{do:{flags:["regalo_mamma"]}}]]}]},"call.edo":{who:"Edo",steps:["Sorellina! Emergenza di produzione!",{if:{quest:{set:"free"}},then:["Devo girare una scena tra i fiori del quartiere alto. Vai a vedere se la luce è giusta? Poi raccontami, sono vicino allo skate park.",{do:{flags:["favore_edo"],startQuest:"set"}}],else:[{if:{quest:{caricabatterie:"free"}},then:["Ho lasciato il caricabatterie alla Baracchina: ce l’ha Silvia. Il telefono è al 2%. Il film è in pericolo!",{do:{flags:["favore_edo"],startQuest:"caricabatterie"}}],else:[{if:{quest:{pacco:"free"}},then:["È arrivato un pacco per me e ce l’ha Marta, la postina. Me lo porti? Dentro c’è attrezzatura professionale. Credo.",{do:{flags:["favore_edo"],startQuest:"pacco"}}],else:[{if:{quest:{edo_spazzatura:"free"}},then:["Non ti vedo da ieri! Mi manchi. E poi… c’è il sacco della spazzatura che ti aspetta. Mi raggiungi allo skate park?",{do:{flags:["favore_edo"],startQuest:"edo_spazzatura"}}],else:[{if:{quest:{edo_merenda:"free"}},then:["Non ti fai vedere da un giorno intero! Ho bisogno di te. E di una ciambella del Forno di Teresa. Soprattutto di te.",{do:{flags:["favore_edo"],startQuest:"edo_merenda"}}],else:[{if:{quest:{edo_messaggio:"free"}},then:["Sorellina, dove sei finita? Mi serve un favore: dici a Vale che domani giriamo alle quattro? Poi passi a trovarmi.",{do:{flags:["favore_edo"],startQuest:"edo_messaggio"}}],else:["Falso allarme. Volevo solo sentirti, non ti vedo da ieri. Passa a trovarmi allo skate park, eh!"]}]}]}]}]}]}]},"callout.papa":{who:"Papà",steps:["Grimo! Che bello sentirti. Stavo per chiamarti io, giuro.","Non ho novità sentimentali. …Per ora. Ti voglio bene!"]},"callout.mamma":{who:"Mamma",steps:["Pronto? Ah, sei tu! Pensavo fosse la farmacia.","Tutto bene, amore. Ricordati la sciarpa. Fa caldo? Ricordatela lo stesso."]},"callout.edo":{who:"Edo",steps:["Non posso parlare, sto girando un piano sequenza di sette minuti.","…Ok, è venuto male. Ciao!"]},"npc.elena":{who:"Elena",steps:[{rotate:"elena",variants:[["Grimo! Siamo scese dal primo treno e non siamo più ripartite. Sasso è così… slow.","Abbiamo appena preso un cappuccino d’avena al Tamarindo. Rosa ha detto «d’avena?» con un tono che non ci è piaciuto."],["Questa felpa è vintage, presa da Nadia. Anni settanta, cotone grezzo, nessuna etichetta. Il lusso vero è non avere etichette."],["Il borlengo è street food autentico, decoloniale. L’ho scritto anche sul mio taccuino di carta riciclata."],["Domenica andiamo al MAMbo. Poi brunch. Poi un podcast sul brunch."],["Beba è stata adottata? Che bello. Noi abbiamo un levriero spagnolo salvato. Si chiama Lorca."]]}]},"npc.matilde":{who:"Matilde",steps:[{rotate:"matilde",variants:[["Sasso Marconi ha un’energia molto… autentica. Ci stiamo pensando seriamente. Al casale, ovviamente."],["Siamo venute in bici. Elettrica, ma il principio resta."],["Abbiamo l’abbonamento a Internazionale, alla Feltrinelli e a un orto condiviso. L’orto non l’abbiamo mai visto, ma lo sosteniamo."],["La tua musica è molto vera, Grimo. Molto analogica. Sei mai stata in Val d’Orcia? Dovresti. Per l’ispirazione."],["Il Conad è comodo, sì. Ma noi facciamo la spesa dai produttori. Quando ci ricordiamo. Cioè al Conad."]]}]},"q.brunch.offer":{who:"Elena",steps:["Grimo, sabato facciamo un brunch per gli amici. Tutto a km zero, ovviamente.",{say:"Matilde: «Ci servirebbero tre frutti del frutteto del Rio Verde. Bio. Raccolti a mano. Da una persona vera.»",who:""},"E poi… potresti chiedere a Teresa se fa le ciambelle senza glutine? Noi non siamo celiache. È più una scelta.",{choice:"AIUTI ELENA E MATILDE?",options:[{label:"Ci penso io",do:{startQuest:"brunch"},then:["Grazie! Sei così… genuina."]},{label:"Adesso no",then:["Nessun problema. Il brunch è uno stato mentale."]}]}]},"q.brunch.progress":{who:"Elena",steps:["Tre frutti del Rio Verde e la questione delle ciambelle con Teresa. Con calma, eh: lo slow living è importante."]},"q.brunch.manca":{who:"Elena",steps:["Ci servono tre frutti del frutteto del Rio Verde. Quelli del Conad hanno un’aura diversa."]},"q.brunch.teresa":{who:"Teresa",steps:["Senza glutine? È una ciambella, tesoro. Il glutine è il motivo per cui sta in piedi.","Dille che gliene faccio una normale, e se la mangiano sorridendo. Funziona sempre."]},"q.brunch.deliver":{who:"Elena",steps:["Che colori! Questa frutta ha un’anima.",{say:"Matilde: «Ciambelle normali? Va bene. Lo chiameremo “brunch della tradizione”. È un concept.»",who:""},"Tieni, per il disturbo. E sabato vieni anche tu: c’è il kombucha fatto in casa. Fa un po’ paura, ma è vivo."]},"npc.edo_notte":{who:"Edo",steps:[{rotate:"edo_notte",variants:[["Sto girando una scena notturna. Si intitola «Lampione». È molto esistenziale.","Tienimi compagnia, sorellina. Il buio mi mette un po’ d’ansia. Artistica, eh."],["Guarda la luna sopra la rampa. Se riesco a farla entrare nell’inquadratura vinco un premio. Credo."],["La mamma ha detto rientro alle undici. Sono le dieci e cinquantanove. Sono un ragazzo puntuale, a modo mio."]]}]},"npc.carla_notte":{who:"Carla delle Canare",steps:[{rotate:"carla_notte",variants:[["La passeggiata della sera è la più bella: i cani annusano il buio e io annuso il gelsomino.","Le altre Canare dormono già. Noi due no: siamo animali notturni."],["Shh. Senti? È l’assiolo. Il mio cane gli risponde sempre. Non so cosa si dicano, ma vanno d’accordo."]]}]},"npc.piero_notte":{who:"Piero",steps:[{rotate:"piero_notte",variants:[["Stanotte il cielo è pulito. Quella è Cassiopea, a forma di W. Nives dice W come «wow». Io dico W come «vedi che avevo ragione»."],["Mio nonno raccontava che da questa collina, una volta, qualcuno mandava messaggi oltre l’oceano. Senza fili. Leggende di paese, eh."]]}]},"npc.nives_notte":{who:"Nives",steps:[{rotate:"nives_notte",variants:[["Abbiamo portato il thermos e il telescopio. Il telescopio è di Piero. Il thermos è più importante."],["Se vedi una stella cadente esprimi un desiderio. Io lo esprimo sempre per Beba: che trovi sempre la strada di casa."]]}]},"npc.nico_notte":{who:"Nico",steps:[{rotate:"nico_notte",variants:[["Di notte la fontana suona meglio. Rimanda indietro ogni accordo, un po’ più triste e un po’ più bello."],["Sto scrivendo una canzone sui lampioni di Sasso. Ne ho contati quarantadue. Uno fa sempre tic."]]}]},"npc.elena_notte":{who:"Elena",steps:[{rotate:"elena_notte",variants:[["Aperitivo. Spritz al bitter artigianale. Rosa lo chiama «quello rosso». Le vogliamo bene lo stesso."],["Di notte Sasso ha un’atmosfera molto… cinematografica. Diglielo a Edo, che lui capisce."]]}]},"npc.matilde_notte":{who:"Matilde",steps:[{rotate:"matilde_notte",variants:[["Stiamo aspettando la cometa. Non c’è nessuna cometa annunciata, ma noi siamo fiduciose."],["La sera è il momento giusto per parlare di decrescita felice. Poi andiamo da Alan. Due pizze. A testa."]]}]},"npc.ivo_notte":{who:"Ivo l’operaio",steps:[{rotate:"ivo_notte",variants:[["Di sera lucido il tabellone. Nessuno lo guarda, ma deve brillare lo stesso."],["La vecchia radio della biglietteria a quest’ora gracchia di più. Io le dico buonanotte. Lei, a volte, risponde."]]}]},"q.vet.cura_fagiolo":{who:"Chiara la veterinaria",steps:["Vediamo un po’ questo randagio…","Una spina, eccola qui. Fagiolo non ha fatto un fiato: è più coraggioso di quanto sembri.","Due giorni di riposo e un po’ di disinfettante. Poi può correre di nuovo tra i filari.",{say:"(Chiara non vuole niente: «I randagi li curo gratis. Tu portali in pensione, e io sono contenta.»)",who:""}]},"q.vet.cura_ruggine":{who:"Chiara la veterinaria",steps:["Vediamo un po’ questo randagio…","Zecche, tante. Ruggine ha brontolato tutto il tempo, ma si è lasciato pulire.","Ora ha l’antiparassitario: niente più ospiti indesiderati. Brontolerà lo stesso, è il suo carattere.",{say:"(Chiara non vuole niente: «I randagi li curo gratis. Tu portali in pensione, e io sono contenta.»)",who:""}]},"q.vet.cura_pepita":{who:"Chiara la veterinaria",steps:["Vediamo un po’ questo randagio…","Un’otite. Pepita non si fidava, ma con le gocce le passa in pochi giorni.","Tienila al caldo e non bagnarle le orecchie. Vedrai che ti ringrazierà a modo suo.",{say:"(Chiara non vuole niente: «I randagi li curo gratis. Tu portali in pensione, e io sono contenta.»)",who:""}]},"q.vet.cura_zolla":{who:"Chiara la veterinaria",steps:["Vediamo un po’ questo randagio…","Terra, terra e ancora terra. Zolla ha fatto una scorpacciata di campo. Niente di grave.","Un po’ di dieta in bianco e meno buche per qualche giorno. Lo so, per lui è una tragedia.",{say:"(Chiara non vuole niente: «I randagi li curo gratis. Tu portali in pensione, e io sono contenta.»)",who:""}]},"q.vet.cura_bullone":{who:"Chiara la veterinaria",steps:["Vediamo un po’ questo randagio…","Un taglietto pulito, per fortuna. Tre punti e una fasciatura blu. Bullone ha ringhiato alla garza, non a me.","Tra una settimana togliamo i punti. Intanto, niente cantieri.",{say:"(Chiara non vuole niente: «I randagi li curo gratis. Tu portali in pensione, e io sono contenta.»)",who:""}]},"npc.vet":{who:"Chiara la veterinaria",steps:[{rotate:"vet",variants:[["Ciao Grimo! E ciao Beba. Sì, ti ricordi di me. No, oggi niente puntura. Forse."],["Se trovi un randagio che sta male, portamelo prima della pensione. I randagi li curo gratis: è la mia regola."],["Beba ha un pelo bellissimo. Si vede che a casa vostra si mangia bene. E che qualcuno le pettina le orecchie."],["Le Canare mi portano i loro cani ogni settimana. Anche quando non hanno niente. Dicono che è prevenzione. Io dico che è pettegolezzo."]]}]},"q.jakie.offer":{who:"Eleonora",steps:["Grimo, mi faresti un grande favore? Jakie deve fare il controllo da Chiara, la veterinaria, all’ambulatorio sopra la piazza.","Io non posso lasciare i cavalli, e Hope si offende se porto solo lui. Jakie con te va d’accordo: ti segue senza problemi.",{choice:"PORTI JAKIE DAL VETERINARIO?",options:[{label:"Ci penso io",do:{startQuest:"jakie_vet"},then:["Grazie! Il libretto è nel suo collare. E se fa il drammatico in sala d’attesa, è normale: è un attore."]},{label:"Adesso no",then:["Va bene, il controllo può aspettare un giorno. Jakie sarà felicissimo."]}]}]},"q.jakie.progress":{who:"Eleonora",steps:["L’ambulatorio è sopra la piazza, la casa bianca con la croce. Jakie ti segue, tu non correre."]},"q.jakie.vet":{who:"Chiara la veterinaria",steps:["Ecco Jakie! Fammi vedere… orecchie pulite, denti a posto, cuore da maratoneta.","Un piccolo richiamo del vaccino e via. Ha fatto un guaito di protesta, poi mi ha leccato la mano. Pace fatta.","Di’ a Eleonora che sta benissimo. E che può smetterla di dargli il formaggio di nascosto: si vede dal girovita.",{say:"(Chiara ti dà il libretto di Jakie, timbrato. Jakie torna da Eleonora con te.)",who:""}]},"q.jakie.deliver":{who:"Eleonora",steps:["Sta benissimo? Lo sapevo! …Il formaggio? Quale formaggio?","Grazie, Grimo. Adesso conosci anche Chiara: se trovi un randagio che sta male, lei è la persona giusta."]},"q.doc.offer":{who:"Juicy Gustavo",steps:["Collega, ho appena chiuso il telefono con Onda Lunga Dischi. Il contratto è firmato, il disco parte. Ma vogliono una cosa in più.","Un video documentario. Chi è Grimo, da dove viene la sua voce, perché canta. Roba seria, collega.","Tua mamma mi ha detto una cosa: nonno Paolo ti filmava sempre, da piccola, con la sua videocamera. E le cassette le nascondeva nei suoi posti preferiti, come una caccia al tesoro per te.","Se le ritroviamo, il documentario è fatto. E secondo me Wattia, con la sua telecamera, ti darebbe volentieri una mano.",{choice:"FAI IL DOCUMENTARIO?",options:[{label:"Cerchiamole!",do:{startQuest:"documentario"},then:["Grande. Io intanto pulisco il videoregistratore di Nadia. Ha più polvere di me."]},{label:"Un’altra volta",then:["Va bene. Le cassette aspettano da tanti anni: un giorno in più non le spaventa."]}]}]},"q.doc.progress":{who:"Juicy Gustavo",steps:["Il videoregistratore è pronto. Mancano solo le cassette di nonno Paolo. E Wattia che non inciampi nel cavo."]},"q.doc.wattia":{who:"Wattia",steps:["Un documentario? Su di te? Con me? Cioè, con me che aiuto. Sì. Sì, sì, sì.","Porto la telecamera. Riprendo anche la ricerca: il documentario del documentario. Roba da festival.","Nonno Paolo nascondeva le cassette nei suoi posti preferiti? Allora Beba le troverà. Io tengo il microfono. E le distanze dalle rane.",{say:"(Wattia viene con te: ti seguirà durante la ricerca.)",who:""}]},"q.doc.deliver":{who:"",steps:["Nello studio di Juicy le luci sono basse. Il videoregistratore di Nadia ronza, poi parte la prima cassetta.","Sullo schermo c’è il belvedere, d’estate. Una bambina coi capelli spettinati canta a squarciagola una canzone inventata. Stona su ogni nota. È felicissima.","Dietro la videocamera ride una voce che Grimo conosce bene: «Brava, piccola! Un’altra volta, che il paese ti sente!». È nonno Paolo.","Una cassetta dopo l’altra: Grimo che corre nel castagneto, Grimo che canta alle rane, Grimo addormentata nel frutteto con un cane che le dorme accanto.",{say:"Wattia non dice niente. Per una volta. Poi tira su col naso e dice che è la polvere del videoregistratore.",who:""},{say:"Juicy: «Collega, il documentario si chiamerà come la canzone che cantavi da piccola. Nonno Paolo l’aveva già capito: il paese ti sentiva.»",who:""},{say:"Grimo guarda lo schermo fermo sull’ultima immagine: lei piccola, nonno Paolo che sorride, Sasso dietro. Sorride anche lei.",who:""},{say:"(Il documentario partirà con il disco in tutta Europa. Hai guadagnato €80.)",who:""}]},"npc.edo":{who:"Edo",steps:[{rotate:"edo",variants:[["Sto girando un cortometraggio sullo skate park. Si intitola «Rampa». È un film d’autore."],["Ho bisogno di un’attrice. Beba ha già un agente?"],["Il segreto del cinema è la luce. E i panini. Soprattutto i panini."],["Ho girato un’intera scena con il telefono al contrario. Ora è un film sperimentale."],["Il pubblico vuole emozioni. Io voglio un cavalletto che non cada."],[{if:{flag:"stazione_aperta"},then:["Ora che c’è il treno posso andare a Bologna a vedere i film veri. E poi tornare a girare quelli finti."],else:["Il mio prossimo film? «La stazione». Un uomo, un cartello, undici anni di attesa. Ivo ha già accettato."]}]]}]},"q.sgambatoio.offer":{who:"Gina delle Canare",steps:["Ciao Grimo! Noi Canare diciamo sempre: un cane che non corre è un cane che brontola.","Porta Beba nello sgambatoio e lasciala giocare un po’ con gli altri. Poi torna a raccontarmi!",{choice:"PORTI BEBA A GIOCARE?",options:[{label:"Ci penso io",do:{startQuest:"sgambatoio"},then:["Brava! Il cancelletto è sul lato destro del recinto."]},{label:"Adesso no",then:["Peccato! Beba mi sembrava proprio in vena."]}]}]},"q.sgambatoio.progress":{who:"Gina delle Canare",steps:["Entra nel recinto con Beba: là dentro può correre libera."]},"q.sgambatoio.deliver":{who:"Gina delle Canare",steps:["Hai visto come correva? Le Canare approvano.","Tieni, per le crocchette. Tutte le Canare ne parleranno entro stasera."]},"q.spesa.offer":{who:"Lorena",steps:["Il furgone delle consegne oggi non è passato. E io senza pane e verdura apro un Conad di sole patatine.","Teresa e Aldo mi tengono sempre qualcosa da parte. Me li vai a prendere?",{choice:"PASSI DA TERESA E ALDO?",options:[{label:"Ci penso io",do:{startQuest:"spesa"},then:["Grazie! Teresa è al forno sotto la piazza, Aldo agli orti nel quartiere alto."]},{label:"Adesso no",then:["Va bene, oggi si mangiano patatine. Tutti."]}]}]},"q.spesa.progress":{who:"Lorena",steps:["Pane da Teresa, al forno. Verdura da Aldo, agli orti. Il Conad confida in te."]},"q.spesa.deliver":{who:"Lorena",steps:["Pane e verdura! Il Conad è salvo, e anche la mia reputazione.","Ecco il tuo compenso. Il Conad ti ringrazia."]},"q.pattini.offer":{who:"Baby Boss",steps:["Ciao Grimo! Mi chiamano tutti Baby Boss perché sono il più piccolo dello skate park. Mi piace, mi fa sentire grande.","Ho prestato i miei pattini a tuo fratello Edo per il suo film… e il caschetto l’ho lasciato da Lia, al Negozio Animali.","Senza non posso giocare con gli altri. Me li andresti a prendere, per favore?",{choice:"AIUTI BABY BOSS?",options:[{label:"Ci penso io",do:{startQuest:"pattini"},then:["Grazie grazie grazie! Ti aspetto qui, faccio il bravo."]},{label:"Adesso no",then:["Va bene, non fa niente. Intanto guardo gli altri. Si impara anche guardando!"]}]}]},"q.pattini.progress":{who:"Baby Boss",steps:["I pattini li ha Edo, qui vicino. Il caschetto è da Lia, al Negozio Animali. Grazie che mi aiuti!"]},"q.pattini.deliver":{who:"Baby Boss",steps:["I miei pattini! E il caschetto! Grazie, Grimo, sei la migliore.","Tieni, sono i soldini del salvadanaio. Li avevo messi da parte per una cosa importante. Questa è una cosa importante."]},"q.borlenghi.offer":{who:"Silvia",steps:["Grimo! Ho tre ordini di borlenghi e nessuno che li porti.","Uno in piazza, uno nel quartiere alto e uno al parco. I clienti ti aspettano lì.",{choice:"CONSEGNI I BORLENGHI?",options:[{label:"Ci penso io",do:{startQuest:"borlenghi"},then:["Grande! Vai finché sono caldi. E Beba… non guardarmi così, non sono per te."]},{label:"Adesso no",then:["Allora li mangio io. Scherzo. Forse."]}]}]},"q.borlenghi.progress":{who:"Silvia",steps:["Piazza, quartiere alto e parco. I clienti li riconosci: hanno fame."]},"q.borlenghi.deliver":{who:"Silvia",steps:["Tutti consegnati? Sei più veloce del mio motorino. Che è rotto, ma comunque.","Ecco la tua parte. Torna quando vuoi: alla Baracchina il lavoro non manca."]},"cliente.cliente_piazza":{who:"Cliente",steps:["Il mio borlengo! Con il pesto modenese, come piace a me. Grazie!"]},"cliente.cliente_quartiere":{who:"Cliente",steps:["Finalmente! Stavo per mangiare il basilico del balcone. Grazie!"]},"cliente.cliente_parco":{who:"Cliente",steps:["Borlengo al parco: il pranzo perfetto. Il tuo cane però mi fissa."]},"q.pizze.offer":{who:"Alan",steps:["Speedy Pizza è senza fattorino: si è innamorato e ha cambiato paese. Tipico.","Ho tre pizze: una per Gino al casale, una per Ivo, l’operaio che lavora alla stazione e una per gli orti comunali.",{choice:"FAI TU LA SPEEDY PIZZA?",options:[{label:"Ci penso io",do:{startQuest:"pizze"},then:["Vai, vai! Speedy, mi raccomando. Consegnale a mano, eh: le pizze si danno alle persone, non agli zerbini."]},{label:"Adesso no",then:["Va bene. Le consegnerò io, piano piano. Molto piano."]}]}]},"q.pizze.progress":{who:"Alan",steps:["Gino al casale, Ivo alla stazione e gli orti comunali nel quartiere alto. Speedy!"]},"q.pizze.deliver":{who:"Alan",steps:["Consegnate calde? Brava! Speedy Pizza è salva.","Tieni il compenso. E se hai fame, la margherita te la faccio io."]},"q.pulizia.offer":{who:"Wilma",steps:["Sono Wilma. Lo sgambatoio è pieno di ricordini dei cani, e io ho la schiena che fa giudizio.","Ne raccogli dieci in due minuti e mezzo? Con la paletta: mettiti davanti e premi A.",{choice:"PULISCI LO SGAMBATOIO?",options:[{label:"Ci penso io",do:{startQuest:"pulizia"},then:["Il tempo parte adesso. Forza!"]},{label:"Adesso no",then:["Capisco. È un lavoro sporco. Letteralmente."]}]}]},"q.pulizia.progress":{who:"Wilma",steps:["Dentro il recinto, con la paletta. Veloce, che i cani producono!"]},"q.pulizia.deliver":{who:"Wilma",steps:["Che meraviglia, sembra un giardino inglese!","Ecco il compenso. Te lo sei guadagnato. Lavati le mani, eh."]},"q.pulizia.failed":{who:"",steps:["Tempo scaduto! Wilma ha finito da sola.","Niente di grave: puoi riprovare quando vuoi."]},"q.edo_spazzatura.offer":{who:"Edo",steps:["Sorellina… sai quella cosa che si fa con i sacchi?","Ecco. Il sacco è qui. I bidoni sono nella piazzetta in cima al paese. Lontanissimo. Tipo cinque minuti.",{choice:"BUTTI LA SPAZZATURA?",options:[{label:"Ci penso io",do:{startQuest:"edo_spazzatura"},then:["Ti voglio un bene che non ti immagini."]},{label:"Adesso no",then:["Va bene. Lo tengo qui ancora un po’. Ci stiamo affezionando."]}]}]},"q.edo_spazzatura.progress":{who:"Edo",steps:["I bidoni sono nella piazzetta, in cima al paese. Grazie, sei la sorella migliore del mondo. E anche l’unica."]},"q.edo_spazzatura.deliver":{who:"Edo",steps:["Fatto? Già? Sei velocissima.","Tieni, offro io. Simbolicamente. Ti voglio bene!"]},"q.edo_accompagna.offer":{who:"Edo",steps:["Devo fare un sopralluogo al parco per il film.","Mi accompagni? Da solo mi distraggo, guardo un piccione e finisco alla stazione.",{choice:"ACCOMPAGNI EDO?",options:[{label:"Ci penso io",do:{startQuest:"edo_accompagna"},then:["Andiamo! Io ti seguo. Cioè, tu mi guidi. Cioè, insieme."]},{label:"Adesso no",then:["Ok, aspetto qui. Tanto il parco non scappa. Credo."]}]}]},"q.edo_accompagna.progress":{who:"Edo",steps:["Il parco è in fondo al paese, giusto? Io ti vengo dietro. Non correre!"]},"q.edo_accompagna.deliver":{who:"Edo",steps:["Eccolo, il parco. Luce bellissima, panchine perfette.","Grazie per avermi portato. Senza di te sarei ancora lì a decidere da che parte si va. Ti voglio bene."]},"q.edo_merenda.offer":{who:"Edo",steps:["Sorellina, ho una fame da set.","Mi prendi una ciambella da Teresa? Il forno è… là. Troppo là.",{choice:"PRENDI LA CIAMBELLA?",options:[{label:"Ci penso io",do:{startQuest:"edo_merenda"},then:["Sei un angelo con lo zaino."]},{label:"Adesso no",then:["Va bene, resisto. Sono un artista: soffrire mi fa bene. Più o meno."]}]}]},"q.edo_merenda.progress":{who:"Edo",steps:["Una ciambella dal Forno di Teresa. Una. Due se ne vuoi una anche tu."]},"q.edo_merenda.manca":{who:"Edo",steps:["Mi serve una ciambella del Forno di Teresa. Non ho fretta. Ho solo fame."]},"q.edo_merenda.deliver":{who:"Edo",steps:["Ancora tiepida! Mi hai salvato la giornata.","Ecco i soldini, con gli interessi. Gli interessi sono un abbraccio."]},"q.edo_messaggio.offer":{who:"Edo",steps:["Devo dire a Vale che domani giriamo alle quattro.","Scriverle è freddo. Andarci è lontano. Tu sei la via di mezzo perfetta.",{choice:"PORTI IL MESSAGGIO?",options:[{label:"Ci penso io",do:{startQuest:"edo_messaggio"},then:["Dille che è importante. E che la saluto. Con calore."]},{label:"Adesso no",then:["Va bene, glielo dico domani. O dopodomani. Il cinema ha i suoi tempi."]}]}]},"q.edo_messaggio.progress":{who:"Edo",steps:["Vale è di solito vicino allo skate park o in piazza. Dille: domani alle quattro!"]},"q.edo_messaggio.vale":{who:"Vale",steps:["Edo ti ha mandata fin qui per dirmi un orario? È a cento metri.","Va bene: domani alle quattro. Digli che ci sono."]},"q.edo_messaggio.deliver":{who:"Edo",steps:["Ci sarà? Che bello. Lo sapevo che mandare te era la scelta giusta.","Grazie, sorellina. Sei la mia produttrice esecutiva."]},"q.edo.progress":{who:"Edo",steps:["Sorellina, il film non si gira da solo! Cioè sì, ma viene male."]},"q.set.deliver":{who:"Edo",steps:["Fiori, luce, collina… perfetto! Domani giro lì la scena madre.","Ecco il tuo cachet da assistente. È simbolico. Molto simbolico."]},"q.pacco.deliver":{who:"Edo",steps:["Il pacco! Dentro c’è… un treppiede. E un calzino. Il calzino non so di chi sia.","Ecco il compenso. Sei nei titoli di coda, giuro."]},"npc.gina":{who:"Gina delle Canare",steps:[{rotate:"gina",variants:[["Noi Canare sappiamo tutto di tutti. Soprattutto dei cani. Soprattutto dei padroni."],["Hai visto Zeus? Brontola, ma è un pezzo di pane."],["Oggi Birillo ha salutato diciassette persone. Diciotto con il postino, ma Marta non conta: è di famiglia."],["Se vedi un cane da solo, chiama noi. Le Canare non lasciano indietro nessuno."],[{if:{weather:["pioggia","temporale"]},then:["Con la pioggia restiamo sotto il portico. Le chiacchiere però escono lo stesso."],else:["Bella giornata per un giro! Le Canare si muovono compatte, come un piccolo esercito di pettegole."]}]]}]},"npc.wilma":{who:"Wilma",steps:[{rotate:"wilma",variants:[["Lo sgambatoio è il mio regno. Pulito, ordinato, e pieno di cani felici."],["Ho una regola sola: chi entra, chiude il cancello. E chi scava, ricopre."],["Zeus sembra cattivo, ma con me fa le fusa. Sì, come un gatto. Non dirglielo."],[{if:{flag:"stazione_aperta"},then:["Mio nonno era il capostazione. Ora c’è Ivo, e la stazione è di nuovo viva. Il nonno sarebbe contento."],else:["Mio nonno era il capostazione. Ho ancora le sue chiavi appese in cucina. Chissà se un giorno serviranno."]}]]}]},"npc.babyboss":{who:"Baby Boss",steps:[{rotate:"babyboss",variants:[["Ciao Grimo! Oggi ho fatto tre giri senza cadere. Quattro, se non conti quella volta."],["Quando piove la rampa è scivolosa. Allora aspetto sotto la tettoia e conto le gocce."],["Vale dice che da grande sarò bravissimo. Io sono già grande. Quasi."],["Posso accarezzare Beba? …Ha fatto le fusa? I cani fanno le fusa?"],["Mi chiamano Boss, ma qui comandano tutti un pochino. È più bello così."],["Ho trovato un sassolino a forma di cuore. Lo tengo per la mia mamma."]]}]},"npc.dario":{who:"Silvia",steps:[{rotate:"dario",variants:[["Benvenuta alla Baracchina! Borlenghi, bibite e il bagno più famoso del paese."],["Il segreto del borlengo è la padella. E la pazienza. E la padella."],["Ieri un turista ha chiesto il borlengo senza niente. Gliel’ho dato con tutto. Lui ha capito."],["La Baracchina chiude a mezzanotte. O quando finisce lo stracchino. Di solito prima lo stracchino."],[{if:{time:["18:00","23:59"]},then:["La sera qui si sta bene: lucine accese, borlenghi caldi e le cicale che fanno il resto."],else:["A quest’ora la padella si sta ancora scaldando. Torna più tardi per il borlengo perfetto."]}]]}]},"npc.salvo":{who:"Alan",steps:[{rotate:"salvo",variants:[["La pizza migliore di Sasso, e con Speedy Pizza arriva anche a casa. Quando c’è il fattorino."],["Il forno lo accendo alle undici e lo spengo quando l’ultimo cliente dice basta."],["La margherita è la regina. La diavola la sua sorella ribelle."],["Il fattorino ha di nuovo sbagliato strada. Ha consegnato la pizza al campo da baseball. L’hanno mangiata lo stesso."],["Se vuoi lavorare con Speedy Pizza, il motorino è scassato ma il cuore è grande."]]}]},"obj.tavolo_mamma":{who:"",steps:[{if:{flag:"regalo_mamma"},then:["Sul tavolo c’è una busta: «Per la mia Grimo. Non spenderli tutti in crocchette.»","Dentro ci sono 5 euro.",{do:{money:5,unflags:["regalo_mamma"]}}],else:["Sul tavolo c’è un biglietto di mamma, scritto in stampatello e con il righello:","«Uscita alle 7:42. Colazione: frigo, secondo ripiano, etichetta verde. Ti voglio bene! P.»"]}]},"ada.talk":{who:"Signora Ada",steps:[{if:{emporio:["chiuso"],friend:{ada:2}},then:["Grimo cara, siediti un momento. Ti devo dire una cosa sull’edicola.","Era di Guglielmo, il mio amico. Un giorno è partito e mi ha lasciato le chiavi. «Dalle a qualcuno che vuole bene al paese», mi ha detto.","In paese parlano bene di te. Però c’è l’affitto arretrato da sistemare: 150 euro.",{choice:"PRENDI LE CHIAVI?",options:[{label:"Sì, pago io (€150)",if:{money:150},do:{money:-150,career:"chiavi",flags:["sentito_ettore"]},then:["Ecco le chiavi. Pesano più di quanto sembra, vero?","Dentro è un disastro, te lo dico subito. Ma Guglielmo sarebbe contento.",{say:"(Le chiavi dell’edicola sono tue. La porta è in piazza, accanto alla fontana.)",who:""}]},{label:"Non ho abbastanza soldi",if:{money:{"<":150}},then:["Nessuna fretta, cara. Le chiavi restano qui con me."]},{label:"Ci penso",then:["Va bene. Pensaci con calma: le edicole non scappano."]}]}],else:[{if:{emporio:["chiuso"],notFlag:"sentito_ettore"},then:["Vedi l’edicola lì in piazza? Era di Guglielmo. Teneva sempre una caramella per i bambini e una per i cani.","Un giorno è sparito. Le chiavi le ho io, sai. Le darò a qualcuno di cui il paese si fida.",{do:{flags:["sentito_ettore"]}}],else:[{rotate:"ada",variants:[["Da giovane cantavo anch’io. La voce si allena parlando con gli animali.","Beba ti ascolta sempre. È un buon segno."],["Su questa panchina ci sedevo già da bambina.","La panchina è stata cambiata quattro volte. Io no."],[{if:{emporio:["aperta"]},then:["Passo ogni mattina davanti all’emporio. Guglielmo sarebbe fiero di te."],else:["Guglielmo diceva: «Un’edicola è una finestra sul paese». Chissà dov’è adesso."]}]]}]}]}]},"emporio.inaugurazione":{who:"",steps:["Grimo gira il cartello: APERTO.","Fuori c’è già la signora Ada, con un mazzo di fiori di campo. Dietro di lei, mezzo paese fa finta di passare di lì per caso.","Beba si piazza davanti alla porta: da oggi è la mascotte ufficiale dell’Emporio di Grimo.",{do:{friend:{ada:1},message:{from:"mamma",text:"AMORE HO SAPUTO DELL’EMPORIO!!! Passo a comprare tutto. Cioè, qualcosa. Ti voglio bene!"}}},{do:{message:{from:"papa",text:"Mia figlia imprenditrice!!! L’ho detto a tutte. Cioè, a Marisa. Brava!"}}},{do:{message:{from:"edo",text:"Posso girare uno spot per l’emporio? Gratis. Quasi gratis."}}}]},"q.arredi.deliver":{who:"",steps:["Grimo sistema l’insegna, il bancone e l’espositore. Polvere ovunque, ma è tutto al suo posto.","Sull’insegna, sotto la vernice nuova, si legge ancora: «da Guglielmo»."]},"npc.lia":{who:"Lia",steps:[{rotate:"lia",variants:[["Qui c’è tutto per i cussoli. Anche la canna da pesca per i Laghetti di Porziola!"],["Un collarino rosso sta bene a tutti. Anche a un cane giallo. Soprattutto a un cane giallo."],["Beba ha il pelo bellissimo. Cosa le dai, la crema?"],["Oggi ho venduto un guinzaglio a un signore senza cane. Dice che è «per quando arriverà». Che tenero."],["Il gatto del negozio dorme nella vetrina. I clienti pensano sia finto. Lui li lascia credere."],["Se Beba fa la brava, ho sempre un biscottino sotto il bancone. Se non fa la brava, pure."]]}]},"npc.nadia":{who:"Nadia",steps:[{rotate:"nadia",variants:[["Ogni capo ha una storia. Questo cappotto ha ballato in tre decenni!"],["I vestiti nuovi? Mai capiti. Il vintage invece parla. A volte troppo."],["Quel cappello di paglia ti starebbe d’incanto. Fidati, ho occhio. E uno specchio."],["Questo vestito l’ha portato una signora di Bologna. Dice che ci ha ballato con un attore famoso. Non ricorda quale."],["Oggi niente sconti. Domani nemmeno. Però se sorridi, magari."],["Moe passa ogni settimana a prendere i bottoni spaiati. Ne fa occhi per le sue statue."]]}]},"npc.bruna":{who:"Bruna",steps:[{rotate:"bruna",variants:[["L’agriturismo ospita turisti da tutta Europa. A volte si perdono già al Conad.","Se peschi qualcosa ai laghetti, portamelo: il pesce fresco qui va a ruba."],["Il tiramisù è un miracolo. Lo dicono i turisti, io lo so da sempre."],["Lo storione dei laghetti? Mio nonno diceva di averlo visto una notte. Mio nonno diceva tante cose."],["Ho dei turisti olandesi che vanno in bici su per la collina. Per divertimento. Non capirò mai."],["La colazione del Rio Verde è leggendaria. Soprattutto la parte in cui finisco la marmellata."],[{if:{flag:"stazione_aperta"},then:["Da quando ferma il treno, l’agriturismo è sempre pieno! Devo comprare più tazze. E più pazienza."],else:["Se ci fosse il treno, avrei il doppio dei turisti. E metà del tempo libero. Ci sto."]}]]}]},"q.baseball.offer":{who:"Giovanni",steps:["Il campo da baseball è il mio regno. Un regno pieno di palline perse.","Sono quattro, sparse qui intorno. Beba ha un gran fiuto: me le ritrovate?",{choice:"CERCHI LE PALLINE?",options:[{label:"Ci penso io",do:{startQuest:"baseball"},then:["Grande! Occhio alla rete dietro la casa base: lì si incastrano sempre."]},{label:"Adesso no",then:["Va bene. Le cercherò io. Domani. O dopodomani."]}]}]},"q.baseball.progress":{who:"Giovanni",steps:["Quattro palline, né una di più né una di meno. Beba saprà dove sono."]},"q.baseball.deliver":{who:"Giovanni",steps:["Tutte e quattro! Beba, sei la miglior ricevitrice che questo campo abbia mai visto.","Ecco il compenso. E se vuoi, la domenica si gioca: le squadre hanno sempre bisogno di qualcuno."]},"q.brughiera.offer":{who:"Eleonora",steps:["Grimo, meno male che sei passata! Oggi alla Brughiera è una di quelle giornate.","La sella è da Lia, al Negozio Animali, per una cucitura. E i cavalli aspettano di essere strigliati.","Mi dai una mano?",{choice:"AIUTI ELEONORA?",options:[{label:"Ci penso io",do:{startQuest:"brughiera"},then:["Grazie! Prima la sella da Lia, poi una bella strigliata a tutti e due, e alla fine la sella sul baio."]},{label:"Adesso no",then:["Va bene, li strigliamo stasera. Loro però ti aspettano."]}]}]},"q.brughiera.progress":{who:"Eleonora",steps:["Prima la sella da Lia, al Negozio Animali. Poi una bella strigliata a tutti e due, nel recinto. Alla fine la sella va sul baio: si entra dal varco a destra."]},"q.brughiera.deliver":{who:"Eleonora",steps:["Guarda come brillano! E la sella sul baio, già allacciata: sembrano pronti per una sfilata.","Adesso posso portare fuori i bambini del corso. Ecco il tuo compenso. Torna quando vuoi: i bambini del corso del sabato chiederanno di Beba."]},"q.moe.offer":{who:"Moe",steps:["Benvenuta nel mio studio. Io sono Moe, scultrice. Faccio statue con il ferro, il legno e le cose che la gente butta.","Per la prossima mi servono la teiera di rame e dei bottoni, che Nadia mi tiene da parte, e il vecchio vomere dell’aratro di Gino.",{choice:"PRENDI I MATERIALI?",options:[{label:"Ci penso io",do:{startQuest:"moe"},then:["Ogni oggetto abbandonato ha una seconda vita. Grazie."]},{label:"Adesso no",then:["Va bene. Il ferro aspetta, è paziente."]}]}]},"q.moe.progress":{who:"Moe",steps:["La teiera e i bottoni da Nadia, al vintage. Il vomere da Gino, al casale."]},"q.moe.deliver":{who:"Moe",steps:["Perfetti. Il vomere diventa la schiena, la teiera la testa, i bottoni gli occhi.","Moe lavora in silenzio, con lo scalpello e la saldatrice. Beba guarda, senza abbaiare.","Ecco: una piccola statua che somiglia un po’ a Beba. È per te. E questi sono per il tuo tempo."]},"npc.giovanni":{who:"Giovanni",steps:[{rotate:"giovanni",variants:[["Il campo da baseball è il mio regno. Attenzione alle palline vaganti."],["Il baseball è come la vita: si aspetta tanto, poi tutto succede in un attimo."],["La squadra ha perso di nuovo. Però abbiamo fatto una bellissima merenda."],["Il mio lancio migliore? Quello che ha centrato il furgone di Mirko. Non ditelo a Mirko."],["Beba sarebbe un ottimo esterno: corre, prende, riporta. Il regolamento però dice «giocatori umani»."]]}]},"npc.eleonora":{who:"Eleonora",steps:[{rotate:"eleonora",variants:[["Grimo! Jakie e Hope ti hanno sentita arrivare da metà paese.","Guarda Beba: è già sparita in mezzo a loro."],["Il pezzato è timidissimo. Il baio invece mangerebbe anche il tuo cappello."],["Quando vuoi una mano coi cavalli, o due chiacchiere, sai dove trovarmi."],["Hope oggi ha mangiato un fiore del recinto. Poi mi ha guardato come se fosse colpa mia."],["I cavalli capiscono l’umore delle persone. Tu oggi sei di buon umore: Jakie ti ha già annusata due volte."],[{if:{time:["06:00","11:00"]},then:["La mattina presto alla Brughiera c’è la nebbiolina sui prati. Sembra un sogno, con i cavalli dentro."],else:["Il tramonto da qui è il più bello della valle. Me lo dicono anche i cavalli. A modo loro."]}]]}]},"npc.moe":{who:"Moe",steps:[{rotate:"moe",variants:[["Io sono Moe, scultrice. Il ferro, il legno, la pietra: tutto ha una forma dentro. Io la tiro fuori."],["Ogni oggetto abbandonato ha una seconda vita. Anche l’edicola, un giorno."],["Ho fatto una statua con un vecchio ombrello e una pentola. Si chiama Signora Pioggia. È molto elegante."],["In Giappone mia nonna intagliava il legno. Diceva: «Non decidi tu la forma. La ascolti.»"],["Il fiume porta sempre qualcosa. Oggi un mestolo. Domani chissà, magari una scultura."],["Beba sta ferma come una modella. Prima o poi le faccio un ritratto in bronzo. Cioè, in latta."]]}]},"npc.carla":{who:"Carla delle Canare",steps:[{rotate:"carla",variants:[["Siamo le Canare! Chiacchieriamo e coccoliamo ogni cane del paese.","Briciola, saluta Beba. Brava."],["Lo sai che la postina porta tre cartoline a tre signore diverse? Tutte con lo stesso cuore disegnato. Non dico di chi sono.","…Va bene, te lo dico: di tuo padre."],["Moe, nel suo studio in campagna, cerca sempre roba vecchia. Una volta ha fatto una statua con il mio ombrello. Bellissima, ma era il mio ombrello."],["Oggi ho fatto la treccia a Briciola. Non le piace, ma le sta benissimo."],["Il segreto delle Canare? Scarpe comode e lingua veloce."]]}]},"npc.wanda":{who:"Wanda delle Canare",steps:[{rotate:"wanda",variants:[["Pallino non si fida di nessuno. Di me sì. A volte."],["Giovanni del baseball perde più palline di quante ne lanci. Se lo aiuti ti paga bene, eh."],["Dicono che i laghetti di notte nascondano un pesce enorme. Io dico che dicono tante cose."],["Pallino oggi ha accettato un biscotto da Pina. Storico. Dovremmo mettere una targa."],["Abbiamo contato i gradini della collina. Non te lo dico quanti sono: ti passerebbe la voglia."]]}]},"npc.pina":{who:"Pina delle Canare",steps:[{rotate:"pina",variants:[["Io sono Pina. Non ho un cane: ho le amiche. È uguale, ma abbaiano meno."],["Eleonora alla Brughiera ha sempre bisogno di una mano coi cavalli. E Jakie e Hope adorano Beba."],["Guglielmo, quello dell’edicola, lasciava messaggi nelle riviste. Chissà se qualcuno li ha mai trovati."],["Da giovane volevo fare la ballerina. Poi ho scoperto le chiacchiere. Mi muovo uguale, ma da ferma."],["Oreo è il cussolo più veloce del paese. Soprattutto quando scappa."]]}]},"npc.rita":{who:"Rita",steps:[{rotate:"rita",variants:[["Ciao, sono Rita. Biscotto è a casa che scava un buco nel divano. Lo sento da qui."],["Biscotto ha due modalità: dormire e distruggere. Niente in mezzo."],["Biscotto ha imparato ad aprire il frigo. Ora stiamo trattando le condizioni."],["Se lo porti allo sgambatoio, torna stanco e felice. Io torno solo stanca."],["Pepe e Biscotto insieme sono un uragano. Un uragano con le orecchie."]]}]},"q.passeggiata.offer":{who:"Carla delle Canare",steps:["Grimo! Vieni a passeggio con noi? Si cammina, si chiacchiera, i cani si annusano.","Basta stare vicino al gruppo. Le gambe le muovi tu, la lingua noi.",{choice:"PASSEGGI CON LE CANARE?",options:[{label:"Ci sto",do:{startQuest:"passeggiata"},then:["Brava! Andiamo, che Briciola ha fretta."]},{label:"Un’altra volta",then:["Peccato! Domani passiamo di nuovo di qui, come sempre."]}]}]},"q.passeggiata.progress":{who:"Carla delle Canare",steps:["Stai vicina, che il bello viene adesso: i pettegolezzi del quartiere alto."]},"q.passeggiata.done":{who:"Carla delle Canare",steps:["Che bella passeggiata! Ora sei una Canara onoraria. Quasi.","Tieni, per le crocchette di Beba. E torna domani!"]},"q.pettegolezzi.offer":{who:"Gina delle Canare",steps:["Grimo, mi serve una staffetta. Le altre Canare sono a spasso e io devo restare qui con i cani.","Trovale e fatti raccontare tutto da tutte e tre. Ma veloce: le notizie invecchiano in fretta!",{choice:"FAI LA STAFFETTA?",options:[{label:"Ci sto",do:{startQuest:"pettegolezzi"},then:["Vai! Hai un minuto e un quarto. Di solito passano per la piazza o per il quartiere alto."]},{label:"Un’altra volta",then:["Va bene. Le notizie me le racconteranno stasera. Vecchie."]}]}]},"q.pettegolezzi.progress":{who:"Gina delle Canare",steps:["Carla, Wanda e Pina. Tutte e tre! E poi torna a raccontarmi."]},"q.pettegolezzi.deliver":{who:"Gina delle Canare",steps:["Davvero Moe ha fatto una statua con un ombrello? E il papà di Grimo… no, questo lo sapevo già.","Brava staffetta! Ecco il compenso. Le Canare ti devono un favore."]},"q.dogsitting.offer":{who:"Rita",steps:["Sei tu quella che ha sempre Beba dietro? Perfetto. Mi porti a spasso Biscotto?","Fallo girare almeno un minuto e mezzo. Si stanca in fretta e odia i cani che ringhiano: lo sgambatoio invece lo rilassa.","Ti pago in base a com’è di umore quando torna.",{choice:"FAI LA DOG SITTER?",options:[{label:"Ci sto",do:{startQuest:"dogsitting"},then:["Eccolo! Biscotto, fai il bravo. …Non lo farà."]},{label:"Un’altra volta",then:["Va bene. Il divano ringrazia. Cioè, no."]}]}]},"q.dogsitting.progress":{who:"Rita",steps:["Biscotto sta bene? Fallo girare ancora un po’, e se è nervoso portalo allo sgambatoio."]},"q.dogsitting.deliver":{who:"Rita",steps:["Biscotto! Guarda com’è contento. Hai la mano, eh.","Ecco il compenso. Se vuoi, ho delle amiche con cani che hanno bisogno di una dog sitter…"]},"npc.juicy":{who:"Juicy Gustavo",steps:[{rotate:"juicy",variants:[["Il mio vero nome? Marco. Ma «Marco» non vende dischi. «Juicy» sì.","Tienilo per te, collega. Tua mamma lo sa già: mi chiama Marco davanti a tutti."],["Io sono Juicy Gustavo, produttore. Lo studio è piccolo, ma i sogni no.","Investi nello studio e registriamo il tuo primo CD."],["La musica è come il borlengo: va servita calda, e mai con la panna."],["Beba ha orecchio. L’ho vista muovere la coda a tempo. Quasi."],["Il tour con IndiePisol è stato un successo. Lui cantava, io portavo le casse. E pure il pubblico, a volte."],["Un buon produttore ascolta. Un grande produttore ascolta e poi dice «ancora una volta, con più cuore»."],["Il treno mi ha riportato a casa. Il mio cuore era già qui. Le mie valigie no: le ho lasciate a Vergato."]]}]},"juicy.bosco":{who:"Juicy Gustavo",steps:["Con questo mixer posso finalmente pulire una vecchia cassetta che ho trovato in edicola, anni fa.","È Guglielmo che canticchia. Una melodia strana, sempre la stessa. Dicono che la cantasse davanti al cancello del bosco.",{say:"(Grimo ha imparato la «Canzone del bosco».)",who:""},{do:{flags:["sentito_ettore"]}}]},"q.dogsit_nina.offer":{who:"Marta la postina",steps:["Grimo! Rita dice che sei una dog sitter coi fiocchi.","Mi porti a spasso Nina mentre finisco il giro? Ha energia per tre.",{choice:"PORTI NINA A SPASSO?",options:[{label:"Ci sto",do:{startQuest:"dogsit_nina"},then:["Grazie! Se corre in cerchio è normale. È la gioia."]},{label:"Un’altra volta",then:["Va bene, me la porto dietro. Con le lettere. E la gioia."]}]}]},"q.dogsit_nina.progress":{who:"Marta la postina",steps:["Nina sta bene? Fatela correre un po’: allo sgambatoio impazzisce di felicità."]},"q.dogsit_nina.deliver":{who:"Marta la postina",steps:["Nina! Guarda com’è stanca e felice. Missione compiuta.","Ecco il compenso. Lo dirò a tutto il paese: tanto lo faccio comunque."]},"q.dogsit_gelsomina.offer":{who:"Signora Ada",steps:["Cara, Gelsomina ha bisogno della sua passeggiata, ma le mie ginocchia oggi dicono di no.","La porteresti tu? Piano piano, lei è una signora.",{choice:"PORTI GELSOMINA A SPASSO?",options:[{label:"Ci sto",do:{startQuest:"dogsit_gelsomina"},then:["Che tesoro. Tenetevi lontane dai cani brontoloni, lei si spaventa."]},{label:"Un’altra volta",then:["Nessun problema, cara. Faremo il giro della panchina."]}]}]},"q.dogsit_gelsomina.progress":{who:"Signora Ada",steps:["Gelsomina è contenta? Lei non corre, ma si guarda intorno con grande soddisfazione."]},"q.dogsit_gelsomina.deliver":{who:"Signora Ada",steps:["Guarda come scodinzola! Non la vedevo così da anni.","Prendi, cara. E torna presto: Gelsomina ti aspetta."]},"q.dogsit_doppio.offer":{who:"Rita",steps:["Ho una proposta per la mia dog sitter preferita: Biscotto più Pepe, il cane della mia amica.","Insieme sono una squadra di demolizione. Due minuti di passeggiata, paga doppia. Quasi.",{choice:"DUE CANI INSIEME?",options:[{label:"Ci sto",do:{startQuest:"dogsit_doppio"},then:["Coraggio! Se si agitano, sgambatoio. Se si agitano di più, ninnananna."]},{label:"Un’altra volta",then:["Capisco. Neanche io ce la farei."]}]}]},"q.dogsit_doppio.progress":{who:"Rita",steps:["Due cani, un guinzaglio, mille idee. Resisti!"]},"q.dogsit_doppio.deliver":{who:"Rita",steps:["Sono interi! E anche tu! Sei ufficialmente la dog sitter migliore di Sasso.","Ecco il compenso. La mia amica dice grazie. Pepe dice bau."]},"sassolini.raduno":{who:"",steps:["Intorno alla pietra di Guglielmo ci sono tutti i Sassolini che hai trovato, in cerchio. Ti guardano con i loro occhietti.","Uno, più vecchio degli altri, si schiarisce la voce (i sassi hanno una voce?): «Guglielmo ci aveva nascosti per chi avesse il fiuto e la pazienza».","«Questo è per te, e questo per Beba». Davanti alla pietra c’è un sassolino d’oro e un collare fatto di sassolini lucidi.",{do:{money:50,items:{speciale_sassolino_oro:1},wear:"beba:collare_sassi",flags:["sassolini_premio"]}},{say:"(Hai ricevuto €50, il Sassolino d’oro e il Collare di Sassolini per Beba: lo trovi nell’armadio.)",who:""}]},"npc.gino":{who:"Gino",steps:[{if:{pensione:["chiuso"],friend:{gino:2}},then:["Tu sei quella del cane che sorride. In paese parlano bene di te.","Quel cortile lì, accanto al casale, non lo usa più nessuno da quando ho smesso con le galline.","Ci vorrebbe una pensione per cani: d’estate la gente parte e non sa a chi lasciarli. Te lo affitto, se vuoi.",{choice:"AFFITTI IL CORTILE?",options:[{label:"Sì (€80)",if:{money:80},do:{money:-80,pensione:"affitto"},then:["Affare fatto. Per i recinti chiamo mio nipote: tu ordina dalla bacheca e lui viene.",{say:"(Il cortile è tuo. La bacheca è accanto al cancello, a destra del casale.)",who:""}]},{label:"Non ho abbastanza soldi",if:{money:{"<":80}},then:["Le galline non tornano. Il cortile ti aspetta."]},{label:"Ci penso",then:["Pensaci. Io sono qui tutti i giorni, a guardare il campo."]}]}],else:[{if:{pensione:["chiuso"]},then:["Buongiorno. Questo è il mio casale: ottant’anni di muri e tre di tetto nuovo.","Ti conosco poco, ma il paese parla. Fatti conoscere e ripassa."],else:[{rotate:"gino",variants:[[{if:{pensione:["aperta"]},then:["Stanotte non hanno abbaiato. Si vede che stanno bene."],else:["Il cortile è tuo: per i lavori c’è la bacheca."]}],["Le crocchette le prendi al Conad. Io ai miei cani davo la pasta avanzata, ma erano altri tempi."],["Ai cani serve poco: da mangiare, da bere, qualcuno che giochi con loro e un posto pulito.","Come a noi, del resto."]]}]}]}]},"npc.hans":{who:"Hans",steps:[{rotate:"hans",variants:[["Sasso Marconi è molto bella. Molto… in salita."],["Greta dice che qui le colline sono come un quadro. Io dico che sono come una palestra."],["Ho mangiato un borlengo. Ora capisco il senso della vita. È rotondo."],["In Germania abbiamo le colline. Ma non hanno questo profumo di crescentine."],[{if:{weather:["pioggia","temporale"]},then:["Piove! Greta dice che è romantico. Io dico che il mio ombrello ha un buco."],else:["Con il sole Sasso Marconi brilla. Anche la mia fronte, dopo la salita."]}]]}]},"npc.greta":{who:"Greta",steps:[{rotate:"greta",variants:[["Il cane è tuo? È bellissimo! In Germania lo chiameremmo… Beba. Ah, si chiama già Beba."],["Abbiamo preso troppi tortellini. Non è vero, non sono mai troppi."],["Domani andiamo ai laghetti. Hans dice che pescherà lo storione. Io porto i panini, per sicurezza."],["Ho imparato a dire «che bel cagnolino» in dialetto. Non te lo dico, però: lo sbaglierei."]]}]},"q.turisti.offer":{who:"Hans",steps:["Scusa! Noi siamo Hans e Greta, in vacanza. Dobbiamo arrivare al Agriturismo Rio Verde, ma qui ogni strada sembra uguale.","Ci accompagni? Camminiamo dietro di te, piano piano.",{choice:"ACCOMPAGNI I TURISTI?",options:[{label:"Seguitemi!",do:{startQuest:"turisti"},then:["Wunderbar! Andiamo. Greta, vieni!"]},{label:"Adesso no",then:["Va bene, aspettiamo qui. Il Conad ha tante cose da guardare."]}]}]},"q.turisti.progress":{who:"Hans",steps:["Ti seguiamo! L’agriturismo è lontano? Greta vuole sapere se c’è il tiramisù."]},"npc.mirko":{who:"Mirko",steps:[{rotate:"mirko",variants:[["Svapo Shop: liquidi, ricariche e nuvole profumate. Solo per maggiorenni, eh: i ragazzini qui non entrano."],["Lo so, non è un negozio per tutti. Però le nuvole alla fragola hanno il loro pubblico."],["Il camion delle ricariche arriva sempre in ritardo. Ma arriva. Come me la mattina."],["Fumare fa male, svapare… un po’ meno, dicono. Io dico: Beba non svapa, e guarda com’è in forma."]]}]},"q.camion.offer":{who:"Mirko",steps:["Che giornata. Il camion con la merce si è fermato lungo la strada del lago e ha perso tre casse.","Il camionista è ripartito, io non posso chiudere il negozio. Me le ritrovi? Il cane mi sembra uno che trova le cose.",{choice:"CERCHI LE CASSE?",options:[{label:"Ci penso io",do:{startQuest:"camion"},then:["Grazie. Sono scatoloni marroni, chiusi col nastro. Non aprirli, sono roba da negozio."]},{label:"Adesso no",then:["Va bene. Speriamo che non piova."]}]}]},"q.camion.progress":{who:"Mirko",steps:["Tre casse, lungo la strada del lago. Beba le sente di sicuro."]},"q.camion.deliver":{who:"Mirko",steps:["Tutte e tre, intatte! Mi hai salvato la settimana.","Ecco il compenso. E se ti serve un consiglio sui camion, io ne so più di quanto vorrei."]},"cliente.cliente_orti":{who:"Ortolana",steps:["Una pizza agli orti! Dopo una mattina di zappa è un premio. Grazie!"]},"npc.teresa":{who:"Teresa",steps:[{rotate:"teresa",variants:[["Il forno si accende alle cinque. A quell’ora il paese è tutto mio."],["La focaccia va mangiata calda e con le mani. Le regole del forno."],["Per Beba ho i biscottini con la forma d’osso. Li faccio io, senza zucchero."],["Stamattina la pasta madre ha fatto i capricci. Le ho cantato una canzone e si è calmata."],["Il pane del sabato è più buono. Non chiedermi perché: è il sabato."],[{if:{time:["06:00","11:00"]},then:["Senti che profumo? Le ciambelle sono appena uscite. È il momento migliore per passare."],else:["A quest’ora restano solo le briciole. Ma sono briciole di qualità."]}]]}]},"npc.aldo":{who:"Aldo",steps:[{rotate:"aldo",variants:[["Gli orti sono di tutti. Chi pianta, raccoglie. Chi non pianta, chiacchiera con me."],["I pomodori vogliono sole e pazienza. Come le persone, del resto."],["Beba non scava nelle aiuole, vero? Brava. Ho visto cani peggiori. E anche persone."],["Le zucchine quest’anno sono impazzite. Una ha la forma di Lorena. Gliel’ho regalata."],["L’orto ti insegna una cosa: le cose belle crescono piano. Tranne le erbacce."],[{if:{weather:["pioggia","temporale"]},then:["Pioggia! Per gli orti è una festa. Per le mie ginocchia, un po’ meno."],else:["Il sole di oggi fa crescere i pomodori. Li sento proprio allungarsi, se sto zitto."]}]]}]},"q.cornetti.marta":{who:"Marta la postina",steps:["Cornetti di Rosa? Ancora caldi! Questa giornata è appena migliorata.","Tieni, per il disturbo. E dai una carezza a Beba da parte mia."]},"q.pizze.gino":{who:"Gino",steps:["Una pizza? Per me? Alan si ricorda ancora del vecchio Gino.","Dagli un abbraccio. Ma non troppo forte: ha la schiena delicata."]},"q.pizze.ivo":{who:"Ivo l’operaio",steps:["Una pizza per me? Nessuno mi porta niente da undici anni! Grazie, davvero. La mangio sulla panchina rotta."]},"q.lettera.teresa":{who:"Teresa",steps:["Una lettera per me? Con questa pioggia? Che cara.","È di mia sorella da Genova. Dì a Marta grazie, e prendi un biscotto per Beba."]},"q.turisti.deliver":{who:"Hans",steps:["Eccoci! L’agriturismo è bellissimo, e c’è davvero il tiramisù. Greta ha già prenotato due porzioni.","Grazie, Grimo. E grazie a Beba: guida perfetta. Questo è per voi.","Ora c’è solo un problema: per tornare a casa volevamo prendere il treno. Ma la stazione è chiusa da undici anni!","Se serve una mano per riaprirla, noi ci siamo. Hans sa usare il martello. Più o meno."]},"q.chiavi.offer":{who:"Mamma Paola",steps:["Grimo, amore… le mie chiavi non sono sul gancio. Il gancio numero tre, quello con l’etichetta «CHIAVI DI PAOLA».","Stamattina Lucio ha preso il caffè da Rosa. Con le mie chiavi in tasca. Coincidenza? Non credo.",{choice:"MAMMA",options:[{label:"Le prendo io",do:{startQuest:"chiavi"},then:["Sei la migliore. Se non le trovi, dormo da te."]},{label:"Adesso non posso",then:["Va bene, entro dalla finestra come l’altra volta."]}]}]},"q.chiavi.progress":{who:"Mamma Paola",steps:["Le chiavi? Secondo me sono da Rosa, al Tamarindo. Lei tiene da parte tutto quello che dimentica Lucio."]},"q.chiavi.deliver":{who:"Mamma Paola",steps:["Le mie chiavi! E la pera è ancora intera.","Questi sono per te. E ringrazia Rosa da parte mia. Anzi, no, glielo dico io: domani ci torno."]},"q.ricettario.offer":{who:"Mamma Paola",steps:["Grimo, ho fatto una cosa avventata: ho prestato il ricettario della nonna a Bruna, per la torta di riso.","È passata una settimana. Me lo riprendi? Con gentilezza. Ma riprendilo.",{choice:"MAMMA",options:[{label:"Ci penso io",do:{startQuest:"ricettario"},then:["Grazie! Senza quel quaderno sono una cuoca qualunque."]},{label:"Più tardi, mamma",then:["Va bene. Intanto cucino a memoria. Speriamo bene."]}]}]},"q.ricettario.progress":{who:"Mamma Paola",steps:["Il ricettario ce l’ha Bruna, al Rio Verde giù in campagna. Gentilmente. Ma riprendilo."]},"q.ricettario.deliver":{who:"Mamma Paola",steps:["Il ricettario della nonna! C’è ancora la macchia di sugo del 1987.","Stasera torta di riso. Tu e Beba siete invitate. Anzi, obbligate."]},"q.spesa_mamma.offer":{who:"Mamma Paola",steps:["Grimo, stasera ho ospiti e mi mancano il pane e il dolce.","Mi prendi una pagnotta e una ciambella da Teresa? Te li rendo, i soldi. Con gli interessi.",{choice:"MAMMA",options:[{label:"Ci penso io",do:{startQuest:"spesa_mamma"},then:["Grazie amore. Il forno è sotto la piazza."]},{label:"Oggi no",then:["Va bene, farò una cena senza pane. Come i francesi. No?"]}]}]},"q.spesa_mamma.progress":{who:"Mamma Paola",steps:["Una pagnotta e una ciambella, dal forno di Teresa. Grazie!"]},"q.spesa_mamma.manca":{who:"Mamma Paola",steps:["Amore, mi servono una pagnotta e una ciambella del forno di Teresa. Hai già preso tutto?"]},"q.spesa_mamma.deliver":{who:"Mamma Paola",steps:["Pane e ciambella! Così faccio bella figura.","Ecco i soldi, e qualcosa in più. Non dirlo a tuo fratello."]},"q.regalo.manca":{who:"Marta la postina",steps:["Un pacco per tuo papà? Prima però serve il pacco: Teresa al forno fa quelli di crescentine apposta."]},"q.regalo.marta":{who:"Marta la postina",steps:["Crescentine in vacanza? Tuo papà è un romantico.","Parte oggi con il furgone. Diglielo, che stia tranquillo."]},"q.regalo.deliver":{who:"Papà",steps:["Pronto? Il pacco è partito? Grimo, sei un tesoro!","Gabriella dice che sono le crescentine più buone d’Italia. Io dico che è merito di chi le ha spedite.","Ti ho mandato qualcosa per il disturbo. Ciao, ciao, salutami Beba!"]},"q.oreo.offer":{who:"Pina delle Canare",steps:["Grimo! Hai visto Oreo? Il mio cucciolo bianco e nero!","È scappato dietro a una farfalla e non è più tornato. Qualcuno dice di averlo visto andare verso la collina, qualcun altro verso la campagna.",{choice:"PINA",options:[{label:"Lo troviamo noi",do:{startQuest:"oreo"},then:["Grazie! Beba ha il naso migliore del paese. Oreo è piccolo, avrà paura."]},{label:"Adesso non posso",then:["Va bene… lo cercherò io, con le mie gambe. Che non sono più quelle di una volta."]}]}]},"q.oreo.progress":{who:"Pina delle Canare",steps:["Oreo è piccolo e ha paura di tutto, tranne delle farfalle. Verso la collina o la campagna…"]},"q.oreo.deliver":{who:"Pina delle Canare",steps:["Oreo! Vieni qui, birbante!","Grazie, Grimo. Grazie, Beba. Da oggi siete Canare onorarie: il giovedì offriamo noi il caffè.","E questo è per voi. Non dite di no a una signora."]},"q.copertina.moe":{who:"Moe",steps:["Una copertina? Per il tuo disco? Mi piace l’idea. Le cose dipinte a mano durano di più.","Mi servono due colori che non si comprano: terra rossa, quella del campo da baseball (chiedila a Giovanni), e un fiordaliso blu: Aldo ne ha agli orti."]},"q.copertina.moe2":{who:"Moe",steps:["Terra rossa e fiordaliso. Perfetto.","Dipingo te e Beba sulla collina, al tramonto. Nel mio paese si dice che un disco con un cane in copertina porta fortuna. Non è vero, ma suona bene.",{say:"(Moe dipinge in silenzio. Dopo un’ora la copertina è pronta: è bellissima.)",who:""}]},"q.copertina.deliver":{who:"Juicy Gustavo",steps:["È… è stupenda. Moe è un genio. E Beba in copertina? Venderemo il doppio.","Adesso si stampa. Il disco è quasi realtà, collega."]},"studio.concerto":{who:"",steps:["La piazza di Sasso Marconi è piena. Il carro di Gino è diventato un palco, con le lucine di Nadia appese tutto intorno.","Rosa gira con la limonata, Teresa con le ciambelle. La signora Ada ha il cappellino buono.","In prima fila c’è la mamma, con Lucio che tiene la borsa, il telefono e gli occhiali di riserva.","Grimo canta. Beba, seduta sul palco, ulula nel ritornello. Il pubblico impazzisce.","Giovanni e la squadra fanno la ola (male). Moe disegna. Edo gira tutto, sdraiato per terra per l’inquadratura giusta.","Alla fine applaudono anche le Canare, e la signora Ada piange un pochino."]},"q.macedonia.offer":{who:"Bruna",steps:["Stasera ho una comitiva di ciclisti e voglio fare la macedonia. Fresca, del frutteto qui accanto.","Me ne cogli cinque? Gli alberi sono pieni, basta allungare la mano.",{choice:"BRUNA",options:[{label:"Ci penso io",do:{startQuest:"macedonia"},then:["Grazie! Scegli quelle belle rosse."]},{label:"Adesso no",then:["Va bene, farò il tiramisù. Ai ciclisti piace tutto."]}]}]},"q.macedonia.progress":{who:"Bruna",steps:["Cinque frutti dal frutteto qui accanto. Un albero dà frutta una volta al giorno."]},"q.macedonia.manca":{who:"Bruna",steps:["Me ne servono cinque, per la macedonia. Il frutteto è proprio qui fuori."]},"q.macedonia.deliver":{who:"Bruna",steps:["Che belle! Profumano di estate.","Ecco il compenso. E stasera, se passi, una coppa di macedonia è tua."]},"q.spesa.teresa":{who:"Teresa",steps:["Il pane per Lorena? Eccolo, ancora tiepido. Non mangiarne un pezzo per strada. Va bene, uno."]},"q.spesa.aldo":{who:"Aldo",steps:["Per Lorena ho preparato una cassetta: zucchine, pomodori e un cavolo che sembra un cervello. Tieni."]},"q.pattini.edo":{who:"Edo",steps:["I pattini di Baby Boss? Li usavo per un carrello in movimento. Una scena incredibile. Tieni, il film è finito. Più o meno."]},"q.pattini.lia":{who:"Lia",steps:["Il caschetto! L’ha lasciato qui per misurarlo al mio gatto. Non gli stava. Eccolo."]},"q.caricabatterie.dario":{who:"Silvia",steps:["Il caricabatterie di tuo fratello? È qui dietro, vicino alle crescentine. Lo stava usando per caricare… un’altra prolunga."]},"q.pacco.marta":{who:"Marta la postina",steps:["Il pacco di Edo? Eccolo. Pesa come un treppiede. E fa rumore come un calzino. Non chiedermi come lo so."]},"q.chiavi.rosa":{who:"Rosa",steps:["Le chiavi con la pera? Di tua mamma, le riconosco. Le ha lasciate Lucio, con le briciole del cornetto sopra.","Tua mamma non dimentica mai niente. Lucio sì: ho un cassetto solo per lui. È un cassetto grande."]},"q.ricettario.bruna":{who:"Bruna",steps:["Il ricettario di tua nonna! Ho copiato la torta di riso, è venuta divina. Riportalo alla mamma, e dille che ne ho fatta una anche per lei."]},"q.arredi.gino":{who:"Gino",steps:["L’insegna di Guglielmo? Ce l’ho io, in cantina. Me l’ha lasciata prima di partire: «Tienila tu, che non prende la pioggia».","Eccola. Trattala bene: è più vecchia di te."]},"q.arredi.moe":{who:"Moe",steps:["Il bancone di Guglielmo? Lo uso come tavolo da lavoro, ci ho scolpito venti statue.","Ma è giusto che torni a casa. Prendilo. Le statue capiranno."]},"q.arredi.stazione":{who:"",steps:["La porta della stazione è chiusa, ma da una finestra rotta si vede l’espositore girevole di Guglielmo, appoggiato alla biglietteria.","Grimo allunga il braccio, Beba fa il tifo. Con un po’ di pazienza l’espositore esce. Polveroso, ma intero."]},"q.moe.nadia":{who:"Nadia",steps:["Per Moe? La teiera di rame della nonna Clara e i bottoni spaiati. Li tenevo da parte solo per lei.","Dille che voglio vedere la statua finita!"]},"q.moe.gino":{who:"Gino",steps:["Il vomere del vecchio aratro? Ha arato questi campi per quarant’anni.","Se diventa una statua, almeno si riposa in piedi. Prendilo."]},"q.brughiera.lia":{who:"Lia",steps:["La sella di Eleonora? Ricucita e lucidata. Dille che il cuoio va ingrassato ogni mese. Lo dico sempre, nessuno mi ascolta."]},"q.copertina.giovanni":{who:"Giovanni",steps:["Terra rossa per un disco? È la cosa più rock che abbia mai sentito. Prendi, è terra da campionato."]},"q.copertina.aldo":{who:"Aldo",steps:["Un fiordaliso per Moe? Scelgo il più blu. Ecco: sembra un pezzo di cielo."]},"q.ada_passeggiata.offer":{who:"Signora Ada",steps:["Grimo cara, tutti mi parlano di questo Giardino di Beba. Io non l’ho mai visto.","Mi ci accompagni? Cammino piano, ma racconto bene.",{choice:"ACCOMPAGNI ADA?",options:[{label:"Ci penso io",do:{startQuest:"ada_passeggiata"},then:["Che gentile. Andiamo, cara: tu davanti, io dietro, Beba nel mezzo."]},{label:"Adesso no",then:["Va bene, cara. Il giardino non scappa, e nemmeno io."]}]}]},"q.ada_passeggiata.progress":{who:"Signora Ada",steps:["Piano, piano. Il giardino è nel quartiere alto, vero? Ai miei tempi lì c’era una villetta."]},"q.ada_passeggiata.deliver":{who:"Signora Ada",steps:["Che meraviglia. Fiori, una panchina e un posto dove i cani possono giocare.","Guglielmo avrebbe messo un chiosco dei giornali qui accanto. Tieni, per la compagnia."]},"q.volantini.offer":{who:"Juicy Gustavo",steps:["Collega! Ho stampato i volantini delle serate in studio. Carta lucida, font elegante, la mia faccia in grande.","Vanno dati a mano alle persone che contano: Rosa, Teresa, Bruna e Nadia.",{choice:"DISTRIBUISCI I VOLANTINI?",options:[{label:"Ci penso io",do:{startQuest:"volantini"},then:["Vai, ambasciatrice del ritmo."]},{label:"Adesso no",then:["Va bene. Li userò come sottobicchieri, per ora."]}]}]},"q.volantini.progress":{who:"Juicy Gustavo",steps:["Rosa al Tamarindo, Teresa al forno, Bruna al Rio Verde, Nadia al vintage. Il marketing è fatica."]},"q.volantini.rosa":{who:"Rosa",steps:["Un volantino di Juicy? Lo attacco vicino alla macchina del caffè. Lì lo leggono tutti, mentre aspettano."]},"q.volantini.teresa":{who:"Teresa",steps:["Le serate di Juicy? Porto le crescentine. Lui canta, io impasto: è uno scambio onesto."]},"q.volantini.bruna":{who:"Bruna",steps:["Lo metto sul bancone, accanto al tiramisù. I turisti lo leggeranno mentre aspettano la seconda porzione."]},"q.volantini.nadia":{who:"Nadia",steps:["Un volantino lucido! Lo appendo in vetrina, vicino al cappotto anni Settanta. Fanno pendant."]},"q.volantini.deliver":{who:"Juicy Gustavo",steps:["Tutti consegnati? Allora stasera lo studio sarà pieno. O almeno mezzo.","Ecco, per il disturbo. Il marketing paga. A volte."]},"q.quiz.offer":{who:"Signora Ada",steps:["Grimo, facciamo il nostro quiz? Tre domande sul paese: ogni risposta giusta, quattro euro.",{rotate:"quiz_ada",variants:[["Da chi prende il nome Sasso Marconi?",{choice:"RISPOSTA",options:[{label:"Guglielmo Marconi",do:{money:4},then:["Brava! Giusto."]},{label:"Un sasso di nome Marconi",then:["No, cara. È Guglielmo Marconi, quello della radio."]},{label:"Marco Polo",then:["No, cara. È Guglielmo Marconi, quello della radio."]}]},"E prima del 1938, come si chiamava il paese?",{choice:"RISPOSTA",options:[{label:"Praduro e Sasso",do:{money:4},then:["Brava! Giusto."]},{label:"Sasso Vecchio",then:["No, cara. Si chiamava Praduro e Sasso. Lo dice anche il cartello in piazza."]},{label:"Borgo Reno",then:["No, cara. Si chiamava Praduro e Sasso. Lo dice anche il cartello in piazza."]}]},"Le rocce del Contrafforte Pliocenico sono nate…",{choice:"RISPOSTA",options:[{label:"Sul fondo di un mare antico",do:{money:4},then:["Brava! Giusto."]},{label:"Da un vulcano",then:["No, cara. Sul fondo di un mare antico: c’è scritto al belvedere."]},{label:"Da un ghiacciaio",then:["No, cara. Sul fondo di un mare antico: c’è scritto al belvedere."]}]}],["Dove fece Marconi i primi esperimenti con la radio?",{choice:"RISPOSTA",options:[{label:"A Villa Griffone, a Pontecchio",do:{money:4},then:["Brava! Giusto."]},{label:"Al Tamarindo",then:["No, cara. A Villa Griffone, a Pontecchio."]},{label:"Alla stazione",then:["No, cara. A Villa Griffone, a Pontecchio."]}]},"Cosa si trova ancora tra le rocce del Contrafforte?",{choice:"RISPOSTA",options:[{label:"Conchiglie fossili",do:{money:4},then:["Brava! Giusto."]},{label:"Monete d’oro",then:["No, cara. Conchiglie fossili, cara. I draghi lasciamoli a Edo."]},{label:"Ossa di drago",then:["No, cara. Conchiglie fossili, cara. I draghi lasciamoli a Edo."]}]},"A che ora si accende il forno di Teresa?",{choice:"RISPOSTA",options:[{label:"Alle cinque",do:{money:4},then:["Brava! Giusto."]},{label:"A mezzogiorno",then:["No, cara. Alle cinque. Teresa lo dice a tutti, con orgoglio."]},{label:"Mai, è elettrico",then:["No, cara. Alle cinque. Teresa lo dice a tutti, con orgoglio."]}]}],["Chi aveva l’edicola in piazza?",{choice:"RISPOSTA",options:[{label:"Guglielmo",do:{money:4},then:["Brava! Giusto."]},{label:"Gino",then:["No, cara. Era di Guglielmo, il mio amico."]},{label:"Juicy Gustavo",then:["No, cara. Era di Guglielmo, il mio amico."]}]},"Come si chiama il cucciolo di Pina?",{choice:"RISPOSTA",options:[{label:"Oreo",do:{money:4},then:["Brava! Giusto."]},{label:"Biscotto",then:["No, cara. Si chiama Oreo, bianco e nero come il biscotto."]},{label:"Pallone",then:["No, cara. Si chiama Oreo, bianco e nero come il biscotto."]}]},"Cosa costruisce Moe con gli oggetti buttati?",{choice:"RISPOSTA",options:[{label:"Marionette",do:{money:4},then:["Brava! Giusto."]},{label:"Torte",then:["No, cara. Marionette, e bellissime."]},{label:"Dischi",then:["No, cara. Marionette, e bellissime."]}]}]]},"Quiz finito! Domani tre domande nuove. Studia, cara: i cartelli non mentono.",{do:{startQuest:"quiz"}}]},"q.merenda.offer":{who:"Carla delle Canare",steps:["Disastro, Grimo: oggi la merenda toccava a me e mi sono dimenticata.","Ci vogliono due ciambelle di Teresa e un po’ di frutta, quella del frutteto del Rio Verde.",{choice:"PREPARI LA MERENDA?",options:[{label:"Ci penso io",do:{startQuest:"merenda"},then:["Sei un angelo. Wanda non deve sapere niente."]},{label:"Adesso no",then:["Va bene, diremo che siamo a dieta. Tutte e tre."]}]}]},"q.merenda.progress":{who:"Carla delle Canare",steps:["Due ciambelle dal forno e tre frutti dal frutteto. Wanda comincia a sospettare."]},"q.merenda.manca":{who:"Carla delle Canare",steps:["Ci servono due ciambelle di Teresa e tre frutti del frutteto, cara. Hai già tutto?"]},"q.merenda.deliver":{who:"Carla delle Canare",steps:["Ciambelle e frutta! Wanda, Pina: guardate che merenda ho preparato. Io. Da sola.","Grazie, Grimo. Questo è per te, e il segreto resta tra noi."]},"q.tramonto.offer":{who:"Edo",steps:["Sorellina, ho bisogno della mia direttrice della fotografia. Cioè tu.","La scena finale si gira al belvedere, in cima alla collina. Vai a vedere com’è la luce del pomeriggio e torna a raccontarmelo?",{choice:"VAI AL BELVEDERE?",options:[{label:"Ci penso io",do:{startQuest:"tramonto"},then:["Grande. Guarda tutto: le ombre, i colori, se c’è un piccione fotogenico."]},{label:"Adesso no",then:["Va bene, giro con la luce che capita. Il cinema italiano è fatto così."]}]}]},"q.tramonto.progress":{who:"Edo",steps:["Il belvedere è in cima alla collina, sopra le vigne e gli ulivi. Guarda bene la luce!"]},"q.tramonto.deliver":{who:"Edo",steps:["Arancione sui tetti, ombre lunghe sulle vigne e un cane in primo piano? È perfetto. È il finale.","Questo è il tuo compenso da consulente. Sei nei titoli di coda. Di nuovo."]},"q.concerto.rosa":{who:"Rosa",steps:["Un concerto qui davanti? Io porto fuori tutte le sedie del Tamarindo!","E faccio la limonata. Tanta limonata. Il Comune ha detto sì: l’ho chiesto io al sindaco, è mio cugino."]},"q.concerto.gino":{who:"Gino",steps:["Il carro del trattore? Ci ho portato fieno, zucche e una volta una mucca.","Un palco mai. Il pomeriggio del concerto lo porto in piazza e lo lavo. Più o meno."]},"q.concerto.nadia":{who:"Nadia",steps:["Le lucine! Sono nel baule dei Natali passati. Ne mancano tre, ma le altre brillano per tutte.","Tienile, e riportamele intere. O almeno quasi."]},"q.concerto.edo":{who:"Edo",steps:["Mia sorella in concerto? Lo giro io. Piano sequenza, luce arancione, il pubblico che canta.","Si intitolerà «Grimo». No, aspetta: «GRIMO». In maiuscolo. È un film d’autore."]},"q.concerto.ada":{who:"Signora Ada",steps:["Un concerto, cara? Verrò con il cappellino buono. E porto il ventaglio, così faccio il tempo."]},"q.concerto.teresa":{who:"Teresa",steps:["Un concerto in piazza? Porto le ciambelle. Un concerto senza ciambelle è solo rumore."]},"q.concerto.giovanni":{who:"Giovanni",steps:["Ci sarò! Porto tutta la squadra di baseball. Sappiamo fare la ola. Male, ma la facciamo."]},"q.concerto.moe":{who:"Moe",steps:["Verrò. Disegnerò il concerto mentre canti.","La musica e i colori sono la stessa cosa. Una suona, l’altra no."]},"q.concerto.progress":{who:"Juicy Gustavo",steps:["Collega, un concerto vero: piazza da Rosa, palco da Gino, luci da Nadia, la telecamera di tuo fratello.","E poi gli inviti: Ada, Teresa, Giovanni e Moe. La piazza deve essere piena!"]},"q.concerto.deliver":{who:"Juicy Gustavo",steps:["Piazza, palco, luci, telecamera e pubblico. Collega, sei un’organizzatrice nata.","Il concerto è domani sera, in piazza, tra le 20:30 e le 23. Sali sul palco e canta la tua canzone più famosa.","Io porto le casse. Beba porta la voce. Tu porta il cuore. E un po’ di popolarità, che non guasta."]},"npc.lucio":{who:"Lucio",steps:[{rotate:"lucio",variants:[["Ciao Grimo! Tua madre ha perso le chiavi. Le ho trovate io: erano nella fruttiera. Con le banane."],["Io le tengo una copia di tutto: chiavi, occhiali, telefono. Sono un uomo organizzato. Lei è un uomo… cioè, una donna creativa."],["Ho fatto il ragù. Tua madre dice che è buono. Tua madre dice che è buono anche il pane bruciato, però."],["Beba mi ha accettato in famiglia. Credo. Mi ha portato una ciabatta. Mia."],["Se ti serve una mano, dimmelo. Io e tua madre facciamo una bella squadra: lei perde le cose, io le ritrovo."]]}]},"q.sorpresa_mamma.offer":{who:"Lucio",steps:["Grimo, posso chiederti un favore? Ma piano, che se lo viene a sapere tua madre…","Vorrei farle una cena a sorpresa: fiori di campo da Aldo e le crescentine di Silvia, che le piacciono tanto.",{choice:"AIUTI LUCIO?",options:[{label:"Ci penso io",do:{startQuest:"sorpresa_mamma"},then:["Sei un tesoro. Acqua in bocca, mi raccomando!"]},{label:"Adesso no",then:["Va bene, allora le preparo il solito ragù. Le piace. Credo."]}]}]},"q.sorpresa_mamma.progress":{who:"Lucio",steps:["(sottovoce) I fiori da Aldo, agli orti. Le crescentine da Silvia, alla Baracchina. Sono già pagate!"]},"q.sorpresa_mamma.aldo":{who:"Aldo",steps:["Fiori per la tua mamma? Prendi questi: margherite e un po’ di salvia, che profuma.","Dille che vengono dall’orto più bello di Sasso. Il mio."]},"q.sorpresa_mamma.dario":{who:"Silvia",steps:["Le crescentine di Lucio! Calde calde, con lo stracchino. Quell’uomo sa come conquistare una donna."]},"q.sorpresa_mamma.deliver":{who:"Lucio",steps:["Perfetto! Ora metto i fiori nel vaso e le crescentine nel forno, così restano calde.","MAMMA: «Lucio! Ma che bello! …Grimo, c’entri tu, vero?»","Lucio ti fa l’occhiolino e ti mette in mano qualche moneta."]},"npc.vale":{who:"Vale",steps:[{rotate:"vale",variants:[["Ehi! Sto provando un kickflip. È il quarantesimo tentativo. Il quarantunesimo sarà quello buono."],["Baby Boss è il nostro mascotte. Gli insegno a frenare. Lui mi insegna a non avere paura."],["Lo skate park è piccolo, ma è nostro. Lo abbiamo dipinto noi, con i colori avanzati di Moe."],["Se cadi, ti rialzi. Se cadi davanti a tutti, ti rialzi e fai finta che fosse voluto."]]}]},"npc.tommy":{who:"Tommy",steps:[{rotate:"tommy",variants:[["Yo! Giro, giro, giro. Il segreto è non fermarsi mai. Tranne per il ghiacciolo."],["Edo mi vuole nel suo film. Io voglio solo fare un ollie decente. Possiamo fare entrambe le cose."],["La rampa di destra fa un rumore strano. La chiamo Gertrude."],["Il tuo cane mi guarda come se sapesse fare un trick meglio di me. Forse lo sa."]]}]},"q.tavola_vale.offer":{who:"Vale",steps:["No, no, no! Mi si è rotta una ruota. Proprio oggi che il trick veniva.","Nadia al mercatino ha sempre di tutto, magari anche ruote usate. E Gino ha gli attrezzi.",{choice:"AIUTI VALE?",options:[{label:"Ci penso io",do:{startQuest:"tavola_vale"},then:["Grande! Io intanto tengo la tavola al sicuro. Cioè, la guardo triste."]},{label:"Adesso no",then:["Ok, oggi faccio la spettatrice. Anche quello è un’arte."]}]}]},"q.tavola_vale.progress":{who:"Vale",steps:["Ruote da Nadia, al mercatino. Chiave inglese da Gino, verso il casale. Ce la fai!"]},"q.tavola_vale.nadia":{who:"Nadia",steps:["Ruote da skate? Ne ho quattro, gialle, di un ragazzo che ora fa il ragioniere.","Prendile. Avranno una seconda vita, come dice Moe."]},"q.tavola_vale.gino":{who:"Gino",steps:["La chiave inglese? Eccola. Ripara trattori, biciclette e una volta un frigorifero.","Uno skateboard sarà una passeggiata. Riportamela, eh."]},"q.tavola_vale.deliver":{who:"Vale",steps:["Ruote gialle! Sono ancora più belle di quelle vecchie.","Guarda, guarda… kickflip! …Quasi. Il prossimo te lo dedico. Tieni, per il disturbo."]},"q.ghiaccioli.offer":{who:"Tommy",steps:["Che caldo! Abbiamo fatto la colletta: ghiaccioli per tutti. Silvia li tiene in freezer alla Baracchina.","Me li porti? Uno a Baby Boss, uno a Vale, uno a Edo e l’ultimo a me. Prima che si sciolgano!",{choice:"PORTI I GHIACCIOLI?",options:[{label:"Ci penso io",do:{startQuest:"ghiaccioli"},then:["Sei un mito. Vai, vai, il sole non aspetta!"]},{label:"Adesso no",then:["Ok, aspettiamo che faccia fresco. Tipo a novembre."]}]}]},"q.ghiaccioli.progress":{who:"Tommy",steps:["I ghiaccioli sono da Silvia. Poi Baby Boss, Vale, Edo e io. Corri!"]},"q.ghiaccioli.dario":{who:"Silvia",steps:["I ghiaccioli dei ragazzi dello skate? Limone, menta, fragola e… questo non so cos’è. Blu.","Tienili in ombra!"]},"q.ghiaccioli.babyboss":{who:"Baby Boss",steps:["Per me? Fragola! Il mio preferito. Grazie, Grimo!"]},"q.ghiaccioli.vale":{who:"Vale",steps:["Menta! Rinfresca anche le idee. Adesso il kickflip viene di sicuro."]},"q.ghiaccioli.edo":{who:"Edo",steps:["Un ghiacciolo? Perfetto per una scena: «Estate, sudore, limone». È poesia."]},"q.ghiaccioli.deliver":{who:"Tommy",steps:["Quello blu è per me? Che gusto è? …Non lo so, ma è buonissimo.","Grazie! La banda dello skate ti deve un favore. E un paio di monete."]},"q.trick_boss.offer":{who:"Baby Boss",steps:["Grimo… posso dirti un segreto? Vorrei fare il mio primo salto sulla rampa.","Ma ho un po’ di paura. Se Vale mi spiega come si fa, e Lia mi dà le ginocchiere che tiene da parte per me… e tu resti a guardare…",{choice:"AIUTI BABY BOSS?",options:[{label:"Ci penso io",do:{startQuest:"trick_boss"},then:["Davvero? Allora mi alleno a respirare. Dentro, fuori. Dentro…"]},{label:"Adesso no",then:["Va bene. Magari domani sono un po’ più coraggioso."]}]}]},"q.trick_boss.progress":{who:"Baby Boss",steps:["Vale mi deve spiegare le ginocchia. Lia ha le ginocchiere. Io… respiro."]},"q.trick_boss.vale":{who:"Vale",steps:["Il primo
