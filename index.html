 salto di Baby Boss? Che emozione! Digli così: ginocchia morbide, sguardo avanti, e se cade ride.","Vengo anch’io a fare il tifo!"]},"q.trick_boss.lia":{who:"Lia",steps:["Le ginocchiere! Le tengo qui da mesi, aspettavo il grande giorno. Sono a forma di zampa, gli piaceranno."]},"q.trick_boss.deliver":{who:"Baby Boss",steps:["Ginocchia morbide… sguardo avanti… vado!","Baby Boss scende dalla rampa, salta un pochino… e atterra! Vale urla, Beba abbaia, Tommy applaude.","L’ho fatto! L’HO FATTO! Grimo, è il giorno più bello della mia vita. Dopo quello del gelato gigante."]},"q.stazione.pulizia":{who:"",steps:["È il giorno dei lavori. Davanti alla stazione c’è tutto il paese, all’alba. Ivo distribuisce scope e pennelli e si commuove un pochino.","Gino porta la scala, Aldo i gerani, Teresa le ciambelle per chi lavora. Rosa gira con il caffè.","Wilma ha portato le chiavi del nonno capostazione. Edo filma, Baby Boss e gli skater spazzano il piazzale correndo. La signora Ada dirige i lavori dalla panchina.","I cussoli fanno la loro parte: Birillo scaccia il piccione, Tango porta via i rami secchi, Gufo controlla che nessuno si stanchi troppo.","Si lavora tutto il giorno. A sera la stazione sembra nuova: panchina verde, gerani alle finestre, il tabellone che funziona.","Ivo: «In undici anni non ho mai visto niente di così bello. Ora scrivo alle Ferrovie: porta tu la lettera a Marta la postina?»"]},"q.stazione.offer":{who:"Ivo l’operaio",steps:["Ciao! Io sono Ivo. Mi hanno mandato a sistemare la stazione… undici anni fa. Da solo.","Ogni anno riparo una cosa. Quest’anno la maniglia. Al prossimo giro, forse, la panchina.","Se mi dessero una mano tutti, in un giorno sarebbe come nuova. E il treno tornerebbe a fermare a Sasso. Anche quello di Juicy Gustavo, che è in tour e non può rientrare.","Ma qui la gente aiuta chi l’ha aiutata, si sa. E i cussoli aiutano chi gli è amico.",{choice:"AIUTI IVO?",options:[{label:"Ci penso io",do:{startQuest:"stazione"},then:[{if:{helpers:7},then:[{say:"Aspetta, Ivo: quasi tutto il paese mi deve già un favore. Scommetto che ci stanno tutti!",who:"Grimo"},"Mezzo paese? Fammi prendere la lista. E la matita. E gli occhiali."],else:[{if:{helpers:1},then:[{say:"Guarda che un po’ di gente l’ho già aiutata. Una mano te la danno di sicuro.",who:"Grimo"},"Ah sì? Fammi prendere la lista, che me li segno subito."],else:[{say:"Non conosco ancora quasi nessuno… ma posso cominciare!",who:"Grimo"},"Davvero? Allora io intanto… riparo la maniglia. Di nuovo. Quando ci sono tutti, torna da me."]}]}]},{label:"Adesso no",then:["Va bene. Ho aspettato undici anni, aspetto ancora un pochino."]}]}]},"q.stazione.progress":{who:"Ivo l’operaio",steps:["Hai portato la lettera a Marta la postina? Io intanto lucido il tabellone. Così, per scaramanzia."]},"q.stazione.deliver":{who:"Ivo l’operaio",steps:["Hanno risposto! Da domani il treno ferma di nuovo a Sasso Marconi!","Io resto qui a fare il capostazione. Wilma dice che il nonno sarebbe contento.","E da adesso, quando vuoi far arrivare qualcuno col treno, vieni da me: telefono a Bologna e lo facciamo salire. Juicy Gustavo, per esempio, è ancora in tour…","Tieni, è la mia prima paga da capostazione: metà è tua.","Ah, e Hans e Greta prendono il primo treno per Bologna: ti salutano tanto. Greta ha detto: «Auf Wiedersehen, Beba!»"]},"q.stazione.marta":{who:"Marta la postina",steps:["La lettera di Ivo per le Ferrovie? Raccomandata, urgente, con il francobollo più bello che ho.","Anzi: telefono io a mio cugino che lavora a Bologna. …Fatto! Dice di sì! Corri a dirlo a Ivo!"]},"treno.juicy":{who:"",steps:["Dal treno scende un uomo con tre valigie, due casse e un cappello enorme: Juicy Gustavo!",{say:"Juicy: «Collega! Il tour con IndiePisol è finito, e Sasso mi mancava. Lo studio riapre: facciamo musica!»",who:""},{say:"(Il progetto musicale è cominciato: lo studio di Juicy, sotto la piazza, è aperto dalle 10 alle 23:30.)",who:""}]},"treno.pubblico":{who:"",steps:["Ivo telefona alle stazioni della valle: Bologna, Casalecchio, Vergato.","«Concerto in piazza a Sasso Marconi!» Sui treni di quella sera viaggeranno gli spettatori."]},"q.giro_posta.offer":{who:"Marta la postina",steps:["Grimo! Mi daresti una mano? Ho tre cartoline e le gambe che dicono basta.","Una per Teresa al forno, una per Aldo agli orti, una per Lia al Negozio Animali.",{choice:"AIUTI MARTA?",options:[{label:"Ci penso io",do:{startQuest:"giro_posta"},then:["Sei un angelo con le scarpe da ginnastica!"]},{label:"Adesso no",then:["Va bene, cammino io. Piano piano."]}]}]},"q.giro_posta.progress":{who:"Marta la postina",steps:["Teresa al forno, Aldo agli orti, Lia al Negozio Animali. Grazie!"]},"q.giro_posta.teresa":{who:"Teresa",steps:["Una cartolina da mia sorella al mare! Dice che l’acqua è calda e il pane fa schifo. Ah, che soddisfazione."]},"q.giro_posta.aldo":{who:"Aldo",steps:["Dal consorzio agrario: «semi in arrivo». Arriveranno quando le zucchine saranno finite. Cioè mai."]},"q.giro_posta.lia":{who:"Lia",steps:["Una foto di un gatto che ho dato in adozione! Guarda com’è grasso e felice. Missione compiuta."]},"q.giro_posta.deliver":{who:"Marta la postina",steps:["Tutte consegnate? Mi hai salvato le ginocchia. Tieni, per il disturbo."]},"q.tartufi.offer":{who:"Silvia",steps:["Grimo, ho un sogno: il borlengo al tartufo. Profumo di bosco, stracchino, e la gente in fila fino al Conad.","Su al castagneto, sotto le radici dei castagni, ci sono i tartufi neri. Ma bisogna fiutarli. E io ho il raffreddore da tre anni.",{choice:"CERCHI I TARTUFI?",options:[{label:"Ci pensa Beba",do:{startQuest:"tartufi"},then:["Tre tartufi bastano. Beba sa dove scavare: tu segui la coda!"]},{label:"Adesso no",then:["Va bene, per oggi borlengo normale. Che comunque è un capolavoro."]}]}]},"q.tartufi.progress":{who:"Silvia",steps:["Tre tartufi neri, su al castagneto. Quando Beba alza la coda e fa il punto esclamativo, sei vicina!"]},"q.tartufi.deliver":{who:"Silvia",steps:["Senti che profumo! Beba, sei un genio con le orecchie.","Stasera borlengo al tartufo per tutto il paese. Il primo è vostro. Anzi, i primi due: uno per Beba, senza tartufo."]},"treno.papa":{who:"",steps:["Dal treno scendono papà, abbronzatissimo, con un cappello di paglia, e la sua fidanzata, con due valigie piene di souvenir.",{say:"Papà: «Grimo! Beba! Siamo venuti a trovarvi! Ornella voleva vedere Sasso Marconi. E io volevo vedere voi.»",who:""},{say:"(Papà e la sua fidanzata passano la giornata in paese: li trovi in piazza fino alle 20.)",who:""}]},"treno.papa_domani":{who:"",steps:["Ivo telefona a papà. «Il treno di stasera è pieno: arriviamo domani mattina col primo!»",{say:"(Domani papà e la sua fidanzata sono in piazza dalle 9 alle 20.)",who:""}]},"npc.papa_v":{who:"Papà",steps:[{rotate:"papa_visita",variants:[["Grimo! Fatti abbracciare. Anche tu, Beba. Soprattutto tu, Beba: mi sei mancata di più. Scherzo!"],["Orietta dice che Sasso Marconi è bellissimo. Io le ho detto che il paese è bello, ma la gente è meglio."],["Ho visto la stazione: sembra nuova! Ivo mi ha detto che l’hai sistemata tu. Con tutto il paese. Che figlia ho!"],["In vacanza ho imparato a fare il windsurf. Cioè, a cadere dal windsurf. Con molto stile."],[{if:{flag:"juicy_tornato"},then:["Juicy Gustavo dice che canti benissimo. Io lo sapevo già: cantavi anche nel passeggino."],else:["Lo studio di Juicy è ancora chiuso? Quando riapre, voglio il primo CD. Autografato."]}],["Tua madre sta bene? Mi hanno detto di un certo Lucio… Bene, bene. Sono contento. Davvero. …Com’è, simpatico?"]]}]},"npc.ornella":{who:"La fidanzata",steps:[{rotate:"ornella",variants:[["Il mio nome? Tuo padre ne ha provati una decina. Quello vero è…","Oh, guarda, Beba ha trovato un bastone! Che brava!"],["Finalmente ti conosco dal vivo! Tuo padre parla sempre di te. E di Beba. Più di Beba, in effetti."],["Abbiamo portato un regalo per Beba: un osso di gomma che suona. Tuo padre l’ha provato in treno. Tutto il viaggio."],["Che bel paese! Le colline, la piazza, la fontana… e quel profumo di crescentine che arriva da ogni parte."],["Tuo padre in vacanza si è scottato il naso il primo giorno. Ha passato il resto della settimana sotto l’ombrellone a leggere gialli."],["Se ti va, una volta vieni tu da noi al mare. Con Beba, naturalmente: c’è una spiaggia per i cani."]]}]},"amici.daria":{who:"Daria",steps:["Grimo! Che bello vederti! E Beba, ciao bellissima!","Ho letto che a Sasso c’è un negozio dell’usato. Lo sai che non resisto: mi ci porti?"]},"amici.giulia":{who:"Giulia",steps:["Eccomi! Ho portato la tavola, ovviamente.","Mi hanno detto che lo skatepark di Sasso ha una rampa nuova. Andiamo a vederla?"]},"amici.giulia_p":{who:"Giulia di Sette",steps:[{say:"Le porte del treno si aprono e Giulia è già giù. Abbraccio volante: le valigie cadono, nessuna delle due le raccoglie.",who:""},"Grimo! Quanto mi sei mancata. Non sto piangendo, eh: è il vento del treno.",{say:"Beba le salta addosso e chiude la questione: adesso sono tutte e due coperte di peli.",who:""},"Allora. Ho una fame da lupi. Qui c’è una pizzeria buona? Portami lì, stavolta offro io. Forse."]},"amici.wattia":{who:"Wattia",steps:["Grimo! Ciao! Sono sceso dal treno al volo, ho quasi lasciato una scarpa sul binario.","Ti trovo… bene. Molto bene. Troppo bene. Mi sudano le mani, ignora.","Mi avevi parlato dei Laghetti di Porziola. Picnic? Prima passiamo dalla Baracchina, io ho fame di emozioni. E di pizza.",{say:"Prrrt.",who:""},"…Il treno. Era il treno che frenava. Andiamo?"]},"amici.fremurgi":{who:"Fre",steps:["Grimo! Sono appena tornato dal campo scout: ho ancora il fazzolettone e so fare undici nodi. Dodici, se conti quello delle scarpe.",{say:"Murgi arriva dopo, di corsa: dalla stazione è venuto correndo, per allenamento. Ha la mandibola fasciata.",who:""},{say:"Murgi: «Mmh-mmh! Mmmh mh-mmh mmh!»",who:""},"Traduco: nel bosco ci sono i tartufi e Beba ha un naso pazzesco. Lui per un po’ li annusa e basta: il dottore ha detto niente cose dure da masticare.","Ci portiamo Beba a cercarli? Dai, dai, dai! Uno scout trova sempre la strada."]},"q.amico_daria.progress":{who:"Daria",steps:["Il negozio dell’usato è di qua? Andiamo, prima che qualcuno si prenda le cose belle!"]},"q.amico_daria.deliver":{who:"Daria",steps:["Il vinile! Del ’79! Nadia non sapeva nemmeno di averlo: era sotto una pila di centrini.","Grimo, tu devi fare dischi. Veri. Il primo lo compro e lo metto accanto a questo.",{say:"(Daria segue la tua musica: è la tua prima sostenitrice!)",who:""},{say:"(Daria resta a Sasso: dorme all’Hotel Reno di Sandro, l’amico di Lucio, che agli amici di Grimo fa metà prezzo.)",who:""}]},"q.amico_giulia.progress":{who:"Giulia",steps:["Lo skatepark è in fondo al paese, giusto? Sento già il rumore delle ruote."]},"q.amico_giulia.deliver":{who:"Giulia",steps:["Hai visto? Ollie, mezzo giro… e quasi atterraggio! Baby Boss ha applaudito, credo per educazione.","Sai cosa ci vorrebbe qui? Una canzone tua dalle casse mentre giriamo. Promettimi che la fai.",{say:"(Giulia segue la tua musica: un’altra sostenitrice!)",who:""},{say:"(Giulia resta a Sasso: di giorno allo skatepark, la sera all’Hotel Reno di Sandro, a metà prezzo.)",who:""}]},"q.amico_giulia_p.progress":{who:"Giulia di Sette",steps:["La pizzeria è vicina? Dimmi di sì. Ti prego dimmi di sì."]},"q.amico_giulia_p.deliver":{who:"Giulia di Sette",steps:["Due pizze! Una per me e… una per me. Scherzo. Metà ciascuna. Forse.","Questa margherita è un capolavoro. Anche tu sei un’artista, eh: quando esce il tuo disco lo ascolto mangiando la pizza.","Comunque sono contenta di essere qui. Tanto. Non te lo ripeto, sennò ti monti la testa.",{say:"(Giulia di Sette segue la tua musica: un’altra sostenitrice!)",who:""},{say:"(Giulia di Sette resta a Sasso: dorme all’Hotel Reno, vicino alla pensione. Sandro le ha già consigliato tre pizzerie.)",who:""}]},"q.amico_wattia.dario":{who:"Silvia",steps:["Un picnic con quel ragazzo che aspetta qui fuori? Quello che saluta la vetrina?","Allora vi preparo due tranci di pizza, due gazzose e un borlengo da dividere. Dividere, eh.",{say:"(Hai preso pizza, gazzose e un borlengo. Wattia ti aspetta fuori.)",who:""}]},"q.amico_wattia.lago":{who:"Wattia",steps:[{if:{flag:"wattia_lago_visto"},then:["Di nuovo qui. Io, te, Beba e le rane. Le rane fanno sempre quel rumore, eh. Sono le rane.",{say:"Mangiate la pizza sulla riva, in silenzio, guardando l’acqua. Si sta bene.",who:""},"Grazie, Grimo. Ci vediamo stasera? Il sacco a pelo è sempre lì."],else:[{say:"Ai Laghetti di Porziola l’acqua è ferma e piena di cielo. Vi sedete sull’erba, Beba in mezzo.",who:""},"Pizza al taglio sulla riva di un lago. Grimo, questa è la cosa più elegante che abbia mai fatto.",{say:"Mangiate, ridete, Wattia rovescia mezza gazzosa sulle scarpe. Beba si prende il borlengo. Tutto. Nessuno protesta.",who:""},"Ti posso dire una cosa? Ti ho sentita cantare, una volta, e non me lo sono più tolto dalla testa.","La tua prima canzone me la fai sentire per primo? In cambio prometto di mangiare meno fagioli prima di vederti.",{say:"Grimo ride. Poi guarda l’ora.",who:""},{say:"Grimo: «Devo andare a fare delle cose per la mia musica. Ci sentiamo dopo? Se vuoi, stanotte dormi da me: in soggiorno c’è il sacco a pelo.»",who:""},"Davvero? Sì. Cioè, sì, grazie. Porto il cuscino. Ho un cuscino da viaggio. Lo porto sempre. Per le emergenze.",{say:"(Wattia resta a Sasso: la sera dorme a casa tua, nel sacco a pelo. Mamma ha detto sì. Beba ha detto ni.)",who:""},{do:{flags:["wattia_lago_visto"]}}]}]},"q.amico_wattia.progress":{who:"Wattia",steps:["Prima la Baracchina, poi il lago. Io ti seguo. A distanza di sicurezza. Per te, dico."]},"q.amico_wattia.deliver":{who:"Wattia",steps:["È stato bellissimo. Il sole, l’acqua, le rane. Le rane soprattutto: facevano dei rumori strani. Erano le rane, giuro.","Grimo, ti devo dire una cosa. Ti ho sentita cantare, una volta, e non me lo sono più tolto dalla testa.","La tua prima canzone… me la fai sentire per primo? Io in cambio prometto di mangiare meno fagioli prima di vederti.",{say:"(Beba sbadiglia. Grimo ride. Wattia diventa rosso fino alle orecchie.)",who:""},{say:"(Wattia segue la tua musica, e forse non solo quella.)",who:""},{say:"(Wattia resta a Sasso. Dorme a casa tua, in soggiorno, nel sacco a pelo. Mamma ha detto sì. Beba ha detto ni.)",who:""}]},"q.amico_fremurgi.progress":{who:"Fre",steps:["Il bosco è sopra la collina, oltre il cancello di legno. Beba, conto su di te!"]},"q.amico_fremurgi.deliver":{who:"Fre",steps:["Due tartufi! Beba è un genio, non c’è niente da fare.",{say:"Murgi: «Mmh mmh-mmh!» (Ti fa vedere un biglietto: «Stasera borlenghi al tartufo. Io li guardo. Domani diciamo a tutti di ascoltare Grimo.»)",who:""},{say:"(Fre e Murgi seguono la tua musica: altri due sostenitori!)",who:""},{say:"(Fre e Murgi restano a Sasso: dormono all’Hotel Reno di Sandro, l’amico di Lucio. Il corridoio profuma di tartufo.)",who:""}]},"q.mamma_bucato.offer":{who:"Mamma Paola",steps:["Tesoro, non ci crederai: è arrivato un colpo di vento e i calzini di Lucio sono volati via dallo stendino.","Tre calzini a righe, spaiati per tutto il parco.",{choice:"CERCHI I CALZINI?",options:[{label:"Ci penso io",do:{startQuest:"mamma_bucato"},then:["Grazie, tesoro. Beba ha il naso giusto: i calzini di Lucio si sentono da lontano."]},{label:"Adesso no",then:["Va bene. Lucio può anche girare con un calzino solo, è un tipo originale."]}]}]},"q.mamma_bucato.progress":{who:"Mamma Paola",steps:["Trovati? Lucio dice che quello col buco è il suo preferito."]},"q.mamma_bucato.deliver":{who:"Mamma Paola",steps:["Tutti e tre! Anche quello col buco. Lucio sarà felicissimo.","Tieni, una cosina per il disturbo."]},"q.mamma_fiori.offer":{who:"Mamma Paola",steps:["Il balcone è triste, tesoro. Solo un geranio, e pure stanco.","Aldo agli orti ha sempre piantine in più. Me ne porteresti qualcuna?",{choice:"VAI DA ALDO?",options:[{label:"Ci penso io",do:{startQuest:"mamma_fiori"},then:["Brava! Digli che poi gli porto una torta."]},{label:"Adesso no",then:["Allora il geranio resterà solo ancora un po'."]}]}]},"q.mamma_fiori.progress":{who:"Mamma Paola",steps:["Aldo è agli orti, nel quartiere alto. Ha sempre le mani sporche di terra, lo riconosci subito."]},"q.mamma_fiori.deliver":{who:"Mamma Paola",steps:["Petunie! E basilico! Il balcone sarà il più bello di Sasso.","Lucio dice che le innaffierà lui. Vedremo."]},"q.mamma_fiori.aldo":{who:"Aldo",steps:["Per Paola? Ma certo. Petunie, basilico e un po' di rosmarino.","Dille che la torta la preferisco di mele."]},"q.mamma_libro.offer":{who:"Mamma Paola",steps:["Ho finito il libro che mi aveva prestato la signora Ada. Un giallo, tesoro: l'assassino era il giardiniere!","Non dirlo a nessuno. E riportaglielo tu? Io oggi ho il mal di piedi.",{choice:"RIPORTI IL LIBRO?",options:[{label:"Ci penso io",do:{startQuest:"mamma_libro"},then:["Grazie. Chiedile se ne ha un altro, di quelli con il giardiniere."]},{label:"Adesso no",then:["Va bene, glielo porto domani. Forse."]}]}]},"q.mamma_libro.progress":{who:"Mamma Paola",steps:["La signora Ada è sulla sua panchina, in piazza."]},"q.mamma_libro.deliver":{who:"Mamma Paola",steps:["Un altro giallo! E questa volta il colpevole è… no, non guardo l'ultima pagina.","Grazie, tesoro."]},"q.mamma_libro.ada":{who:"Signora Ada",steps:["Finito già? Brava la tua mamma.","Tieni, dalle questo: c'è un maggiordomo che non mi convince per niente."]},"q.mamma_crostata.offer":{who:"Mamma Paola",steps:["Domenica faccio la crostata, come la faceva la nonna.","Mi servono tre frutti belli maturi. Quelli del frutteto del Rio Verde sono i migliori.",{choice:"PORTI LA FRUTTA?",options:[{label:"Ci penso io",do:{startQuest:"mamma_crostata"},then:["Brava. La prima fetta è tua, la seconda di Beba (senza zucchero)."]},{label:"Adesso no",then:["Allora farò la crostata senza frutta. Cioè una pasta frolla triste."]}]}]},"q.mamma_crostata.progress":{who:"Mamma Paola",steps:["Tre frutti, tesoro. Il frutteto è vicino al Agriturismo Rio Verde, in campagna."]},"q.mamma_crostata.deliver":{who:"Mamma Paola",steps:["Che profumo! Domenica crostata per tutti.","Tieni: un anticipo, in biscotti per Beba."]},"q.mamma_crostata.manca":{who:"Mamma Paola",steps:["Ne servono tre, tesoro. Il frutteto è in campagna, vicino al Rio Verde."]},"q.lucio_bici.offer":{who:"Lucio",steps:["Grimo, ti dico un segreto: domenica porto tua mamma a fare un giro in bici lungo il Reno.","Solo che la catena è saltata e io di meccanica capisco… zero. Gino al casale ha tutti gli attrezzi.",{choice:"VAI DA GINO?",options:[{label:"Ci penso io",do:{startQuest:"lucio_bici"},then:["Sei un tesoro. Ma acqua in bocca con la mamma!"]},{label:"Adesso no",then:["Capisco. Allora domenica andiamo a piedi. Lentamente."]}]}]},"q.lucio_bici.progress":{who:"Lucio",steps:["Gino sta davanti al casale, nel quartiere alto. È uno burbero, ma buono."]},"q.lucio_bici.deliver":{who:"Lucio",steps:["Una pinza vera! Vediamo… clic. Ce l'ho fatta! Sono un meccanico!","Domenica si pedala. Grazie, Grimo."]},"q.lucio_bici.gino":{who:"Gino",steps:["La pinza? Per Lucio? Mah. Basta che me la riporti intera.","E digli di girare la catena verso destra. Sempre verso destra."]},"q.lucio_pesca.offer":{who:"Lucio",steps:["Tua mamma dice che pescare rilassa. Io non ho mai preso un pesce in vita mia.","Mi accompagni ai laghetti? Da solo mi perdo, l'ultima volta sono finito a Pontecchio.",{choice:"LO ACCOMPAGNI?",options:[{label:"Ci penso io",do:{startQuest:"lucio_pesca"},then:["Andiamo! Io ti seguo, tu non correre."]},{label:"Adesso no",then:["Va bene, ci andremo un'altra volta. Il pesce aspetta."]}]}]},"q.lucio_pesca.progress":{who:"Lucio",steps:["I laghetti sono in campagna, giusto? Ti seguo."]},"q.lucio_pesca.deliver":{who:"Lucio",steps:["Che pace. Anche senza pescare niente, si sta benissimo.","Grazie, Grimo. Adesso capisco perché ti piace stare qui."]},"q.lucio_cruciverba.offer":{who:"Lucio",steps:["Sette lettere: «antico nome di Sasso». È mezz'ora che ci penso.","La signora Ada sa tutto del paese. Me lo chiederesti?",{choice:"CHIEDI AD ADA?",options:[{label:"Ci penso io",do:{startQuest:"lucio_cruciverba"},then:["Grazie! Io intanto faccio finta di saperlo."]},{label:"Adesso no",then:["Va bene, lascio la casella vuota. Mi tormenterà tutta la notte."]}]}]},"q.lucio_cruciverba.progress":{who:"Lucio",steps:["Sette lettere… Sassoni? No, sono sei."]},"q.lucio_cruciverba.deliver":{who:"Lucio",steps:["«Praduro»! Ma certo! Ci sta perfetto.","Cruciverba finito. Tua mamma sarà fiera di me."]},"q.lucio_cruciverba.ada":{who:"Signora Ada",steps:["Antico nome di Sasso? Praduro, cara. Praduro e Sasso, prima ancora di Marconi.","Questi giovani di sessant'anni non sanno più niente."]},"q.lucio_serenata.offer":{who:"Lucio",steps:["Grimo, voglio cantare una canzone alla tua mamma. Una serenata, come una volta.","Solo che sono stonato. Molto stonato. Nico con la chitarra mi coprirebbe un po'…",{choice:"PARLI CON NICO?",options:[{label:"Ci penso io",do:{startQuest:"lucio_serenata"},then:["Sei un angelo. Digli che pago in focacce."]},{label:"Adesso no",then:["Allora canterò a cappella. Che Dio ci aiuti."]}]}]},"q.lucio_serenata.progress":{who:"Lucio",steps:["Nico è quello con la chitarra, lo trovi in piazza."]},"q.lucio_serenata.deliver":{who:"Lucio",steps:["Nico ci sta? Allora stasera, sotto il balcone fiorito. Che emozione!","Se va male, dirò che è colpa del vento."]},"q.lucio_serenata.nico":{who:"Nico",steps:["Una serenata? Per tua mamma? Ma che carino.","Digli di sì. E che io suono forte, così non si sente quando stona."]},"q.edo_comparse.offer":{who:"Edo",steps:["Scena trentadue: il mercato. Mi serve una folla.","Una folla di almeno tre persone. Vale e Tommy dello skate park, e Nico. Me li convinci tu?",{choice:"CERCHI LE COMPARSE?",options:[{label:"Ci penso io",do:{startQuest:"edo_comparse"},then:["Ottimo. Digli che c'è il pranzo pagato. Un panino. Diviso."]},{label:"Adesso no",then:["Allora la scena del mercato sarà un mercato vuoto. Molto poetico."]}]}]},"q.edo_comparse.progress":{who:"Edo",steps:["Ne mancano ancora: Vale, Tommy e Nico."]},"q.edo_comparse.deliver":{who:"Edo",steps:["Tre comparse! Il mio mercato avrà una folla vera.","Grimo, nei titoli di coda ci sarà anche il tuo nome. Piccolo, ma c'è."]},"q.edo_comparse.vale":{who:"Vale",steps:["In un film? Io? Posso fare la skater misteriosa?","Ci sto!"]},"q.edo_comparse.tommy":{who:"Tommy",steps:["Se posso tenere la tavola in mano, ci sto."]},"q.edo_comparse.nico":{who:"Nico",steps:["Comparsa? Ok, ma suono anche la colonna sonora. Scherzo. Forse."]},"q.edo_pioggia.offer":{who:"Edo",steps:["Piove! Finalmente! Mi serve la piazza bagnata per la scena triste.","Vai a guardarla per me? Le pozzanghere, i riflessi, i lampioni…",{choice:"VAI IN PIAZZA?",options:[{label:"Ci penso io",do:{startQuest:"edo_pioggia"},then:["Perfetto. E guarda se c'è un cane bagnato. Un cane bagnato è cinema puro."]},{label:"Adesso no",then:["Peccato. La pioggia non aspetta i registi."]}]}]},"q.edo_pioggia.progress":{who:"Edo",steps:["Com'è la piazza? Ci sono riflessi?"]},"q.edo_pioggia.deliver":{who:"Edo",steps:["Pozzanghere grandi e lampioni che si riflettono? Bellissimo.","Beba bagnata è il cane bagnato più cinematografico che abbia mai visto."]},"q.edo_ciak.offer":{who:"Edo",steps:["Disastro! Ho perso il ciak. Senza ciak non posso dire «azione».","Beba ha un buon naso, vero? È bianco e nero, come i film di una volta.",{choice:"CERCHI IL CIAK?",options:[{label:"Ci penso io",do:{startQuest:"edo_ciak"},then:["Grazie. Io intanto dico «azione» battendo le mani. Non è la stessa cosa."]},{label:"Adesso no",then:["Va bene. Batterò le mani. Clap."]}]}]},"q.edo_ciak.progress":{who:"Edo",steps:["L'ultima volta che l'ho visto ero al set, poi in piazza, poi… boh."]},"q.edo_ciak.deliver":{who:"Edo",steps:["Il mio ciak! Scena trentatré, prima: azione!","Sei una produttrice nata, Grimo."]},"q.edo_locandina.offer":{who:"Edo",steps:["Guarda: la locandina del film. «Sasso, un amore di paese». Ti piace?","Vorrei appenderla al Tamarindo, dove passa tutto il paese. Me la porti da Rosa?",{choice:"PORTI LA LOCANDINA?",options:[{label:"Ci penso io",do:{startQuest:"edo_locandina"},then:["Grande. Attenta a non piegarla, è l'unica copia."]},{label:"Adesso no",then:["Va bene, la tengo arrotolata ancora un po'."]}]}]},"q.edo_locandina.progress":{who:"Edo",steps:["Rosa è al bancone del Tamarindo, il bar in paese."]},"q.edo_locandina.deliver":{who:"Edo",steps:["È appesa davvero? Accanto alla macchinetta del caffè? È il posto più visto di Sasso!","Grazie, Grimo. Alla prima ti tengo un posto in prima fila."]},"q.edo_locandina.rosa":{who:"Rosa",steps:["Una locandina? Ma che bella. Il cane in primo piano è Beba?","La metto accanto alla macchinetta del caffè: la vedranno tutti."]},"q.papa_foto.offer":{who:"Papà",steps:["Grimo, Ornelia vorrebbe una bella foto di Sasso dall'alto. Ma io con le salite ho chiuso nel 1998.","Saliresti tu al belvedere? Poi ci racconti com'è.",{choice:"SALI AL BELVEDERE?",options:[{label:"Ci penso io",do:{startQuest:"papa_foto"},then:["Brava la mia ragazza. Noi intanto ci prendiamo un caffè."]},{label:"Adesso no",then:["Va bene, la foto la facciamo dalla piazza. Si vede il campanile, è già qualcosa."]}]}]},"q.papa_foto.progress":{who:"Papà",steps:["Il belvedere è in cima alla collina. Fai piano, che io da qui ti guardo e già mi stanco."]},"q.papa_foto.deliver":{who:"Papà",steps:["Si vede fino a Bologna? E il Reno che brilla? Lorella, hai sentito?","La prossima volta saliamo tutti insieme. Con calma. Molta calma."]},"q.papa_borlenghi.offer":{who:"Papà",steps:["Grimo, una domanda seria: questi borlenghi di cui parlano tutti, esistono davvero?","Perché io ho una fame che non ti dico. Rossella dice che li ho già nominati dodici volte.",{choice:"VAI DA DARIO?",options:[{label:"Ci penso io",do:{startQuest:"papa_borlenghi"},then:["Due, anzi tre. Uno per Fiorella. Anzi quattro."]},{label:"Adesso no",then:["Allora resisto. Eroicamente. Ancora cinque minuti."]}]}]},"q.papa_borlenghi.progress":{who:"Papà",steps:["La Baracchina è vicino al parco, no? Sento già il profumo. O me lo immagino."]},"q.papa_borlenghi.deliver":{who:"Papà",steps:["Mmm. Esistono davvero. E sono anche meglio dei racconti.","Mirella, assaggia. No, aspetta, finisco il mio."]},"q.papa_borlenghi.dario":{who:"Silvia",steps:["Per tuo papà? Allora quattro, con il pesto modenese.","Offre la casa. Ma digli di tornare."]},"q.papa_cappello.offer":{who:"Papà",steps:["Grimo! Una folata e il mio cappello è volato via. Il mio cappello preferito!","Antonella dice che sto meglio senza. Ornellina mente.",{choice:"CERCHI IL CAPPELLO?",options:[{label:"Ci penso io",do:{startQuest:"papa_cappello"},then:["Grazie. Io intanto mi riparo all'ombra del campanile."]},{label:"Adesso no",then:["Allora mi scotterò la pelata. È il prezzo della libertà."]}]}]},"q.papa_cappello.progress":{who:"Papà",steps:["È di paglia, con un nastro blu. Non puoi sbagliarti."]},"q.papa_cappello.deliver":{who:"Papà",steps:["Il mio cappello! Un po' spiegazzato, ma vivo.","Beba, sei la mia eroina. Grimo, anche tu."]},"q.papa_souvenir.offer":{who:"Papà",steps:["Lunedì torno in ufficio e i colleghi vorranno un souvenir.","Una calamita è triste. Due ciambelle della nonna, invece, sono un ricordo vero.",{choice:"COMPRI LE CIAMBELLE?",options:[{label:"Ci penso io",do:{startQuest:"papa_souvenir"},then:["Brava. Se ne mangio una sul treno, non dirlo a nessuno."]},{label:"Adesso no",then:["Allora porterò una calamita. Che tristezza."]}]}]},"q.papa_souvenir.progress":{who:"Papà",steps:["Il Forno di Teresa è in paese, verso la stazione. Due ciambelle."]},"q.papa_souvenir.deliver":{who:"Papà",steps:["Profumano ancora. Arriveranno in ufficio? Non garantisco.","Grazie, Grimo. Sasso ti fa bene, si vede."]},"q.papa_souvenir.manca":{who:"Papà",steps:["Ne servono due, Grimo. Una per collega. Ne ho due. Di colleghi simpatici."]},"q.amico_giulia_p.manca":{who:"Giulia di Sette",steps:["Due pizze, Grimo. Da portare via. Alan le fa nella pizzeria qui
